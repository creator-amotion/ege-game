<style>
:root{--bg:#0a0a14;--card:#13132a;--card2:#1a1a35;--acc:#e94560;--g:#4ecca3;--y:#ffd700;--b:#74c0fc;--txt:#eaeaea;--m:#8a90a0;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:Segoe UI,system-ui,sans-serif;min-height:100vh}
nav{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid #2a2a4e;position:sticky;top:0;z-index:10}
nav b{flex:1;text-align:center;color:var(--acc);font-size:16px}
.nb{background:none;border:1px solid #3a3a5e;color:var(--txt);padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13px;text-decoration:none}
#xp{font-size:12px;color:var(--y);font-weight:700;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:14px 0 4px;background:linear-gradient(135deg,var(--acc),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--m);font-size:14px;margin-bottom:12px;line-height:1.55}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;background:var(--acc);color:#fff;text-align:center}
.btn.sec{background:none;border:1px solid #3a3a5e;color:var(--txt)}
.btn.ok{background:var(--g);color:#0a0a14}
.pk{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid #2a2a4e;border-radius:var(--r);padding:16px;width:100%;margin-top:10px;cursor:pointer;color:var(--txt)}
.pk:hover{border-color:var(--b)}
.pk .ic{font-size:32px}
.pk .t{flex:1;font-size:16px;font-weight:700}
.pk .t small{display:block;font-weight:400;color:var(--m);font-size:13px;margin-top:3px}
.bar{width:80px;height:8px;background:#22223c;border-radius:4px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--g)}
.sk{padding:10px 0;border-bottom:1px solid #22223c}
.sk:last-of-type{border:none}
.skrow{display:flex;align-items:center;gap:10px}
.sk .nm{flex:1;font-size:15px;line-height:1.35}
.sk .nm small{color:var(--m);display:block;margin-top:2px;font-size:12px}
.lv{font-size:18px;flex:none;width:26px;text-align:center}
.help{background:var(--card2);border-radius:10px;padding:11px 12px;margin-top:8px;font-size:14px;line-height:1.6;white-space:pre-line}
.help b{color:var(--y)}
.task{font-size:17px;line-height:1.7;white-space:pre-line}
.dots{display:flex;gap:6px;margin:0 0 10px}
.dot{flex:1;max-width:40px;height:7px;border-radius:4px;background:#2a2a4e}
.dot.cur{background:var(--b)}.dot.ok{background:var(--g)}.dot.bad{background:var(--acc)}
.tag{font-size:12px;color:var(--b);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.q{font-size:18px;font-weight:700;margin:12px 0;line-height:1.55}
.opt{display:block;width:100%;padding:14px;margin-top:10px;border:2px solid #3a3a5e;border-radius:12px;background:var(--card);color:var(--txt);font-size:16px;font-weight:600;cursor:pointer;text-align:left;white-space:normal;word-break:break-word;line-height:1.5}
.opt:hover{border-color:var(--b)}
.inp{width:100%;padding:14px;border-radius:12px;border:2px solid #3a3a5e;background:var(--card2);color:var(--txt);font-size:20px;margin-top:6px}
.keys{display:flex;gap:8px;margin-top:8px}
.keys button{flex:1;padding:11px 0;border-radius:10px;border:1px solid #3a3a5e;background:var(--card2);color:var(--txt);font-size:20px;font-weight:700;cursor:pointer}
.keys button:active{border-color:var(--b)}
.tag.think{color:var(--y)}
.fb{border-radius:11px;padding:12px 14px;margin:10px 0;font-size:15px;line-height:1.6}
.fb.good{background:#10281f;border:1px solid #1f5a43;color:#9be9c9}
.fb.bad{background:#2a1218;border:1px solid #5b2331;color:#ffb3c0}
.stars{font-size:34px;text-align:center;letter-spacing:6px;margin:6px 0}
.res li{list-style:none;margin:8px 0;font-size:15px;line-height:1.6}
.katex{font-size:1.05em}
.kth{background:var(--card2);border-radius:10px;padding:10px 12px;margin:10px 0}
.kth summary{cursor:pointer;font-weight:700;font-size:14.5px;line-height:1.4}
.kth ul{margin:6px 0 0;padding-left:20px}.kth li{margin:7px 0;font-size:14.5px;line-height:1.55}
.kth .btn{margin-top:8px}
.tabs2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0 0 14px;border:2px solid var(--ink,#2a2a4e);border-radius:0}
.tabs2 .tab{min-height:46px;border:0;border-right:2px solid var(--ink,#2a2a4e);background:transparent;color:var(--ink,var(--txt));font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 2px;line-height:1.15}
.tabs2 .tab:last-child{border-right:0}
.tabs2 .tab.on{background:var(--ink,var(--b));color:var(--paper,#0a0a14)}
.rulebox{background:var(--card2);border-radius:10px;padding:11px 12px;margin-top:8px;font-size:14.5px;line-height:1.6;white-space:pre-line}
.rulebox b{color:var(--y)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid #3a3a5e;background:none;color:var(--txt);padding:8px 13px;border-radius:18px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--b);color:#0a0a14;border-color:var(--b)}
.src{color:var(--m);font-size:12px;margin-top:4px}
.fig{display:block;max-width:100%;margin:8px auto;background:#fff;border-radius:8px;padding:6px}
.cues,.alg,.traps{margin:6px 0 0;padding:0}
.cues li{list-style:none;margin:9px 0;font-size:14.5px;line-height:1.5}
.cues .if{display:block;font-weight:700}
.cues .do{display:block;color:var(--m);margin-top:2px}
.alg{padding-left:22px}.alg li{margin:5px 0;font-size:14.5px;line-height:1.5}
.traps li{list-style:none;margin:5px 0;font-size:14px;line-height:1.5}
.traps li:before{content:'⚠ ';color:var(--acc)}
.fm{display:inline-block;background:var(--card2);border-radius:8px;padding:4px 9px;margin:3px 4px 0 0;font-size:13.5px}
</style>

<body class="math">
<nav><button class="nb" id="back">←</button><b id="title">Математика</b><span id="xp"></span></nav>
<main id="app"></main>

<script>
// ── Параметры знания — те же, что в боте (bkt.py) ──
const P_L0=0.30,P_T=0.09,P_S=0.10,P_G=0.20,MAX_TRIES=2,ROUNDS=10;
let INDEX=null, PACK=null, packCache={}, prog={}, xp=0, session=[], cur=null, gm=null, view='home', openHelp=null;
let packTab='theory', pracNum=0, pracSkill='', pracCache={}, pr=null, ANALYSIS=null, GROUPS_META=null, TOPICS_META=null, pracGroup='', KINDS=null;
const TG=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor('#F3EEE2');TG.setBackgroundColor('#F3EEE2');}catch(e){}}
const $=s=>document.querySelector(s);
const app=$('#app');

function loadAll(){
  try{prog=JSON.parse(localStorage.getItem('math_prog')||'{}')}catch(e){prog={}}
  try{xp=parseInt(localStorage.getItem('math_xp')||'0',10)||0}catch(e){xp=0}
}
function saveAll(){try{localStorage.setItem('math_prog',JSON.stringify(prog));localStorage.setItem('math_xp',String(xp))}catch(e){}}
function pOf(s){return prog[s]?prog[s].p:P_L0}
function level(){return Math.floor(xp/100)+1}
function showXp(){$('#xp').textContent='ур. '+level()+' · '+xp+' XP'}
function record(skill,ok){
  const p=pOf(skill);
  const obs=ok?(p*(1-P_S))/(p*(1-P_S)+(1-p)*P_G):(p*P_S)/(p*P_S+(1-p)*(1-P_G));
  const o=prog[skill]||{a:0,c:0};
  prog[skill]={p:obs+(1-obs)*P_T,a:o.a+1,c:o.c+(ok?1:0)};
  session.push([skill,ok?1:0]);
}
function badge(p){return p>=0.9?'':p>=0.7?'':p>=0.45?'':''}
function badgeText(p){return p>=0.9?'мастер':p>=0.7?'уверенно':p>=0.45?'растёшь':'новичок'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function mathRender(){
  if(window.renderMathInElement){
    try{renderMathInElement(app,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}catch(e){}
  }else{setTimeout(()=>{if(window.renderMathInElement)mathRender()},400)}
}

// Теория по типу задачи (math_kinds.json): свойства, формулы, порядок действий и пример
function kindFig(k,cap){
  const d=KINDS&&KINDS[k];if(!d||!d.fig)return '';
  return '<img class="fig" src="'+d.fig+'" alt="Схема к типу задачи" loading="lazy"><div class="src" style="text-align:center;margin:-2px 0 8px">'+esc(cap||'Схема: так выглядит этот тип задач (буквы — как в условии)')+'</div>';
}
function kindTheory(k,open,label){
  const d=KINDS&&KINDS[k];if(!d||!d.th||!d.th.length)return '';
  return '<details class="kth"'+(open?' open':'')+'><summary>'+esc(label||'Что нужно знать')+': '+esc(d.t)+'</summary>'+kindFig(k)+'<ul>'+d.th.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details>';
}

// ── Числа: дроби и десятичные без погрешностей ──
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
function norm(f){const g=gcd(f[0],f[1]);let [n,d]=[f[0]/g,f[1]/g];if(d<0){n=-n;d=-d}return [n,d]}
function dec(s){const neg=s[0]==='-';if(neg)s=s.slice(1);const p=s.split('.');const d=p[1]||'';const den=Math.pow(10,d.length);const num=parseInt(p[0]+d,10);return norm([neg?-num:num,den])}
function parseNum(s){
  s=String(s).trim().replace(/\s+/g,'').replace(',','.').replace('−','-');
  if(!s)return null;
  let m;
  if((m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/))){const a=dec(m[1]),b=dec(m[2]);if(b[0]===0)return null;return norm([a[0]*b[1],a[1]*b[0]])}
  if(/^-?\d+(\.\d+)?$/.test(s))return dec(s);
  return null;
}
function rnd(x,d){const k=Math.pow(10,d);return Math.round(x*k+1e-9)/k}
function checkNum(user,st){
  const u=parseNum(user);if(!u)return null;
  const v=st.v;
  if(u[0]*v[1]===v[0]*u[1])return true;
  if(st.d!=null)return rnd(u[0]/u[1],st.d)===rnd(v[0]/v[1],st.d);
  return false;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ── Пакеты ──
function loadPack(id){
  if(packCache[id])return Promise.resolve(packCache[id]);
  const meta=INDEX.packs.find(p=>p.id===id);
  return fetch(meta.file).then(r=>r.json()).then(p=>{packCache[id]=p;return p});
}
function skillsOfPack(p){return Object.keys(p.skills)}
function skillsOfNumber(n){return skillsOfPack(PACK).filter(s=>PACK.skills[s].n===n)}
function weightedSkill(skills){
  const withSteps=skills.filter(s=>PACK.tasks.some(t=>t.sk===s));
  if(withSteps.length)skills=withSteps;
  const w=skills.map(s=>Math.pow(1-pOf(s),2)+0.05);
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<skills.length;i++){r-=w[i];if(r<=0)return skills[i]}
  return skills[skills.length-1];
}
function packMastery(p){const s=skillsOfPack(p);return s.reduce((a,k)=>a+pOf(k),0)/s.length}

// ── Экраны ──
// Цвет каждого раздела — из anik-look.js: без повторов, от синего к жёлтому
function packSkin(id){const n=INDEX?INDEX.packs.length:11,k=INDEX?INDEX.packs.findIndex(p=>p.id===id):-1;return AnikLook.ramp(n,true)[k<0?0:k]}
function packNum(p){return p.numbers.length>1?p.numbers[0]+'–'+p.numbers[p.numbers.length-1]:String(p.numbers[0])}
function setView(v){view=v;render()}
function render(){
  showXp();
  document.body.classList.toggle('in-pack',view!=='home');
  if(view==='home')home();else if(view==='pack')packView();else if(view==='task')taskView();
  else if(view==='done')doneView();else if(view==='game')gameView();else if(view==='gdone')gameDone();else if(view==='prac')pracView();else if(view==='pdone')pracDone();else if(view==='ltheory')ltheoryView();else if(view==='ltest')ltestView();
  mathRender();
}
$('#back').onclick=()=>{
  if(view==='home')location.href='./';
  else if(view==='pack')setView('home');
  else setView('pack');
};

function home(){
  $('#title').textContent='Математика (ЕГЭ)';
  let h='<h1>Математика</h1><p class="sub">Выбери раздел. В каждом три вкладки: теория простыми словами, практика (настоящие задания; тему можно изучить по аспектам: теория → тест → разбор по шагам → самостоятельно) и быстрые игры.</p>';
  INDEX.packs.forEach(p=>{
    const m=packCache[p.id]?Math.round(packMastery(packCache[p.id])*100):null;
    const sk=packSkin(p.id);
    h+='<button class="pk" data-p="'+p.id+'" style="--col:'+sk[0]+';--ink:'+sk[1]+';--bigc:'+sk[2]+'"><span class="big" aria-hidden="true">'+packNum(p)+'</span><span class="t">'+esc(p.title.replace(/\s*\(№[^)]*\)/,''))+'<small>'+esc(p.desc)+'</small></span>'
      +(m!==null?'<span class="bar"><i style="width:'+m+'%"></i></span>':'')+'</button>';
  });
  if(session.length)h+='<button class="btn ok" id="send">Отправить результаты боту ('+session.length+' шагов)</button>';
  h+='<p class="sub" style="text-align:center;margin-top:14px">'+(TG?'Результаты уходят боту по кнопке выше.':'Прогресс хранится на этом устройстве.')+'</p>';
  app.innerHTML=h;
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openPack(b.dataset.p));
  const sb=$('#send');if(sb)sb.onclick=sendToBot;
}
function openPack(id){loadPack(id).then(p=>{
  PACK=p;openHelp=null;packTab='theory';pracNum=0;pracSkill='';pracGroup='';
  const sk=packSkin(id);['--col','--ink-p','--bigc'].forEach((v,i)=>document.body.style.setProperty(v,sk[i]));
  setView('pack');
})}

function packView(){
  $('#title').textContent=PACK.title;
  if(packTab==='steps')packTab='practice';   // раздела «По шагам» нет: разбор открывается из практики
  const T=[['theory','Теория'],['practice','Практика'],['games','Игры']];
  let h='<div class="tabs2" role="tablist">'+T.map(([k,t])=>'<button class="tab'+(packTab===k?' on':'')+'" data-tab="'+k+'">'+t+'</button>').join('')+'</div>';
  if(packTab==='theory')h+=theoryTab();
  else if(packTab==='practice')h+=practiceTab();
  else h+=gamesTab();
  if(session.length)h+='<button class="btn ok" id="send">Отправить результаты боту ('+session.length+' шагов)</button>';
  app.innerHTML=h;
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{packTab=b.dataset.tab;setView('pack')});
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>gameStart(b.dataset.g));
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>start(b.dataset.t));
  if(packTab==='practice')pracInit();
  const sb=$('#send');if(sb)sb.onclick=sendToBot;
}
// Теория: правило словами и пример к каждому навыку раздела
// Разбор задания: что заметить в условии → алгоритм → ловушки → формулы
function analysisHTML(n){
  const a=ANALYSIS&&ANALYSIS[n];if(!a)return '';
  let h='<div class="card"><div class="tag">Задание №'+n+'</div><b>'+esc(a.title)+'</b><p class="sub" style="margin:6px 0 0">'+esc(a.what)+'</p>';
  if(a.cues.length)h+='<div class="tag" style="margin-top:14px">Что заметить в условии</div><ul class="cues">'+a.cues.map(c=>'<li><span class="if">'+esc(c.if)+'</span><span class="do">→ '+esc(c.do)+'</span></li>').join('')+'</ul>';
  h+='<div class="tag" style="margin-top:14px">Алгоритм</div><ol class="alg">'+a.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>';
  if(a.traps.length)h+='<div class="tag" style="margin-top:14px">Частые ловушки</div><ul class="traps">'+a.traps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(a.formulas.length)h+='<div class="tag" style="margin-top:14px">Формулы</div><div>'+a.formulas.map(x=>'<span class="fm">'+esc(x)+'</span>').join('')+'</div>';
  if(a.themes.length)h+='<div class="src" style="margin-top:12px">Чаще всего в заданиях: '+a.themes.map(x=>esc(x.name)+' — '+x.share+'%').join('; ')+'</div>';
  return h+'</div>';
}
function theoryTab(){
  let h='<p class="sub">'+esc(PACK.desc)+'. Сначала разбор задания, потом правила навыков. Задачи решаем во вкладке «Практика»: там у каждой темы есть разбор по шагам.</p>'+theoryGames();
  const nums=PACK.numbers;
  nums.forEach(n=>{
    const sk=skillsOfNumber(n);
    h+=analysisHTML(n);
    if(!sk.length)return;
    h+='<div class="tag" style="margin-top:14px">Навыки и правила'+(nums.length>1?' · задание №'+n:'')+'</div>';
    sk.forEach(s=>{
      const x=PACK.skills[s],p=pOf(s);
      h+='<div class="card"><div class="skrow"><span class="lv">'+badge(p)+'</span><div class="nm"><b>'+esc(x.name)+'</b><small>'+badgeText(p)+'</small></div></div>'
        +'<div class="rulebox"><b>Правило</b>\n'+esc(x.rule)+'\n\n<b>Пример</b>\n'+esc(x.ex)+'</div>'
        +'</div>';
    });
  });
  return h;
}
// Проверка теории: короткие игры раздела на знание правил и формул (без «Быстрого счёта»)
function theoryGames(){
  const gs=(PACK.games||[]).filter(g=>g.id!=='calc');
  if(!gs.length)return '';
  return '<div class="card"><div class="tag">Проверь себя по теории</div>'+gs.map(g=>'<button class="btn sec" data-g="'+g.id+'" style="text-align:left"><b>'+esc(g.title)+'</b><br><span style="font-weight:400;font-size:13px;color:var(--m)">'+esc(g.desc)+'</span></button>').join('')+'</div>';
}
function gamesTab(){
  let h='<div class="card"><div class="tag">Быстрые игры</div><b>10 вопросов, очки и звёзды</b>';
  PACK.games.forEach(g=>{h+='<button class="btn sec" data-g="'+g.id+'" style="text-align:left"><b>'+esc(g.title)+'</b><br><span style="font-weight:400;font-size:13px;color:var(--m)">'+esc(g.desc)+'</span></button>'});
  return h+'</div>';
}

// ── Практика: настоящие задания, ответ числом ──

// «Приёмы темы»: по каждому типу задач — теория и кнопка разбора именно этого типа
function topicKinds(gid){
  if(!KINDS)return '';

  }).join('');
}
// ── Режим «Изучить тему»: аспект (тип задач) → теория → короткий тест → разбор по шагам → самостоятельно ──
let L=null, lprog={};
// Этап изучения (или практика по типу) уходит боту строкой l_<тип>-<t|s|p><верно><всего>: репетитор видит всю активность, а не только домашнее задание
function sendLearn(k,stage,ok,tot){
  if(!k||!/^[a-z0-9_]{3,44}$/.test(k)||!(tot>=1&&tot<=99&&ok>=0&&ok<=tot))return;
  const p='l_'+k+'-'+stage+String(ok).padStart(2,'0')+String(tot).padStart(2,'0');
  try{window.AnikSync&&AnikSync.send(p)}catch(e){}
}
function loadLearn(){try{lprog=JSON.parse(localStorage.getItem('math_learn')||'{}')}catch(e){lprog={}}}
function saveLearn(){try{localStorage.setItem('math_learn',JSON.stringify(lprog))}catch(e){}}
function lk(k){return lprog[k]||(lprog[k]={})}
function aspectsOf(gid){
  if(!KINDS)return [];
  return Object.keys(KINDS).filter(k=>(KINDS[k].gs||[KINDS[k].g]).includes(gid)).sort((a,b)=>(KINDS[b].pr||0)-(KINDS[a].pr||0)||KINDS[a].t.localeCompare(KINDS[b].t));
}
// статус аспекта: new — не начат, going — идёт, done — изучен, weak — западает (много ошибок в практике)
function aspectState(k){
  const s=lprog[k]||{},p=s.pr||[0,0],tst=s.test;
  if(p[1]>=3&&p[0]/p[1]<0.5)return 'weak';
  if(tst&&tst[0]/tst[1]>=0.67&&s.solo&&s.solo[0]>=Math.min(2,s.solo[1]))return 'done';
  if(s.th||tst)return 'going';
  return 'new';
}
const ST_LABEL={new:'не начат',going:'в процессе',done:'изучен ✓',weak:'западает'};
const ST_COLOR={new:'var(--m)',going:'var(--y,#f5c542)',done:'var(--g,#38d39f)',weak:'var(--r,#ff6b81)'};
function nextAspect(gid){const a=aspectsOf(gid);return a.find(k=>aspectState(k)==='weak')||a.find(k=>aspectState(k)!=='done')||a[0]}
function learnSummary(gid){
  const a=aspectsOf(gid);if(!a.length)return '';
  const cnt={new:0,going:0,done:0,weak:0};a.forEach(k=>cnt[aspectState(k)]++);
  const weak=a.filter(k=>aspectState(k)==='weak').map(k=>KINDS[k].t);
  const nx=nextAspect(gid);
  return '<div class="tag" style="margin-top:12px">Изучение темы по аспектам</div>'
    +'<p class="src" style="margin:0">Изучено: <b>'+cnt.done+'</b> из '+a.length+(cnt.going?' · в процессе: '+cnt.going:'')+'. '+(weak.length?'<b style="color:var(--r,#ff6b81)">Западает:</b> '+weak.map(esc).join('; ')+'.':'Каждый аспект — отдельный приём из заданий: теория, короткий тест, разбор по шагам, самостоятельная задача.')+'</p>'
    +(nx?'<button class="btn" id="learnnext" data-learn="'+nx+'">'+(cnt.done+cnt.going+cnt.weak===0?'Изучить тему: начать':'Изучать дальше')+' — '+esc(KINDS[nx].t)+'</button>':'');
}

// вопросы теста — «выбор» из шагов этого аспекта: общие (без чисел конкретной задачи)
function buildTest(k){
  const gen=t=>t.st.filter(s=>s.k==='choice'&&!s.rc);
  const okQ=s=>[s.q].concat(s.opts).every(x=>!/\d{2,}|\d[,.]\d/.test(String(x).replace(/\d+\^\\circ/g,'').replace(/\d+\^\{\\circ\}/g,'')));
  const seen=new Set(),out=[];
  const pool=shuffle(PACK.tasks.filter(t=>t.k===k));
  pool.forEach(t=>gen(t).forEach(s=>{if(out.length>=6)return;if(seen.has(s.q)||!okQ(s))return;seen.add(s.q);out.push({q:s.q,opts:s.opts,r:s.r})}));
  if(out.length<5){   // добираем вопросы из соседних аспектов той же темы
    const g=(KINDS[k].gs||[KINDS[k].g])[0];
    shuffle(PACK.tasks.filter(t=>t.g===g&&t.k!==k)).forEach(t=>gen(t).forEach(s=>{if(out.length>=6)return;if(seen.has(s.q)||!okQ(s))return;seen.add(s.q);out.push({q:s.q,opts:s.opts,r:s.r})}));
  }
  return out.slice(0,6);
}

function ltestDone(){
  const n=L.tq.length,ok=L.tok,s=lk(L.k),best=s.test;

    +'<button class="btn" id="lgo">'+(pass?'Дальше: разбор по шагам':'Всё равно дальше')+'</button>'
    +(pass?'':'<button class="btn sec" id="lre">Перечитать теорию</button>')

function learnToSteps(){

function startPractice(){
  Promise.all(pracNums().map(n=>loadPractice(n).then(l=>l.map(t=>Object.assign({n},t))))).then(lists=>{
    const all=pracFilter([].concat(...lists)),key='math_seen';
    let seen=[];try{seen=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
    const set=new Set(seen);
    let fresh=all.filter(t=>!set.has(t.id));
    if(fresh.length<Math.min(ROUNDS,all.length)){fresh=all.slice();seen=seen.filter(id=>!all.some(t=>t.id===id))}
    const real=shuffle(fresh.filter(t=>t.r)),own=shuffle(fresh.filter(t=>!t.r));
    const items=shuffle(real.slice(0,Math.min(real.length,Math.ceil(ROUNDS*0.6))).concat(own).slice(0,ROUNDS));
    try{localStorage.setItem(key,JSON.stringify(seen.concat(items.map(t=>t.id)).slice(-1500)))}catch(e){}
    pr={items,i:0,res:[],tries:0,fb:null,gain:0};
    setView('prac');
  });
}

    h+='<div class="fb '+rv.cls+'">'+esc(rv.text).replace(/\n/g,'<br>')+'</div>';
    h+=kindTheory(t.k,rv.cls==='bad','Теория этого типа');
    if(rv.k)h+='<button class="btn sec" id="pstep">Разобрать похожую задачу по шагам</button>';
    h+='<button class="btn" id="pnext">'+(pr.i+1>=pr.items.length?'Итог':'Дальше')+'</button>';
    app.innerHTML=h;
    $('#pnext').onclick=pracNext;
    const ps0=$('#pstep');if(ps0)ps0.onclick=()=>startKind(rv.k);
    window.scrollTo(0,0);return;
  }
  if(pr.fb)h+='<div class="fb '+pr.fb.cls+'">'+esc(pr.fb.text).replace(/\n/g,'<br>')+'</div>';
  h+=numpadHTML()+'<button class="btn sec" id="pskip">Не знаю, покажи ответ</button>';
  app.innerHTML=h;
  bindNumpad(pracCheck);
  $('#pskip').onclick=()=>pracFinish(false,true);
  window.scrollTo(0,0);
}
function pracCheck(text){
  const t=pr.items[pr.i],u=parseNum(text);
  if(!u){pr.fb={cls:'bad',text:'Напиши ответ числом (например 0,35 или 3/7).'};return render()}
  const ok=t.a.some(a=>{const v=parseNum(a);return v&&u[0]*v[1]===v[0]*u[1]});
  if(ok)return pracFinish(true,false);
  pr.tries++;
  if(pr.tries>=MAX_TRIES)return pracFinish(false,false);
  pr.fb={cls:'bad',text:'Ответ не сошёлся. Проверь вычисления и попробуй ещё раз.'};
  render();
}
function pracFinish(ok,skipped){
  const t=pr.items[pr.i],first=ok&&pr.tries===0;
  pr.res.push(first);pr.gain+=first?10:ok?5:0;
  if(t.k){const s=lk(t.k),p=s.pr||(s.pr=[0,0]);p[1]++;if(first)p[0]++;saveLearn()}
  if(t.sk&&PACK.skills[t.sk])record(t.sk,first?1:0);
  const msg=ok?(first?'Верно! +10 XP':'Верно со второй попытки. +5 XP'):'Правильный ответ: '+t.a[0]+(kindSteps(t.k).length?'':'\nРазбора по шагам для задач такого типа пока нет — повтори теорию темы и реши ещё несколько таких.');
  pr.reveal={cls:ok?'good':'bad',text:msg,k:ok||!kindSteps(t.k).length?'':t.k};
  pr.last=msg;
  saveAll();render();
}
function pracNext(){
  pr.reveal=null;pr.fb=null;pr.i++;pr.tries=0;
  if(pr.i>=pr.items.length){xp+=pr.gain;saveAll();return setView('pdone')}
  render();
}
function pracDone(){
  if(pr.learn&&L)return learnSoloDone();
  if(!pr.kindsSent){pr.kindsSent=1;const by={};pr.items.forEach((it,i)=>{if(it.k&&pr.res[i]!==undefined){const b=by[it.k]||(by[it.k]=[0,0]);b[1]++;if(pr.res[i])b[0]++}});Object.keys(by).slice(0,6).forEach(k=>sendLearn(k,'p',by[k][0],by[k][1]))}
  setTimeout(function(){window.anikPlanDone&&anikPlanDone();},700);
  $('#title').textContent='Итог';
  const ok=pr.res.filter(Boolean).length,tot=pr.res.length,sentAuto=autoSend();
  let h='<div class="stars"><b>'+ok+'</b> из '+tot+'<small>с первой попытки</small></div>'+autoNote(sentAuto);
  h+='<div class="fb '+(ok>=tot*0.8?'good':'bad')+'">'+(ok>=tot*0.8?'Отлично! Навык закрепляется.':ok>=tot*0.5?'Неплохо. Загляни в теорию и разбери ошибки по шагам.':'Пока трудно — прочитай теорию и потренируйся по шагам.')+'<br>'+esc(pr.last||'').replace(/\n/g,'<br>')+'<br>Получено: +'+pr.gain+' XP</div>';
  h+='<button class="btn" id="again">Ещё подход</button><button class="btn sec" id="menu">⬅️ К разделу</button>';
  if(!sentAuto&&session.length)h+='<button class="btn ok" id="send">Закончить и отправить результаты боту</button>';
  app.innerHTML=h;
  $('#again').onclick=()=>startPractice();
  $('#menu').onclick=()=>{packTab='practice';setView('pack')};
  const sb=$('#send');if(sb)sb.onclick=sendToBot;
}

// ── Задание по шагам ──
function pickTask(skill){
  let pool=PACK.tasks.filter(t=>t.sk===skill);
  if(!pool.length)pool=PACK.tasks;
  return pool[Math.floor(Math.random()*pool.length)];
}
function start(skill,keepTab){
  if(!PACK.tasks.some(t=>t.sk===skill)){                   // шагов по этому навыку ещё нет — ведём в практику по нему, а не в чужую тему
    packTab='practice';pracSkill=skill;pracNum=0;setView('pack');return;
  }
  startTask(pickTask(skill),keepTab);
}
// Задача по шагам. Из темы (keepTab) разбираем только задачи этой темы и после — тренируем тоже эту тему
function startTask(t,keepTab){
  cur={t,i:0,tries:0,res:[],fb:null,order:null,gain:0,topicG:keepTab?(t.g||''):'',kind:keepTab?(t.k||''):''};
  packTab='practice';prepare();setView('task');
}
function topicSteps(gid){return PACK.tasks.filter(t=>t.g===gid)}
function kindSteps(k){return k?PACK.tasks.filter(t=>t.k===k):[]}
function startKind(k){
  const pool=kindSteps(k);if(!pool.length)return;
  const t=pool[Math.floor(Math.random()*pool.length)];
  pracGroup=t.g||pracGroup;pracSkill='';
  startTask(t,true);
}
function startTopic(gid){
  const pool=topicSteps(gid);if(!pool.length)return;
  pracGroup=gid;pracSkill='';
  startTask(pool[Math.floor(Math.random()*pool.length)],true);
}
function prepare(){
  const st=cur.t.st[cur.i];cur.tries=0;
  cur.order=st.k==='choice'?shuffle(st.opts):null;
}
function taskView(){
  const t=cur.t,st=t.st[cur.i];
  $('#title').textContent='Задание №'+t.n;
  let h='<div class="card task">'+esc(t.t)+kindFig(t.k,'Схема к типу задачи (буквы — как в условии)')+'</div>'+kindTheory(t.k,cur.i===0)+'<div class="dots">';
  t.st.forEach((_,k)=>{h+='<span class="dot '+(k<cur.res.length?(cur.res[k]?'ok':'bad'):(k===cur.i?'cur':''))+'"></span>'});
  h+='</div><div class="tag'+(st.rc?' think':'')+'">Шаг '+(cur.i+1)+' из '+t.st.length+(st.rc?' · сначала думаем':'')+'</div><div class="q">'+esc(st.q)+'</div>';
  if(cur.fb)h+='<div class="fb '+cur.fb.cls+'">'+esc(cur.fb.text).replace(/\n/g,'<br>')+'</div>';
  if(st.k==='choice'){
    cur.order.forEach((o,k)=>{h+='<button class="opt" data-k="'+k+'">'+esc(o)+'</button>'});
  }else{
    // на цифровой клавиатуре телефона нет «−» и «/», поэтому свои кнопки
    // своя клавиатура: системная не нужна (inputmode="none") и не закрывает задачу; с компьютера можно печатать как раньше
    const pad=['1','2','3','⌫','4','5','6','−','7','8','9','/',',','0'];
    h+='<input class="inp" id="inp" inputmode="none" placeholder="0" autocomplete="off" aria-label="Ответ числом, например 0,35 или 3/7">'
      +'<div class="keys pad">'+pad.map(k=>k==='⌫'?'<button data-del="1" aria-label="стереть">⌫</button>':'<button data-ins="'+k+'" aria-label="'+(k==='−'?'минус':k==='/'?'дробная черта':k===','?'запятая':k)+'"'+(/\d/.test(k)?' class="d"':'')+'>'+k+'</button>').join('')
      +'<button class="chk" id="chk">Проверить</button></div>';
  }
  app.innerHTML=h;
  if(st.k==='choice')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(cur.order[+b.dataset.k]===st.opts[0]));
  else{
    const inp=$('#inp');
    app.querySelectorAll('.keys button').forEach(b=>{
      b.onmousedown=e=>e.preventDefault();   // поле не теряет фокус, клавиатура не прячется
      b.onclick=()=>{
        const s=inp.selectionStart==null?inp.value.length:inp.selectionStart,e=inp.selectionEnd==null?s:inp.selectionEnd;
        if(b.dataset.del){
          const a=s===e?Math.max(0,s-1):s;inp.value=inp.value.slice(0,a)+inp.value.slice(e);inp.setSelectionRange(a,a);
        }else{
          inp.value=inp.value.slice(0,s)+b.dataset.ins+inp.value.slice(e);inp.setSelectionRange(s+1,s+1);
        }
        inp.focus();
      };
    });
    const go=()=>{const r=checkNum(inp.value,st);if(r===null){cur.fb={cls:'bad',text:'Напиши ответ числом (например 0,35 или 3/7).'};render();return}answer(r)};
    $('#chk').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};inp.focus();
  }
  window.scrollTo(0,0);
}
function answer(ok){
  const st=cur.t.st[cur.i];
  const right=st.k==='choice'?st.opts[0]:st.a;
  if(ok){
    const first=cur.tries===0;
    cur.res.push(first);cur.gain+=first?10:5;
    return next(first?'Верно! +10 XP':'Верно со второй попытки. +5 XP');
  }
  cur.tries++;
  if(cur.tries>=MAX_TRIES){
    cur.res.push(false);
    return next('Правильный ответ этого шага: '+right+'\nПравило: '+st.r+'\nИдём дальше.');
  }
  cur.fb={cls:'bad',text:'Здесь ошибка.\nПодсказка: '+st.r+'\nПопробуй ещё раз.'};
  render();
}
function next(msg){
  cur.i++;
  if(cur.i>=cur.t.st.length){
    cur.t.st.forEach((st,k)=>record(st.s,cur.res[k]));
    xp+=cur.gain;saveAll();
    return setView('done');
  }
  prepare();cur.fb={cls:msg.startsWith('Верно')?'good':'bad',text:msg};
  render();
}
function doneView(){
  setTimeout(function(){window.anikPlanDone&&anikPlanDone();},700);
  const t=cur.t,failed=[];
  if(cur.learn&&L&&!cur.counted){cur.counted=1;const s=lk(L.k);s.steps=(s.steps||0)+1;saveLearn();sendLearn(L.k,'s',cur.res.filter(Boolean).length,cur.res.length)}
  $('#title').textContent='Итог';
  const bad=cur.res.filter(x=>!x).length;
  const stars=bad===0?3:bad===1?2:1;
  const sentAuto=autoSend();
  let h='<div class="stars"><b>'+(t.st.length-bad)+'</b> из '+t.st.length+'<small>шагов с первой попытки</small></div>';
  h+=autoNote(sentAuto);
  h+='<div class="card"><div class="task">'+esc(t.t)+'</div></div><ul class="res card">';
  t.st.forEach((st,k)=>{h+='<li>'+(cur.res[k]?'<span class="rk ok">✓</span>':'<span class="rk bad">×</span>')+' Шаг '+(k+1)+': '+(st.rc===1?'вспомнить правило':st.rc===2?'как это делается':esc(PACK.skills[st.s].name))+'</li>';if(!cur.res[k])failed.push(st)});
  h+='</ul><div class="fb good">Ответ: <b>'+esc(t.f)+'</b>'+(t.st[t.st.length-1].d===2?' (до сотых)':'')+'<br>Получено: +'+cur.gain+' XP</div>';
  if(failed.length)h+='<div class="fb bad"><b>Где споткнулся:</b><br>'+failed.map(s=>'• '+(s.rc?'не вспомнил правило: ':'')+esc(PACK.skills[s.s].name)+'<br>&nbsp;&nbsp;'+esc(s.r)).join('<br>')+'</div>';
  else h+='<div class="fb good">Все шаги с первой попытки!</div>';
  const sk=failed.length?failed[0].s:t.sk;
  if(cur.learn&&L)h+='<button class="btn" id="learnsolo">Дальше: реши сам (3 задания)</button>';
  h+='<button class="btn'+(cur.learn&&L?' sec':'')+'" id="again">'+(failed.length?'Потренировать то, где споткнулся':'Ещё такую же')+'</button>';
  h+='<button class="btn sec" id="other">Другое задание</button>';
  h+='<button class="btn sec" id="solo">Теперь реши сам: практика без шагов</button>';
  if(!sentAuto)h+='<button class="btn ok" id="send">Закончить и отправить результаты боту</button>';
  h+='<button class="btn sec" id="menu">⬅️ К разделу</button>';
  app.innerHTML=h;
  const ls=$('#learnsolo');if(ls)ls.onclick=()=>learnToSolo();
  $('#again').onclick=()=>cur.kind&&kindSteps(cur.kind).length?startKind(cur.kind):cur.topicG?startTopic(cur.topicG):start(sk);
  $('#other').onclick=()=>cur.topicG?startTopic(cur.topicG):start(weightedSkill(skillsOfPack(PACK)));
  $('#solo').onclick=()=>{if(t.g){pracGroup=t.g;pracSkill=''}else{pracSkill=sk;pracGroup=''}pracNum=PACK.numbers.indexOf(t.n)>=0&&PACK.numbers.length>1?t.n:0;packTab='practice';setView('pack')};
  $('#menu').onclick=()=>setView('pack');
  const sb=$('#send');if(sb)sb.onclick=sendToBot;
}

// ── Быстрые игры ──
function gameStart(id){
  const g=PACK.games.find(x=>x.id===id);
  gm={g,rounds:shuffle(g.items).slice(0,ROUNDS),i:0,ok:0,picked:null,order:null,gain:0};
  packTab='games';prepareRound();setView('game');
}
function prepareRound(){
  const it=gm.rounds[gm.i];gm.picked=null;
  if(it.fix&&it.opts.length===2&&(it.opts[0]==='Верно'||it.opts[0]==='Неверно'))gm.order=['Верно','Неверно'];
  else if(it.fix&&it.opts.length===3)gm.order=['Строка 1','Строка 2','Строка 3'];
  else gm.order=shuffle(it.opts);
}
function gameView(){
  const g=gm.g,it=gm.rounds[gm.i];
  $('#title').textContent=g.title;
  let h='<div class="dots">';
  gm.rounds.forEach((_,k)=>{h+='<span class="dot '+(k<gm.i?'ok':(k===gm.i?'cur':''))+'"></span>'});
  h+='</div><div class="tag">Вопрос '+(gm.i+1)+' из '+gm.rounds.length+' · верно: '+gm.ok+'</div><div class="card task">'+esc(it.q)+'</div>';
  gm.order.forEach((o,k)=>{
    let st='';
    if(gm.picked!==null){
      if(o===it.opts[0])st=' style="border-color:var(--blue);background:var(--blue);color:#fff"';
      else if(k===gm.picked)st=' style="border-color:var(--red);background:var(--red);color:var(--ink)"';
    }
    h+='<button class="opt" data-k="'+k+'"'+st+(gm.picked!==null?' disabled':'')+'>'+esc(o)+'</button>';
  });
  if(gm.picked!==null){
    const good=gm.order[gm.picked]===it.opts[0];
    h+='<div class="fb '+(good?'good':'bad')+'">'+(good?'Верно! ':'Не так. ')+esc(it.why)+'</div>';
    h+='<button class="btn" id="nx">'+(gm.i+1>=gm.rounds.length?'Результат →':'Дальше →')+'</button>';
  }
  app.innerHTML=h;
  if(gm.picked===null)app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    gm.picked=+b.dataset.k;const good=gm.order[gm.picked]===it.opts[0];
    if(good)gm.ok++;record(it.sk,good);saveAll();render();
  });
  else $('#nx').onclick=()=>{
    gm.i++;
    if(gm.i>=gm.rounds.length){gm.gain=gm.ok*5;xp+=gm.gain;saveAll();setView('gdone')}
    else{prepareRound();render()}
  };
  window.scrollTo(0,0);
}
function gameDone(){
  setTimeout(function(){window.anikPlanDone&&anikPlanDone();},700);
  const n=gm.rounds.length,stars=gm.ok>=n-1?3:gm.ok>=Math.ceil(n*0.7)?2:1;
  $('#title').textContent='Результат';
  const sentAuto=autoSend();
  let h=autoNote(sentAuto)+'<div class="stars"><b>'+gm.ok+'</b> из '+n+'<small>верно · +'+gm.gain+' XP</small></div>';
  h+='<button class="btn" id="again">Ещё раз</button><button class="btn sec" id="menu">Другие игры</button>';
  if(!sentAuto)h+='<button class="btn ok" id="send">Отправить результаты боту</button>';
  app.innerHTML=h;
  $('#again').onclick=()=>gameStart(gm.g.id);
  $('#menu').onclick=()=>setView('pack');
  const sb=$('#send');if(sb)sb.onclick=sendToBot;
}

// ── связь с ботом: те же хэши, что у бота (game_sync.py) ──
const BOT_USERNAME='examzadrotbot';
const B62='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h>>>0}
function b62(n,w){let o='';for(let i=0;i<w;i++){o=B62[n%62]+o;n=Math.floor(n/62)}return o}

// Короткая строка с результатами занятия: «код навыка + верных + всего», как её читает бот (game_sync.parse_math)
function sessionPayload(){
  const agg={};
  session.forEach(([sk,ok])=>{const a=agg[sk]||(agg[sk]=[0,0]);a[1]=Math.min(9,a[1]+1);a[0]=Math.min(a[1],a[0]+(ok?1:0))});
  let body='';
  Object.keys(agg).slice(-15).forEach(sk=>{body+=b62(fnv(sk)%3844,2)+agg[sk][0]+agg[sk][1]});
  return 'm_'+body;
}
// Если подключено облако — результат уходит боту сам, кнопка не нужна. true — отправлено.
function autoSend(){
  if(!session.length||!window.AnikSync||!AnikSync.enabled())return false;
  if(!AnikSync.send(sessionPayload()))return false;
  session=[];
  return true;
}
function autoNote(sent){
  return sent?'<div class="fb good">✅ Результат записан в твой прогресс — бот и репетитор его увидят.</div>':'';
}
function sendToBot(){
  if(!session.length)return;
  // из кнопки на клавиатуре бота данные уходят напрямую, во всех остальных случаях — ссылкой с результатом
  const keyboardLaunch=TG&&TG.initDataUnsafe&&!TG.initDataUnsafe.query_id;
  if(keyboardLaunch){
    TG.sendData(JSON.stringify({v:1,t:'math_stages',r:session.slice(-150)}));
    return;
  }
  const url='https://t.me/'+BOT_USERNAME+'?start='+sessionPayload();
  session=[];
  if(TG&&TG.openTelegramLink)TG.openTelegramLink(url);else window.open(url,'_blank');
}

// ── Запуск ──
loadAll();loadLearn();
fetch('math_kinds.json').then(r=>r.json()).then(d=>{KINDS=d.kinds;if(view==='task'||view==='prac'||(view==='pack'&&packTab==='practice'))render()}).catch(()=>{});
fetch('math_topics.json').then(r=>r.json()).then(d=>{TOPICS_META=d.topics}).catch(()=>{});
fetch('math_groups.json').then(r=>r.json()).then(d=>{GROUPS_META=d.numbers}).catch(()=>{});
fetch('math_analysis.json').then(r=>r.json()).then(d=>{ANALYSIS=d.numbers;if(view==='pack'&&packTab==='theory')render()}).catch(()=>{});
fetch('math_packs.json').then(r=>r.json()).then(idx=>{
  INDEX=idx;
  const h=location.hash;let m;
  if((m=h.match(/^#pack=(\w+)&game=(\w+)$/))){          // ссылка репетитора: конкретная игра раздела
    return loadPack(m[1]).then(p=>{PACK=p;if(p.games.some(g=>g.id===m[2]))gameStart(m[2]);else setView('pack')}).catch(()=>setView('home'));
  }
  if((m=h.match(/^#pack=(\w+)&tab=(theory|practice|steps|games)$/))){
    return loadPack(m[1]).then(p=>{PACK=p;packTab=m[2];setView('pack')}).catch(()=>setView('home'));
  }
  if((m=h.match(/^#skill=(\w+)$/))){
    return fetch('math_skills.json').then(r=>r.json()).then(sk=>{
      const meta=sk[m[1]];
      if(!meta)return setView('home');
      return loadPack(meta.pack).then(p=>{PACK=p;start(m[1])});
    });
  }
  if((m=h.match(/^#n=(\d+)$/))){
    const meta=INDEX.packs.find(p=>p.numbers.indexOf(+m[1])>=0);
    if(meta)return loadPack(meta.id).then(p=>{PACK=p;const ss=skillsOfNumber(+m[1]);start(weightedSkill(ss.length?ss:skillsOfPack(p)))});
  }
  setView('home');
}).catch(()=>{app.innerHTML='<p class="sub">Не удалось загрузить задания. Проверь интернет и открой снова.</p>'});
