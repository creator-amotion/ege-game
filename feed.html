<style>
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Golos Text',system-ui,sans-serif;background:#F3EEE2;color:#111;-webkit-font-smoothing:antialiased}
.top{position:fixed;left:0;right:0;top:0;z-index:5;background:#F3EEE2;border-bottom:2px solid #111;padding:8px 16px calc(8px) 16px}
.top .r1{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto}
.wm{font-family:'Inter Tight',system-ui,sans-serif;font-weight:800;font-size:24px;letter-spacing:-.8px;text-decoration:none;color:#111}
.wm i{font-style:normal;color:#E5332A}
.climb{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;min-height:50px;margin:8px auto 0;padding:0 8px 0 0;border:2px solid #111;background:#fff;color:#111;font:inherit;text-align:left;cursor:pointer;box-sizing:border-box}
.top .climb{display:flex}
.climb>svg.cl-mini{flex:none;width:46px;height:46px;background:#C0CDF8;border-right:2px solid #111}
.climb>svg.cl-open{flex:none;width:16px;height:16px}
.cl-r{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.cl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:700 14px/1.1 'Golos Text',system-ui,sans-serif}
.cl-h span{font:600 13px/1.1 'Golos Text',system-ui,sans-serif;color:#4A463E;white-space:nowrap}
.cl-bar{position:relative;display:block;height:9px;margin-top:2px;background:#E9E2D2;border:1.5px solid #111;box-sizing:border-box}
.cl-bar b{position:absolute;left:0;top:0;bottom:0;background:#E5332A}
.cl-bar i{position:absolute;bottom:2px;width:13px;height:11px;margin-left:-6.5px;background:#111;clip-path:polygon(50% 0,100% 100%,0 100%)}
.cl-bar i::after{content:'';position:absolute;left:3.5px;bottom:1.5px;width:6px;height:5.5px;background:#fff;clip-path:polygon(50% 0,100% 100%,0 100%)}
.cl-bar i.on::after{background:#F6CE2E}
/* карта подъёма: в шторке по нажатию на полоску и на экранах «Привал» и «Вершина» */
.clm-map{display:block;width:min(100%,calc(38vh * 340 / 270));aspect-ratio:340/270;height:auto;margin:0 auto;border:2px solid #111;box-sizing:border-box;background:#C0CDF8}
.clm-map text{font-family:'Golos Text',system-ui,sans-serif;font-weight:700;font-size:13px;fill:#111;paint-order:stroke;stroke:#F3EEE2;stroke-width:4px;stroke-linejoin:round}
.clm-cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:10px;font-size:14px;line-height:1.3;color:#4A463E}
.clm-cap b{flex:none;font-family:'Inter Tight',system-ui,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.3px;color:#111}
.clm-cap span{text-align:right}
.clm-key{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:#4A463E}
.clm-key span{display:inline-flex;align-items:center;gap:6px}
.clm-key svg{flex:none}
.clm{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;background:rgba(17,17,17,.45)}
.clm[hidden]{display:none}
.clm-p{width:100%;max-width:560px;max-height:100%;overflow-y:auto;margin:0 auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom));background:#F3EEE2;border-top:2px solid #111;box-sizing:border-box}
.clm-p .clm-map{width:min(100%,calc(62vh * 340 / 270))}
.clm-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.clm-t h2{margin:0;font-family:'Inter Tight',system-ui,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.7px;line-height:1.05}
.clm-x{flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:0;background:#111;cursor:pointer}
.rest{justify-content:center;text-align:left}
.rest .clm-map{margin-bottom:12px}
.rest .clm-cap{margin:-2px 0 12px}
.rest h1{font-family:'Inter Tight',system-ui,sans-serif;font-weight:800;font-size:30px;letter-spacing:-.8px;margin:0 0 8px}
.rest p{font-size:16px;line-height:1.45;color:#4A463E;margin:0 0 8px}
.ic-fire{display:inline-block;width:12px;height:14px;margin-right:4px;vertical-align:-2px}
.streak{margin-left:auto;font-family:'Inter Tight',system-ui,sans-serif;font-weight:800;font-size:14px;background:#F6CE2E;padding:5px 10px;white-space:nowrap}
.subj{display:flex;flex-wrap:wrap;gap:6px;max-width:560px;margin:8px auto 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.subj::-webkit-scrollbar{display:none}
.subj button{flex:none;min-height:40px;padding:0 12px;border:2px solid #111;background:transparent;font:600 14px 'Golos Text',system-ui,sans-serif;color:#111;cursor:pointer}
.subj button.on{background:#111;color:#F3EEE2}
#feed{position:fixed;left:0;right:0;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;box-sizing:border-box;padding:14px 16px 18px;display:flex;flex-direction:column;overflow-y:auto}
.inner{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;min-height:0;flex:1}
.tg{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#4A463E;display:flex;justify-content:space-between;gap:8px}
.lvl{display:inline-flex;gap:3px;align-items:center}.lvl b{width:7px;height:7px;background:#CFC7B5;display:inline-block}.lvl b.on{background:#E5332A}
.task{flex:0 1 auto;min-height:0;overflow-y:auto;margin:10px 0;background:#fff;border:2px solid #111;padding:14px;font-size:17px;line-height:1.45;-webkit-overflow-scrolling:touch}
.task p{margin:0 0 8px}.task p:last-child{margin:0}
.task img{max-width:100%;display:block;margin:8px auto 0;background:#fff}
.task table{border-collapse:collapse;margin:6px 0}.task td{border:1px solid #CFC7B5;padding:3px 7px}
.ans{display:flex;gap:8px}
.ans input{flex:1;min-width:0;height:50px;border:2px solid #111;padding:0 12px;font:600 18px 'Golos Text',system-ui,sans-serif;background:#fff;color:#111;border-radius:0}
.ans input.ok{border-color:#2E7D4F;background:#E3F3E8}.ans input.err{border-color:#E5332A;background:#FBE3E0}
.ans button,.btn{height:50px;padding:0 16px;border:2px solid #111;background:#111;color:#F3EEE2;font:700 15px 'Golos Text',system-ui,sans-serif;cursor:pointer}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.keys button{height:38px;border:2px solid #111;background:#fff;color:#111;font:700 15px 'Golos Text',system-ui,sans-serif;cursor:pointer}
.nbs{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);gap:6px;margin-bottom:8px}
.nbs button{height:40px;border:2px solid #111;background:#fff;font:700 16px 'Golos Text',system-ui,sans-serif;color:#111}
.nbs button.on{background:#2E55C9;color:#fff;border-color:#2E55C9}
.ffb{margin-top:8px;padding:10px 12px;font-size:15px;line-height:1.4}
.ffb.good{background:#E3F3E8;border-left:5px solid #2E7D4F}.ffb.bad{background:#FBE3E0;border-left:5px solid #E5332A}
.ffb .key{display:block;margin-top:6px;font-size:14px;color:#111}
.ffb .key b{font-size:11px;letter-spacing:1px;text-transform:uppercase;display:block;color:#4A463E}
.sol{margin-top:8px;border:2px solid #111;background:#fff;padding:8px 12px;font-size:15px;line-height:1.45}.sol summary{cursor:pointer;font-weight:700;min-height:28px}.sol ol{margin:6px 0 0;padding-left:20px}.sol li{margin:4px 0}
.row2{display:flex;gap:8px;margin-top:8px;align-items:center}
.row2 a,.row2 button{flex:1;display:flex;align-items:center;justify-content:center;min-height:42px;border:2px solid #111;background:transparent;color:#111;text-decoration:none;font:600 14px 'Golos Text',system-ui,sans-serif;cursor:pointer;text-align:center;padding:0 8px}
.row2 .main{background:#111;color:#F3EEE2}
.hint{text-align:left;font-size:13px;color:#4A463E;margin-top:8px}
.hint span{display:inline-block;animation:up 1.6s ease-in-out infinite}
@keyframes up{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.skip{align-self:center;min-height:44px;padding:0 12px;background:none;border:0;color:#4A463E;font:500 14px 'Golos Text',system-ui,sans-serif;text-decoration:underline;cursor:pointer;margin-top:2px}
.intro{justify-content:center;text-align:left}
.intro h1{font-family:'Inter Tight',system-ui,sans-serif;font-weight:800;font-size:34px;letter-spacing:-1px;line-height:1.05;margin:0 0 12px}
.intro p{font-size:16px;line-height:1.45;color:#4A463E;margin:0 0 10px}
.install{margin-top:14px;padding:12px;border:2px solid #111;background:#fff;font-size:14px;line-height:1.4;text-align:left}
.empty{margin:auto;text-align:center;color:#4A463E}
.katex{font-size:1.05em}

<body>
<div class="top" id="top">
  <div class="r1"><a class="wm" href="index.html">аник<i>.</i></a><span style="font-weight:700">Лента</span><span class="streak" id="streak">0 подряд</span></div>
  <div class="subj" id="subj"></div>
  <button type="button" class="climb" id="climb" aria-haspopup="dialog" aria-label="Подъём дня: открыть карту"><svg class="cl-mini" id="cl-svg" viewBox="0 0 46 46" aria-hidden="true"></svg><span class="cl-r"><span class="cl-h"><b id="cl-t"></b><span id="cl-s"></span></span><span class="cl-bar" id="cl-bar"></span></span><svg class="cl-open" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 10.5 8 5.5l5 5" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="square"/></svg></button>
</div>
<div id="feed"></div>
<div class="clm" id="clm" hidden><div class="clm-p" role="dialog" aria-modal="true" aria-labelledby="clm-h"><div class="clm-t"><h2 id="clm-h">Подъём дня</h2><button type="button" class="clm-x" id="clm-x" aria-label="Закрыть карту"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 3l12 12M15 3 3 15" stroke="#F3EEE2" stroke-width="2.6" stroke-linecap="square"/></svg></button></div><div id="clm-b"></div></div></div>
<script>
/* Лента задач: одна задача на экран, листаешь вверх — следующая. Задачи — те же, что в тренажёре и практике
   (банк ФИПИ и задачи по образцу). Сложность подстраивается: начинаем с первых номеров, верные ответы ведут к более
   трудным, ошибки — обратно к простым. Результаты уходят боту теми же строками, что из тренажёра (n_… и l_…). */
var TG=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor('#F3EEE2');TG.setBackgroundColor('#F3EEE2');}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function lsGet(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function pad2(n){return (n<10?'0':'')+n;}
function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(u);return r.json();});}
// код навыка для m_…: тот же, что у практики профиля (math.html: fnv → два знака base62)
var B62='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
function fnv(str){var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h>>>0;}
function b62(n,w){var o='';for(var i=0;i<w;i++){o=B62[n%62]+o;n=Math.floor(n/62);}return o;}
function range(a,b){var r=[];for(var i=a;i<=b;i++)r.push(i);return r;}

/* ── проверка ответа: те же правила, что в тренажёре и у бота ── */
function normWord(s){return String(s).toUpperCase().replace(/Ё/g,'Е').replace(/[^0-9A-ZА-Я]/g,'');}
function digitsOf(s){return String(s).replace(/\D/g,'');}
function toNum(s){
  s=String(s).trim().replace(/\s+/g,'').replace(',','.').replace(/[−–]/g,'-');
  var m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(m){var d=parseFloat(m[2]);return d?parseFloat(m[1])/d:NaN;}
  return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN;
}
function shaped(t,v){v=String(v).trim();if(!v)return false;if(t.k==='num')return !isNaN(toNum(v));if(t.k==='word')return normWord(v).length>0;return digitsOf(v).length>0;}
function right(t,u){
  return t.a.some(function(a){
    if(t.k==='num'){var x=toNum(u),c=toNum(a);return !isNaN(x)&&!isNaN(c)&&Math.abs(x-c)<1e-9*Math.max(1,Math.abs(c));}
    if(t.k==='set')return digitsOf(u).split('').sort().join('')===digitsOf(a).split('').sort().join('');
    if(t.k==='seq')return digitsOf(u)===digitsOf(a);
    return normWord(u)===normWord(a);
  });
}
function renderText(t){
  var lines=String(t).split('\n'),out='',i=0;
  while(i<lines.length){
    if(lines[i].indexOf(' | ')>=0){var rows=[];while(i<lines.length&&lines[i].indexOf(' | ')>=0){rows.push(lines[i].split(' | '));i++;}
      out+='<table>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</table>';}
    else{var ch=[];while(i<lines.length&&lines[i].indexOf(' | ')<0){ch.push(lines[i]);i++;}var x=ch.join('\n').replace(/^\n+|\n+$/g,'');if(x)out+='<p>'+esc(x).replace(/\n/g,'<br>')+'</p>';}
  }
  return out;
}
function mathIn(el,k){
  if(window.renderMathInElement){try{renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});AnikTheory.glue(el);}catch(e){}}
  else if((k||0)<60)setTimeout(function(){mathIn(el,(k||0)+1);},250);
}

/* ── предметы ленты: какие номера берём (короткие задания без длинного текста) и как их читать ── */
var SUBJ={
  'ege-math':{t:'ЕГЭ профиль',nums:range(1,12),file:function(n){return 'trainer/ege-math_'+n+'.json';},
    task:function(x){return {id:x.id,t:x.t,a:x.a,k:'num',f:x.f,s:x.s,kind:x.k,sk:x.sk};},
    learn:function(t){return t.kind?'math.html#learn='+t.kind:'math.html';}},
  'ege-mathb':{t:'ЕГЭ база',nums:range(1,21),code:'b',file:function(n){return 'trainer/ege-mathb_'+n+'.json';},
    task:function(x){return x;},learn:function(t,n){return 'trainer.html#ege-mathb&n='+n+'&learn';}},
  'ege-rus':{t:'ЕГЭ русский',nums:range(4,21),code:'e',file:function(n){return 'trainer/ege-rus_'+n+'.json';},
    task:function(x,n){var a=String(x.answer).split('|'),dg=/^\d+$/.test(a[0]);
      return {id:x.id,t:x.text,a:a,k:dg?((n===8||/соответстви|последовательност/i.test(x.text))?'seq':'set'):'word',s:x.s};},
    learn:function(t,n){return 'rus-ege.html#theory='+n;}},
  'oge-math':{t:'ОГЭ математика',nums:range(6,19),code:'o',file:function(n){return 'trainer/oge-math_'+n+'.json';},
    task:function(x){return x;},learn:function(t,n){return 'trainer.html#oge-math&n='+n+'&learn';}},
  'oge-rus':{t:'ОГЭ русский',nums:range(4,9),code:'r',file:function(n){return 'trainer/oge-rus_'+n+'.json';},
    task:function(x){return x;},learn:function(t,n){return 'trainer.html#oge-rus&n='+n+'&theory';}}
};
var ORDER=['ege-math','ege-mathb','ege-rus','oge-math','oge-rus'];
var cache={},KINDS=null,LEARN={};
function pack(sid,n){var key=sid+'_'+n;if(cache[key])return Promise.resolve(cache[key]);
  return getJSON(SUBJ[sid].file(n)).then(function(d){var arr=Array.isArray(d)?d:d.tasks;
    cache[key]=arr.map(function(x){return SUBJ[sid].task(x,n);}).filter(function(t){return t&&t.a&&t.a.length&&String(t.t).length<=900;});return cache[key];});}
function learnParts(sid,n){var key=sid+'_'+n;if(LEARN[key]!==undefined)return Promise.resolve(LEARN[key]);
  return getJSON('trainer/learn_'+sid+'_'+n+'.json').then(function(d){LEARN[key]=d.parts||[];return LEARN[key];}).catch(function(){LEARN[key]=[];return [];});}

/* ── состояние ── */
var st=lsGet('anik_feed',{sid:null,lvl:{},streak:0,best:0});
st.lvl=st.lvl||{};
var SID=SUBJ[st.sid]?st.sid:defaultSid();
/* стартовая проверка: feed.html?diag=<предмет>[&only=1,4,7] — по одной задаче на каждый номер, без подстройки сложности.
   Ответы уходят боту как обычно и сразу дают прогнозу «проверенные» номера */
var DIAG=(function(){
  var m=/[?&]diag=([a-z-]+)/.exec(location.search);if(!m||!SUBJ[m[1]])return null;
  var o=/[?&]only=([\d,]+)/.exec(location.search),nums=SUBJ[m[1]].nums.slice();
  if(o){var want=o[1].split(',').map(Number);var f=nums.filter(function(n){return want.indexOf(n)>=0;});if(f.length)nums=f;}
  return {sid:m[1],queue:nums.slice(),total:nums.length,i:0,ok:0,done:0,ended:false};
})();
if(DIAG)SID=DIAG.sid;
/* «закрепить сегодняшнее»: feed.html?nums=<предмет>:3,5,9 — лента только по этим номерам (сложность по-прежнему подстраивается) */
var ONLY=(function(){
  var m=/[?&]nums=([a-z-]+):([\d,]+)/.exec(location.search);if(!m||!SUBJ[m[1]])return null;
  var want=m[2].split(',').map(Number),nums=SUBJ[m[1]].nums.filter(function(n){return want.indexOf(n)>=0;});
  return nums.length?{sid:m[1],nums:nums}:null;
})();
if(ONLY&&!DIAG){SID=ONLY.sid;SUBJ[SID].nums=ONLY.nums;}
function defaultSid(){var c=lsGet('anik_choice',null),m={'ege.rus':'ege-rus','ege.math':'ege-math','ege.mathb':'ege-mathb','oge.rus':'oge-rus','oge.math':'oge-math'};
  if(c&&m[c.exam+'.'+c.subj])return m[c.exam+'.'+c.subj];
  var s=window.AnikSync&&AnikSync.state&&AnikSync.state();var e=s&&s.exam,su=s&&s.subject;
  if(e==='oge')return su==='rus'?'oge-rus':'oge-math';if(e==='ege'&&su==='rus')return 'ege-rus';if(e==='ege'&&su==='mathb')return 'ege-mathb';return 'ege-math';}
function save(){st.sid=SID;lsSet('anik_feed',st);}
var feed=document.getElementById('feed'),slides=[],busy=false,pending={},sinceFlush=0;

function layout(){
  var top=document.getElementById('top').offsetHeight,tabs=document.querySelector('.anik-tabs'),bot=tabs?tabs.offsetHeight:0;
  feed.style.top=top+'px';feed.style.bottom=bot+'px';
}
window.addEventListener('resize',layout);

function subjBar(){
  var b=document.getElementById('subj');
  b.innerHTML=ORDER.map(function(k){return '<button data-s="'+k+'" class="'+(k===SID?'on':'')+'">'+SUBJ[k].t+'</button>';}).join('');
  [].forEach.call(b.children,function(x){x.onclick=function(){if(x.dataset.s===SID)return;flush();SID=x.dataset.s;save();subjBar();restart();};});
}

function pickNum(){
  var nums=SUBJ[SID].nums,L=st.lvl[SID]||0,c=L*(nums.length-1),w=Math.max(1.5,nums.length*0.15);
  var ws=nums.map(function(_,i){return Math.exp(-Math.pow(i-c,2)/(2*w*w));}),sum=ws.reduce(function(a,b){return a+b;},0),r=Math.random()*sum;
  for(var i=0;i<nums.length;i++){r-=ws[i];if(r<=0)return nums[i];}

}

/* ── «Восхождение»: каждый день — подъём на свою гору. Вершина — цель дня. Верный ответ — шаг вверх (на трудных номерах
   шаг крупнее, а склон круче). Ошибка и «Не знаю» — шага нет, но и отката нет: путь никогда не уменьшается.
   Каждые REST верных — привал (можно спокойно закончить), на вершине — экран «Вершина дня взята». Без жизней и угроз
   (маркетинг: «лента-игра.md» в Штабе). ── */
var REST=8;
function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function climbState(){var c=lsGet('anik_climb',null);if(!c||c.d!==todayKey())c={d:todayKey(),steps:0,ok:0,tot:0,rests:0,summit:false,best:0,run:0};return c;}
function climbGoal(){var s=window.AnikSync&&AnikSync.state&&AnikSync.state();return Math.max(5,(s&&s.goal)||10);}
function stepsWord(n){var m=n%10,h=n%100;return m===1&&h!==11?'шага':'шагов';}
// привалы на маршруте. Привал — каждые REST верных ответов, а маршрут измерен в шагах: ставим привал туда, где при нынешней
// средней длине шага окажется REST·k-й верный ответ. Так пройденные привалы всегда лежат позади точки ученика
function climbCamps(c,g,L){
  var avg=c.ok>0&&c.steps>0?c.steps/c.ok:1+Math.round(L*2)/2,out=[];
  for(var k=1;k*REST*avg<g-.01&&out.length<12;k++)out.push({k:k,f:k*REST*avg/g,on:c.ok>=k*REST});
  return out;
}
// большая карта: гора, маршрут от «Старта» к «Вершине дня», привалы. Чем выше уровень, тем уже основание и круче склон
function climbMap(c,g,L,mark){
  var W=340,H=270,px=178,py=38,hw=178-72*Math.max(0,Math.min(1,L)),f=Math.min(1,c.steps/g),n=function(v){return (+v).toFixed(1);};
  var at=function(t,u){return [px+u*hw*(1-t),H-(H-py)*t];},line=function(a){return a.map(function(p){return n(p[0])+','+n(p[1]);}).join(' ');};
  var LJ=[[0,-1.02],[.12,-1.04],[.24,-.96],[.36,-1.08],[.48,-.97],[.6,-1.1],[.72,-.98],[.84,-1.12],[.93,-1]],RJ=[[.9,1.1],[.8,.96],[.68,1.1],[.56,.98],[.44,1.06],[.3,.96],[.16,1.04],[0,1.02]];
  var body=LJ.map(function(q){return at(q[0],q[1]);}).concat([[px,py]],RJ.map(function(q){return at(q[0],q[1]);}));
  // теневая сторона — от гребня вправо; снег — верхушка с рваным краем
  var ridge=[[1,0],[.86,.16],[.74,-.04],[.6,.2],[.46,.02],[.32,.26],[.18,.08],[0,.3]].map(function(q){return at(q[0],q[1]);});
  var shade=ridge.concat(RJ.slice().reverse().map(function(q){return at(q[0],q[1]);}));
  var snow=[at(.72,-.98),at(.84,-1.12),at(.93,-1),[px,py],at(.9,1.1),at(.8,.96),at(.7,1.04),at(.75,.5),at(.67,.2),at(.76,-.08),at(.68,-.42),at(.75,-.66)];
  // маршрут идёт зигзагом, как тропа: t — высота, u — положение между краями склона
  var R=[[.05,-.66],[.13,-.42],[.2,-.6],[.29,-.2],[.37,-.46],[.46,-.02],[.54,.34],[.62,.04],[.7,.36],[.79,-.1],[.87,.3],[.94,-.14]].map(function(q){return at(q[0],q[1]);}).concat([[px,py+3]]);
  var len=[0];for(var i=1;i<R.length;i++)len[i]=len[i-1]+Math.hypot(R[i][0]-R[i-1][0],R[i][1]-R[i-1][1]);
  var pointAt=function(v){var d=v*len[len.length-1],j=1;while(j<R.length-1&&len[j]<d)j++;var q=(d-len[j-1])/((len[j]-len[j-1])||1);return [R[j-1][0]+(R[j][0]-R[j-1][0])*q,R[j-1][1]+(R[j][1]-R[j-1][1])*q];};

    '<polygon points="'+line(body)+'" fill="#F3EEE2" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>'+
    '<polygon points="'+line(shade)+'" fill="#CFC7B5"/>'+
    '<polygon points="'+line(snow)+'" fill="#fff" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>'+
    '<polyline points="'+line(ridge)+'" fill="none" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>'+
    '<polygon points="-4,274 -4,248 48,236 112,246 176,238 246,250 300,240 344,250 344,274" fill="#F6CE2E" stroke="#111" stroke-width="2" stroke-linejoin="round"/>'+
    '<polyline points="'+route+'" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round" stroke-linejoin="round"/>';
  if(f>0)h+='<polyline points="'+route+'" pathLength="100" fill="none" stroke="#111" stroke-width="7" stroke-dasharray="'+pct+' 100" stroke-linejoin="round"/>'+
    '<polyline points="'+route+'" pathLength="100" fill="none" stroke="#E5332A" stroke-width="4" stroke-dasharray="'+pct+' 100" stroke-linejoin="round"/>';
  // старт
  h+='<rect x="'+n(R[0][0]-5)+'" y="'+n(R[0][1]-5)+'" width="10" height="10" fill="#111"/><text x="'+n(R[0][0]+11)+'" y="'+n(R[0][1]+5)+'">Старт</text>';
  // привалы: палатка рядом с тропой, подпись за ней

function climbCaption(c,g,L){
  var steps=Math.floor(c.steps),next=climbCamps(c,g,L).filter(function(p){return !p.on;})[0],left=Math.ceil(g-c.steps),toRest=REST-c.ok%REST;
  var note=c.summit?'Вершина взята'+(steps>g?' · бонус +'+(steps-g):''):next?'до привала: '+toRest+' '+plural(toRest,'верный ответ','верных ответа','верных ответов'):'до вершины: '+left+' '+plural(left,'шаг','шага','шагов');

    '<div class="clm-key"><span><svg width="24" height="8" aria-hidden="true"><rect y="1" width="24" height="6" fill="#E5332A" stroke="#111" stroke-width="1.5"/></svg>пройдено</span>'+
    '<span><svg width="24" height="8" aria-hidden="true"><line x1="1" y1="4" x2="23" y2="4" stroke="#111" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/></svg>впереди</span>'+
    '<span><svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true"><polygon points="8,1 15,13 1,13" fill="#F6CE2E" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/></svg>привал пройден</span></div>';
}
function climbOpen(){var m=document.getElementById('clm');climbSheet();m.hidden=false;document.getElementById('clm-x').focus();}
function climbClose(){var m=document.getElementById('clm');if(m.hidden)return;m.hidden=true;document.getElementById('climb').focus();}
function climbDraw(){
  var svg=document.getElementById('cl-svg');if(!svg)return;
  var c=climbState(),g=climbGoal(),f=Math.min(1,c.steps/g),L=Math.max(0,Math.min(1,st.lvl[SID]||0));
  // значок в полоске: та же гора в миниатюре, склон тоже круче с уровнем
  var hw=25-8*L,x0=23-hw*.72,y0=40,x1=23,y1=10,mx=x0+(x1-x0)*f,my=y0+(y1-y0)*f;
  svg.innerHTML='<polygon points="'+(23-hw).toFixed(1)+',47 23,8 '+(23+hw).toFixed(1)+',47" fill="#F3EEE2" stroke="#111" stroke-width="2" stroke-linejoin="round"/>'+
    '<line x1="23" y1="8" x2="23" y2="1.5" stroke="#111" stroke-width="1.5"/><polygon points="23,1 31,3.5 23,6" fill="'+(c.summit?'#F6CE2E':'#E5332A')+'" stroke="#111" stroke-width="1"/>'+
    '<line x1="'+x0.toFixed(1)+'" y1="'+y0+'" x2="'+mx.toFixed(1)+'" y2="'+my.toFixed(1)+'" stroke="#E5332A" stroke-width="3"/>'+
    '<circle cx="'+mx.toFixed(1)+'" cy="'+my.toFixed(1)+'" r="3.6" fill="#fff" stroke="#111" stroke-width="1.8"/>';
  var steps=Math.floor(c.steps);
  document.getElementById('cl-bar').innerHTML='<b style="width:'+(f*100).toFixed(1)+'%"></b>'+climbCamps(c,g,L).map(function(p){return '<i class="'+(p.on?'on':'')+'" style="left:'+(p.f*100).toFixed(1)+'%"></i>';}).join('');
  document.getElementById('cl-t').textContent=c.summit?'Вершина взята':'Подъём дня';
  document.getElementById('cl-s').textContent=steps>g?'бонус +'+(steps-g):Math.min(steps,g)+' из '+g+' '+stepsWord(g);
  if(!document.getElementById('clm').hidden)climbSheet();
}
// после ответа: шаг, привал или вершина — отдельным слайдом сразу за этой задачей
function climbAfter(slide,it,ok){
  var c=climbState(),g=climbGoal(),L=st.lvl[it.sid]||0;
  c.tot++;
  if(ok){c.ok++;c.run++;c.best=Math.max(c.best,c.run);c.steps+=1+Math.round(L*2)/2;}else c.run=0;
  var special=null;
  if(ok&&!c.summit&&c.steps>=g){c.summit=true;special='summit';}
  else if(ok&&c.ok%REST===0&&c.ok>0){c.rests++;special='rest';}
  lsSet('anik_climb',c);climbDraw();
  if(special){var el=specialSlide(special,c,g),i=slides.indexOf(slide);
    if(i>=0){if(slides[i+1])feed.insertBefore(el,slides[i+1]);else feed.appendChild(el);slides.splice(i+1,0,el);}}
}
function specialSlide(kind,c,g){
  var s=document.createElement('section');s.className='slide rest';
  var L=st.lvl[SID]||0,aim=window.AnikSync&&AnikSync.state&&AnikSync.state(),a=aim&&aim.aim;
  var aimLine=a&&a.t?'<p>Ещё один день пути '+(a.u==='g'?'к оценке «'+a.t+'»':'к '+a.t+' баллам')+'</p>':'';
  if(kind==='summit')
    s.innerHTML='<div class="inner" style="justify-content:center">'+climbMap(c,g,L,'summit')+climbCaption(c,g,L)+'<h1>Вершина дня взята</h1>'+
      '<p>Сегодня верно <b>'+c.ok+' из '+c.tot+'</b>, лучшая серия — '+c.best+'.</p>'+aimLine+
      '<p>Можно остановиться на этом — или пройти бонусный хребет: задачи дальше, без обязательств.</p>'+
      '<div class="row2" style="margin-top:14px"><a href="today.html">На сегодня хватит</a><button class="main up">Бонусный хребет ↑</button></div></div>';
  else
    s.innerHTML='<div class="inner" style="justify-content:center">'+climbMap(c,g,L,Math.floor(c.ok/REST))+climbCaption(c,g,L)+'<h1>Привал</h1>'+
      '<p>'+(c.summit?'Ты на бонусном хребте: вершина уже взята.':'Пройдено '+Math.floor(c.steps)+' из '+g+' до вершины.')+' Сегодня верно <b>'+c.ok+' из '+c.tot+'</b>.</p>'+
      '<p>Хорошее место, чтобы перевести дух. Остановиться сейчас — тоже правильно: завтра подъём продолжится.</p>'+
      '<div class="row2" style="margin-top:14px"><a href="today.html">На сегодня хватит</a><button class="main up">Дальше вверх ↑</button></div></div>';
  s.querySelector('.up').onclick=function(){var i=slides.indexOf(s);if(slides[i+1])slides[i+1].scrollIntoView({behavior:'smooth'});};
  return s;
}

/* ── результаты: копим и отправляем пачками; тренажёр видит их в своей статистике ── */
function record(it,ok,skipped){
  if(ok){st.streak++;st.best=Math.max(st.best||0,st.streak);}else if(!skipped)st.streak=0;   // «Не знаю» — честно, серию не рвёт
  var L=st.lvl[it.sid]||0;if(!it.diag)st.lvl[it.sid]=Math.max(0,Math.min(1,L+(ok?0.06:-0.08)));
  save();streakBar();
  // профиль: в знание навыка (m_ — как практика на math.html) и в карту знаний по типу задачи (l_…-p); остальное — n_ тренажёра
  var keys=it.sid==='ege-math'?[it.t.sk?'m|'+it.t.sk:'',it.t.kind?'l_'+it.t.kind+'-p':''].filter(Boolean):[it.sid+'|'+it.n];
  keys.forEach(function(key){var b=pending[key]||(pending[key]=[0,0]);b[1]++;if(ok)b[0]++;});
  if(it.sid!=='ege-math'&&it.sid!=='ege-rus'){var all=lsGet('anik_tr',{}),k=it.sid+'_'+it.n,x=all[k]||{ok:0,tot:0};x.ok+=ok?1:0;x.tot++;x.d=Date.now();all[k]=x;lsSet('anik_tr',all);}
  if(++sinceFlush>=5)flush();
}
function flush(){
  sinceFlush=0;
  var keys=Object.keys(pending);if(!keys.length||!window.AnikSync)return;
  var nums='',m='';
  keys.forEach(function(k){var b=pending[k];
    if(k.indexOf('m|')===0){var tot=Math.min(9,b[1]);m+=b62(fnv(k.slice(2))%3844,2)+Math.min(tot,b[0])+tot;}
    else if(k.indexOf('l_')===0){try{AnikSync.send(k+pad2(Math.min(b[0],99))+pad2(Math.min(b[1],99)));}catch(e){}}
    else{var p=k.split('|');nums+=SUBJ[p[0]].code+pad2(+p[1])+pad2(Math.min(b[0],99))+pad2(Math.min(b[1],99));}});
  if(nums){try{AnikSync.send('n_'+nums);}catch(e){}}
  if(m){try{AnikSync.send('m_'+m);}catch(e){}}
  pending={};
}
document.addEventListener('visibilitychange',function(){if(document.hidden)flush();});
window.addEventListener('pagehide',flush);

/* ── лента: держим запас из трёх задач впереди ── */
function ensure(){
  if(busy)return;
  var cur=current(),ahead=slides.length-1-cur;
  if(ahead>=3)return;
  busy=true;var sid=SID;
  nextTask().then(function(it){busy=false;if(sid!==SID)return;
    if(!it){if(DIAG&&!DIAG.ended){DIAG.ended=true;var e=diagEnd();feed.appendChild(e);slides.push(e);}return;}
    var s=slideFor(it);feed.appendChild(s);slides.push(s);ensure();
  }).catch(function(){busy=false;if(!slides.length)feed.innerHTML='<section class="slide"><div class="empty">Не получилось загрузить задачи. Проверь интернет.</div></section>';});
}
function current(){var h=feed.clientHeight||1;return Math.round(feed.scrollTop/h);}
feed.addEventListener('scroll',function(){ensure();},{passive:true});
function restart(){feed.innerHTML='';slides=[];var i=intro();feed.appendChild(i);slides.push(i);feed.scrollTop=0;busy=false;ensure();}

if(DIAG){document.getElementById('subj').style.display='none';document.getElementById('climb').style.display='none';}
document.getElementById('climb').onclick=climbOpen;
document.getElementById('clm-x').onclick=climbClose;
document.getElementById('clm').onclick=function(e){if(e.target===this)climbClose();};
document.addEventListener('keydown',function(e){if(e.key==='Escape')climbClose();});
subjBar();streakBar();climbDraw();layout();restart();
window.addEventListener('resize',climbDraw);if(window.AnikSync)AnikSync.onState(function(){climbDraw();});
window.addEventListener('load',layout);setTimeout(layout,300);
</script>
