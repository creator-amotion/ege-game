<div class="top" id="top">

  <div class="climb" id="climb" aria-label="Подъём дня"><svg id="cl-svg" viewBox="0 0 64 56" aria-hidden="true"></svg><div class="cl-r"><div class="cl-h"><b id="cl-t"></b><span id="cl-s"></span></div><div class="cl-bar" id="cl-bar"></div></div></div>

<script>
/* Лента задач: одна задача на экран, листаешь вверх — следующая. Задачи — те же, что в тренажёре и практике
   (банк ФИПИ и задачи по образцу). Сложность подстраивается: начинаем с первых номеров, верные ответы ведут к более
   трудным, ошибки — обратно к простым. Результаты уходят боту теми же строками, что из тренажёра (n_… и l_…). */
var TG=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor('#F3EEE2');TG.setBackgroundColor('#F3EEE2');}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function lsGet(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function pad2(n){return (n<10?'0':'')+n;}
function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(u);return r.json();});}
// код навыка для m_…: тот же, что у практики профиля (math.html: fnv → два знака base62)
var B62='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
function fnv(str){var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h>>>0;}
function b62(n,w){var o='';for(var i=0;i<w;i++){o=B62[n%62]+o;n=Math.floor(n/62);}return o;}
function range(a,b){var r=[];for(var i=a;i<=b;i++)r.push(i);return r;}

/* ── проверка ответа: те же правила, что в тренажёре и у бота ── */
function normWord(s){return String(s).toUpperCase().replace(/Ё/g,'Е').replace(/[^0-9A-ZА-Я]/g,'');}
function digitsOf(s){return String(s).replace(/\D/g,'');}
function toNum(s){
  s=String(s).trim().replace(/\s+/g,'').replace(',','.').replace(/[−–]/g,'-');
  var m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(m){var d=parseFloat(m[2]);return d?parseFloat(m[1])/d:NaN;}
  return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN;
}
function shaped(t,v){v=String(v).trim();if(!v)return false;if(t.k==='num')return !isNaN(toNum(v));if(t.k==='word')return normWord(v).length>0;return digitsOf(v).length>0;}
function right(t,u){
  return t.a.some(function(a){
    if(t.k==='num'){var x=toNum(u),c=toNum(a);return !isNaN(x)&&!isNaN(c)&&Math.abs(x-c)<1e-9*Math.max(1,Math.abs(c));}
    if(t.k==='set')return digitsOf(u).split('').sort().join('')===digitsOf(a).split('').sort().join('');
    if(t.k==='seq')return digitsOf(u)===digitsOf(a);
    return normWord(u)===normWord(a);
  });
}
function renderText(t){
  var lines=String(t).split('\n'),out='',i=0;
  while(i<lines.length){
    if(lines[i].indexOf(' | ')>=0){var rows=[];while(i<lines.length&&lines[i].indexOf(' | ')>=0){rows.push(lines[i].split(' | '));i++;}
      out+='<table>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</table>';}
    else{var ch=[];while(i<lines.length&&lines[i].indexOf(' | ')<0){ch.push(lines[i]);i++;}var x=ch.join('\n').replace(/^\n+|\n+$/g,'');if(x)out+='<p>'+esc(x).replace(/\n/g,'<br>')+'</p>';}
  }
  return out;
}
function mathIn(el,k){
  if(window.renderMathInElement){try{renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});AnikTheory.glue(el);}catch(e){}}
  else if((k||0)<60)setTimeout(function(){mathIn(el,(k||0)+1);},250);
}

/* ── предметы ленты: какие номера берём (короткие задания без длинного текста) и как их читать ── */
var SUBJ={
  'ege-math':{t:'ЕГЭ профиль',nums:range(1,12),file:function(n){return 'trainer/ege-math_'+n+'.json';},
    task:function(x){return {id:x.id,t:x.t,a:x.a,k:'num',f:x.f,s:x.s,kind:x.k,sk:x.sk};},
    learn:function(t){return t.kind?'math.html#learn='+t.kind:'math.html';}},
  'ege-mathb':{t:'ЕГЭ база',nums:range(1,21),code:'b',file:function(n){return 'trainer/ege-mathb_'+n+'.json';},
    task:function(x){return x;},learn:function(t,n){return 'trainer.html#ege-mathb&n='+n+'&learn';}},
  'ege-rus':{t:'ЕГЭ русский',nums:range(4,21),code:'e',file:function(n){return 'trainer/ege-rus_'+n+'.json';},
    task:function(x,n){var a=String(x.answer).split('|'),dg=/^\d+$/.test(a[0]);
      return {id:x.id,t:x.text,a:a,k:dg?((n===8||/соответстви|последовательност/i.test(x.text))?'seq':'set'):'word',s:x.s};},
    learn:function(t,n){return 'rus-ege.html#theory='+n;}},
  'oge-math':{t:'ОГЭ математика',nums:range(6,19),code:'o',file:function(n){return 'trainer/oge-math_'+n+'.json';},
    task:function(x){return x;},learn:function(t,n){return 'trainer.html#oge-math&n='+n+'&learn';}},
  'oge-rus':{t:'ОГЭ русский',nums:range(4,9),code:'r',file:function(n){return 'trainer/oge-rus_'+n+'.json';},
    task:function(x){return x;},learn:function(t,n){return 'trainer.html#oge-rus&n='+n+'&theory';}}
};
var ORDER=['ege-math','ege-mathb','ege-rus','oge-math','oge-rus'];
var cache={},KINDS=null,LEARN={};
function pack(sid,n){var key=sid+'_'+n;if(cache[key])return Promise.resolve(cache[key]);
  return getJSON(SUBJ[sid].file(n)).then(function(d){var arr=Array.isArray(d)?d:d.tasks;
    cache[key]=arr.map(function(x){return SUBJ[sid].task(x,n);}).filter(function(t){return t&&t.a&&t.a.length&&String(t.t).length<=900;});return cache[key];});}
function learnParts(sid,n){var key=sid+'_'+n;if(LEARN[key]!==undefined)return Promise.resolve(LEARN[key]);
  return getJSON('trainer/learn_'+sid+'_'+n+'.json').then(function(d){LEARN[key]=d.parts||[];return LEARN[key];}).catch(function(){LEARN[key]=[];return [];});}

/* ── состояние ── */
var st=lsGet('anik_feed',{sid:null,lvl:{},streak:0,best:0});
st.lvl=st.lvl||{};
var SID=SUBJ[st.sid]?st.sid:defaultSid();
/* стартовая проверка: feed.html?diag=<предмет>[&only=1,4,7] — по одной задаче на каждый номер, без подстройки сложности.
   Ответы уходят боту как обычно и сразу дают прогнозу «проверенные» номера */
var DIAG=(function(){
  var m=/[?&]diag=([a-z-]+)/.exec(location.search);if(!m||!SUBJ[m[1]])return null;
  var o=/[?&]only=([\d,]+)/.exec(location.search),nums=SUBJ[m[1]].nums.slice();
  if(o){var want=o[1].split(',').map(Number);var f=nums.filter(function(n){return want.indexOf(n)>=0;});if(f.length)nums=f;}
  return {sid:m[1],queue:nums.slice(),total:nums.length,i:0,ok:0,done:0,ended:false};
})();
if(DIAG)SID=DIAG.sid;
function defaultSid(){var c=lsGet('anik_choice',null),m={'ege.rus':'ege-rus','ege.math':'ege-math','ege.mathb':'ege-mathb','oge.rus':'oge-rus','oge.math':'oge-math'};
  if(c&&m[c.exam+'.'+c.subj])return m[c.exam+'.'+c.subj];
  var s=window.AnikSync&&AnikSync.state&&AnikSync.state();var e=s&&s.exam,su=s&&s.subject;
  if(e==='oge')return su==='rus'?'oge-rus':'oge-math';if(e==='ege'&&su==='rus')return 'ege-rus';if(e==='ege'&&su==='mathb')return 'ege-mathb';return 'ege-math';}
function save(){st.sid=SID;lsSet('anik_feed',st);}
var feed=document.getElementById('feed'),slides=[],busy=false,pending={},sinceFlush=0;

function layout(){
  var top=document.getElementById('top').offsetHeight,tabs=document.querySelector('.anik-tabs'),bot=tabs?tabs.offsetHeight:0;
  feed.style.top=top+'px';feed.style.bottom=bot+'px';
}
window.addEventListener('resize',layout);

function subjBar(){
  var b=document.getElementById('subj');
  b.innerHTML=ORDER.map(function(k){return '<button data-s="'+k+'" class="'+(k===SID?'on':'')+'">'+SUBJ[k].t+'</button>';}).join('');
  [].forEach.call(b.children,function(x){x.onclick=function(){if(x.dataset.s===SID)return;flush();SID=x.dataset.s;save();subjBar();restart();};});
}
function streakBar(){document.getElementById('streak').textContent=(st.streak>=3?'🔥 ':'')+st.streak+' подряд';}

/* сложность: «уровень» 0…1 по каждому предмету; номер выбираем рядом с ним (первые номера — проще) */
function pickNum(){
  var nums=SUBJ[SID].nums,L=st.lvl[SID]||0,c=L*(nums.length-1),w=Math.max(1.5,nums.length*0.15);
  var ws=nums.map(function(_,i){return Math.exp(-Math.pow(i-c,2)/(2*w*w));}),sum=ws.reduce(function(a,b){return a+b;},0),r=Math.random()*sum;
  for(var i=0;i<nums.length;i++){r-=ws[i];if(r<=0)return nums[i];}
  return nums[nums.length-1];
}
var seen=lsGet('anik_feed_seen',[]);
function nextTask(){
  if(DIAG){if(!DIAG.queue.length)return Promise.resolve(null);}
  var n=DIAG?DIAG.queue.shift():pickNum(),sid=SID;
  return pack(sid,n).then(function(arr){
    if(!arr.length)return null;
    var fresh=arr.filter(function(t){return seen.indexOf(t.id)<0;});if(!fresh.length)fresh=arr;
    var t=fresh[Math.floor(Math.random()*fresh.length)];
    if(DIAG){var short=fresh.filter(function(x){return String(x.t).length<450;});if(short.length)t=short[Math.floor(Math.random()*short.length)];}
    seen.push(t.id);if(seen.length>600)seen=seen.slice(-600);lsSet('anik_feed_seen',seen);
    return {sid:sid,n:n,t:t,diag:DIAG?++DIAG.i:0};
  });
}

function diagIntro(){
  var s=document.createElement('section');s.className='slide intro';
  var S=SUBJ[DIAG.sid],skip=DIAG.sid==='ege-rus'?'<p>Задания 1–3 и 22–26 (с длинным текстом) проверим отдельно — в тренажёре.</p>':'';
  s.innerHTML='<div class="inner" style="justify-content:center"><h1>Стартовая проверка</h1>'+
    '<p><b>'+esc(S.t)+'</b>: по одной задаче на каждый номер — '+DIAG.total+' '+plural(DIAG.total,'задача','задачи','задач')+', около '+Math.max(5,Math.round(DIAG.total*1.2))+' минут.</p>'+
    '<p>Не знаешь — смело жми «Не знаю»: это тоже результат. После проверки Аник покажет честный прогноз и что подтянуть первым.</p>'+skip+
    '<button class="btn" id="diaggo" style="margin-top:16px;width:100%">Начать проверку</button></div>';
  s.querySelector('#diaggo').onclick=function(){var i=slides.indexOf(s);if(slides[i+1])slides[i+1].scrollIntoView({behavior:'smooth'});};
  return s;
}
function diagSum(){return esc(SUBJ[DIAG.sid].t)+': верно <b>'+DIAG.ok+' из '+DIAG.done+'</b>'+(DIAG.done<DIAG.total?' (ответь на оставшиеся '+(DIAG.total-DIAG.done)+' — они выше)':'')+'.';}
function diagEnd(){
  var s=document.createElement('section');s.className='slide intro';
  var S=SUBJ[DIAG.sid];
  s.innerHTML='<div class="inner" style="justify-content:center"><h1>Проверка пройдена</h1>'+
    '<p id="diag-sum">'+diagSum()+'</p>'+
    '<p>Результаты ушли в твой прогресс: бот и «Сегодня» уже считают прогноз по этим номерам и подскажут, что подтянуть первым.</p>'+
    '<div class="row2" style="margin-top:16px"><a href="today.html">На «Сегодня»</a><a class="main" href="feed.html">В ленту задач</a></div></div>';
  return s;
}
function plural(n,a,b,c){var m=n%10,h=n%100;return h>10&&h<15?c:m===1?a:m>1&&m<5?b:c;}
function intro(){
  if(DIAG)return diagIntro();
  var standalone=window.matchMedia&&matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  var s=document.createElement('section');s.className='slide intro';
  s.innerHTML='<div class="inner" style="justify-content:center"><h1>Лента задач</h1>'+
    '<p>Одна задача — один экран. Ответил — листай вверх, следующая уже ждёт.</p>'+
    '<p>Начинаем с простых номеров. Решаешь верно — задачи становятся труднее, ошибаешься — возвращаемся к простым.</p>'+
    (!(TG&&TG.initData)&&!standalone?'<div class="install"><b>Поставь Аника на телефон.</b><br>iPhone: «Поделиться» → «На экран „Домой“». Android: меню браузера ⋮ → «Установить приложение» или «Добавить на главный экран».</div>':'')+
    '<div id="linkbox"></div><div class="hint" style="margin-top:22px"><span>↑</span> листай вверх</div></div>';
  if(window.AnikSync&&AnikSync.linkCard&&!AnikSync.inTelegram()&&!AnikSync.linked())AnikSync.linkCard(s.querySelector('#linkbox'));
  return s;
}

function slideFor(it){
  var t=it.t,S=SUBJ[it.sid],L=st.lvl[it.sid]||0,dots='';
  for(var i=0;i<5;i++)dots+='<b class="'+(i<=Math.round(L*4)?'on':'')+'"></b>';
  var s=document.createElement('section');s.className='slide';
  var figs=(t.f||[]).map(function(f){return '<img src="'+esc(f)+'" alt="Чертёж к заданию" loading="lazy">';}).join('');
  var nb='';
  if(t.k==='seq'||t.k==='set'){var txt=String(t.t),o=txt.match(/(^|\n)\s*\d\)/g),cnt=Math.min(9,Math.max(5,o?o.length:5));
    t.a.forEach(function(a){digitsOf(a).split('').forEach(function(d){cnt=Math.max(cnt,+d);});});cnt=Math.min(9,cnt);
    for(var j=1;j<=cnt;j++)nb+='<button type="button" data-d="'+j+'">'+j+'</button>';nb='<div class="nbs" style="--cols:'+Math.min(cnt,5)+'">'+nb+'</div>';}
  var ph={num:'Ответ числом',seq:'Цифры подряд',set:'Цифры подряд',word:'Одно слово'}[t.k]||'Ответ';
  var tag=it.diag?'<span>Проверка · '+it.diag+' из '+DIAG.total+'</span><span>№'+it.n+'</span>':'<span>'+esc(S.t)+' · №'+it.n+'</span><span class="lvl" title="сложность">'+dots+'</span>';
  s.innerHTML='<div class="inner"><div class="tg">'+tag+'</div>'+
    '<div class="task">'+renderText(t.t)+figs+'</div>'+nb+
    '<div class="ans"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="'+(t.k==='word'?'text':'decimal')+'" placeholder="'+ph+'" enterkeyhint="done"><button class="chk">Ответить</button></div>'+
    (t.k==='num'?'<div class="keys"><button type="button" data-ins="-">− минус</button><button type="button" data-ins=",">, запятая</button><button type="button" data-ins="/">/ дробь</button></div>':'')+
    '<div class="out"></div><button class="skip">Не знаю — показать ответ</button></div>';
  if(t.k==='seq'||t.k==='set')s.querySelector('input').setAttribute('inputmode','numeric');
  var inp=s.querySelector('input'),done=false;
  [].forEach.call(s.querySelectorAll('.nbs button'),function(b){b.onclick=function(){if(done)return;var d=b.dataset.d,v=digitsOf(inp.value);v=v.indexOf(d)>=0?v.replace(d,''):v+d;if(t.k==='set')v=v.split('').sort().join('');inp.value=v;sync();};});
  function sync(){[].forEach.call(s.querySelectorAll('.nbs button'),function(b){b.classList.toggle('on',inp.value.indexOf(b.dataset.d)>=0);});}
  inp.addEventListener('input',sync);
  // на телефонной цифровой клавиатуре нет минуса и дробной черты — вставляем их кнопками туда, где курсор
  [].forEach.call(s.querySelectorAll('.keys button'),function(b){
    b.onmousedown=function(e){e.preventDefault();};
    b.onclick=function(){if(done)return;var c=b.dataset.ins,v=inp.value,a=inp.selectionStart==null?v.length:inp.selectionStart,z=inp.selectionEnd==null?v.length:inp.selectionEnd;
      if(c==='-'&&a===0&&v.charAt(0)==='-'){inp.value=v.slice(1);return;}            // повторное нажатие на минус в начале — убрать
      inp.value=v.slice(0,a)+c+v.slice(z);try{inp.setSelectionRange(a+1,a+1);}catch(e){}};
  });
  function answer(v){
    if(done)return;
    if(v!==null&&!shaped(t,v)){s.querySelector('.out').innerHTML='<div class="ffb bad">'+(t.k==='num'?'Напиши ответ числом, например 0,35 или 3/7.':t.k==='word'?'Напиши ответ словом.':'Напиши цифры ответа, например 134.')+'</div>';return;}
    done=true;inp.blur();
    var ok=v!==null&&right(t,v);
    inp.disabled=true;inp.classList.add(ok?'ok':'err');s.querySelector('.chk').remove();s.querySelector('.skip').remove();
    [].forEach.call(s.querySelectorAll('.nbs button'),function(b){b.disabled=true;});
    record(it,ok,v===null);
    if(!it.diag)climbAfter(s,it,ok);
    if(it.diag){DIAG.done++;if(ok)DIAG.ok++;var ds=document.getElementById('diag-sum');if(ds)ds.innerHTML=diagSum();if(DIAG.done>=DIAG.total){st.lvl[DIAG.sid]=Math.round(80*DIAG.ok/DIAG.total)/100;save();flush();}}
    var out=s.querySelector('.out');
    out.innerHTML='<div class="ffb '+(ok?'good':'bad')+'">'+(ok?'Верно! Шаг вверх'+(st.streak>=3?' · '+st.streak+' подряд 🔥':''):(v===null?'Честно — это тоже шаг: теперь знаешь. Ответ':'Здесь скользко — следующая будет проще. Ответ')+': <b>'+esc(t.a[0])+'</b>')+'<span class="key"></span></div>'+
      (t.sol&&t.sol.length?'<details class="sol"'+(ok?'':' open')+'><summary>'+(ok?'Посмотреть решение':'Решение по шагам')+'</summary><ol>'+t.sol.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol></details>':'')+
      '<div class="row2"><a href="'+esc(S.learn(t,it.n))+'">Теория по №'+it.n+'</a><button class="main nx">Дальше ↑</button></div>';
    out.querySelector('.nx').onclick=function(){var i=slides.indexOf(s);if(slides[i+1])slides[i+1].scrollIntoView({behavior:'smooth'});};
    mathIn(out);
    keyFor(it).then(function(k){if(k){var el=out.querySelector('.key');el.innerHTML='<b>Главное</b>'+esc(k);mathIn(el);}});
    ensure();
  }
  s.querySelector('.chk').onclick=function(){answer(inp.value);};
  s.querySelector('.skip').onclick=function(){answer(null);};
  inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();answer(inp.value);}};
  mathIn(s);
  return s;
}
// «Главное» после ответа: правило типа задачи (профиль) или части темы (ОГЭ, база)
function keyFor(it){
  if(it.sid==='ege-math'){return (KINDS?Promise.resolve(KINDS):getJSON('math_kinds.json').then(function(d){KINDS=d.kinds;return KINDS;}).catch(function(){return {};}))
    .then(function(K){var k=K[it.t.kind];return k&&(k.key||(k.th&&k.th[0]))||'';});}
  if(it.sid==='oge-math'||it.sid==='ege-mathb')return learnParts(it.sid,it.n).then(function(ps){var p=ps.filter(function(x){return x.id===it.t.p;})[0]||ps[0];return p&&(p.key||p.rule)||'';});
  return Promise.resolve('');
}

/* ── «Восхождение»: каждый день — подъём на свою гору. Вершина — цель дня. Верный ответ — шаг вверх (на трудных номерах
   шаг крупнее, а склон круче). Ошибка и «Не знаю» — шага нет, но и отката нет: путь никогда не уменьшается.
   Каждые REST верных — привал (можно спокойно закончить), на вершине — экран «Вершина дня взята». Без жизней и угроз
   (маркетинг: «лента-игра.md» в Штабе). ── */
var REST=8;
function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function climbState(){var c=lsGet('anik_climb',null);if(!c||c.d!==todayKey())c={d:todayKey(),steps:0,ok:0,tot:0,rests:0,summit:false,best:0,run:0};return c;}
function climbGoal(){var s=window.AnikSync&&AnikSync.state&&AnikSync.state();return Math.max(5,(s&&s.goal)||10);}
function climbDraw(){
  var svg=document.getElementById('cl-svg');if(!svg)return;
  var c=climbState(),g=climbGoal(),f=Math.min(1,c.steps/g),L=st.lvl[SID]||0;
  // крутая гора в квадрате: чем выше уровень сложности, тем уже основание (склон круче)
  var px=34,py=7,half=Math.round(30-10*L),left=px-half,right=px+half,base=56;
  var edge=function(y){return left+(px-left)*((base-y)/(base-py));},pts=[[left+6,base-3]],n=5;
  for(var i=1;i<n;i++){var t=i/n,y=base-3-(base-3-(py+6))*t,e=edge(y);pts.push([i%2?2*px-e-4:e+4,y]);}
  pts.push([px,py+5]);
  var d='M'+pts.map(function(q){return q[0].toFixed(1)+' '+q[1].toFixed(1);}).join(' L');
  svg.innerHTML='<polygon points="0,56 10,38 20,46 30,30 40,42 52,26 64,40 64,56" fill="#C0CDF8"/>'+
    '<polygon points="'+left+',56 '+px+','+py+' '+right+',56" fill="#7098F8" stroke="#111" stroke-width="2" stroke-linejoin="round"/>'+
    '<polygon points="'+(px-6)+','+(py+10)+' '+px+','+py+' '+(px+6)+','+(py+11)+' '+(px+2)+','+(py+8)+' '+(px-2)+','+(py+11)+'" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/>'+
    '<path id="cl-path" d="'+d+'" fill="none" stroke="#111" stroke-width="1.4" stroke-dasharray="2.5 2.5"/>'+
    '<path d="'+d+'" fill="none" stroke="#E5332A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="'+(f*100).toFixed(1)+' 100"/>'+
    '<line x1="'+px+'" y1="'+py+'" x2="'+px+'" y2="'+(py-6)+'" stroke="#111" stroke-width="1.5"/>'+
    '<polygon points="'+px+','+(py-6)+' '+(px+8)+','+(py-4)+' '+px+','+(py-2)+'" fill="'+(c.summit?'#F6CE2E':'#E5332A')+'" stroke="#111" stroke-width=".8"/>'+
    '<g id="cl-me"><circle r="4.2" fill="#E5332A" stroke="#111" stroke-width="1.6"/></g>';
  var path=document.getElementById('cl-path');
  try{var P=path.getPointAtLength(path.getTotalLength()*f);document.getElementById('cl-me').setAttribute('transform','translate('+P.x.toFixed(1)+' '+P.y.toFixed(1)+')');}catch(e){}
  var steps=Math.floor(c.steps),cells='',cur=Math.min(g,steps);
  for(var k=1;k<=g;k++)cells+='<i class="'+(k<cur?'on':k===cur?'me':'')+(k<g&&k%Math.max(3,Math.round(g/3))===0?' camp':'')+'"></i>';
  document.getElementById('cl-bar').innerHTML=cells;
  document.getElementById('cl-t').textContent=c.summit?'Вершина дня взята 🏔':'Подъём дня';
  document.getElementById('cl-s').textContent=c.summit?steps+' '+plural(steps,'шаг','шага','шагов')+' · бонус':Math.min(steps,g)+' из '+g+' шагов';
}
// после ответа: шаг, привал или вершина — отдельным слайдом сразу за этой задачей
function climbAfter(slide,it,ok){
  var c=climbState(),g=climbGoal(),L=st.lvl[it.sid]||0;
  c.tot++;
  if(ok){c.ok++;c.run++;c.best=Math.max(c.best,c.run);c.steps+=1+Math.round(L*2)/2;}else c.run=0;
  var special=null;
  if(ok&&!c.summit&&c.steps>=g){c.summit=true;special='summit';}
  else if(ok&&c.ok%REST===0&&c.ok>0){c.rests++;special='rest';}
  lsSet('anik_climb',c);climbDraw();
  if(special){var el=specialSlide(special,c,g),i=slides.indexOf(slide);
    if(i>=0){if(slides[i+1])feed.insertBefore(el,slides[i+1]);else feed.appendChild(el);slides.splice(i+1,0,el);}}
}
var VIEWS=['🏔️🌲⛺','🌄🏕️🌲','🗻🌤️🦅','⛰️🌲🌲'];
function specialSlide(kind,c,g){
  var s=document.createElement('section');s.className='slide rest';
  var aim=window.AnikSync&&AnikSync.state&&AnikSync.state(),a=aim&&aim.aim;
  var aimLine=a&&a.t?'<p>Ещё один день пути '+(a.u==='g'?'к оценке «'+a.t+'»':'к '+a.t+' баллам')+' ✓</p>':'';
  if(kind==='summit')
    s.innerHTML='<div class="inner" style="justify-content:center"><div class="view">🏔️🚩</div><h1>Вершина дня взята</h1>'+
      '<p>Сегодня верно <b>'+c.ok+' из '+c.tot+'</b>, лучшая серия — '+c.best+'.</p>'+aimLine+
      '<p>Можно остановиться на этом — или пройти бонусный хребет: задачи дальше, без обязательств.</p>'+
      '<div class="row2" style="margin-top:14px"><a href="today.html">На сегодня хватит</a><button class="main up">Бонусный хребет ↑</button></div></div>';
  else
    s.innerHTML='<div class="inner" style="justify-content:center"><div class="view">'+VIEWS[c.rests%VIEWS.length]+'</div><h1>Привал</h1>'+
      '<p>Пройдено '+Math.floor(c.steps)+' из '+g+' до вершины. Сегодня верно <b>'+c.ok+' из '+c.tot+'</b>.</p>'+
      '<p>Хорошее место, чтобы перевести дух. Остановиться сейчас — тоже правильно: завтра подъём продолжится.</p>'+
      '<div class="row2" style="margin-top:14px"><a href="today.html">На сегодня хватит</a><button class="main up">Дальше вверх ↑</button></div></div>';
  s.querySelector('.up').onclick=function(){var i=slides.indexOf(s);if(slides[i+1])slides[i+1].scrollIntoView({behavior:'smooth'});};
  return s;
}

/* ── результаты: копим и отправляем пачками; тренажёр видит их в своей статистике ── */
function record(it,ok,skipped){
  if(ok){st.streak++;st.best=Math.max(st.best||0,st.streak);}else if(!skipped)st.streak=0;   // «Не знаю» — честно, серию не рвёт
  var L=st.lvl[it.sid]||0;if(!it.diag)st.lvl[it.sid]=Math.max(0,Math.min(1,L+(ok?0.06:-0.08)));
  save();streakBar();
  // профиль: в знание навыка (m_ — как практика на math.html) и в карту знаний по типу задачи (l_…-p); остальное — n_ тренажёра
  var keys=it.sid==='ege-math'?[it.t.sk?'m|'+it.t.sk:'',it.t.kind?'l_'+it.t.kind+'-p':''].filter(Boolean):[it.sid+'|'+it.n];
  keys.forEach(function(key){var b=pending[key]||(pending[key]=[0,0]);b[1]++;if(ok)b[0]++;});
  if(it.sid!=='ege-math'&&it.sid!=='ege-rus'){var all=lsGet('anik_tr',{}),k=it.sid+'_'+it.n,x=all[k]||{ok:0,tot:0};x.ok+=ok?1:0;x.tot++;x.d=Date.now();all[k]=x;lsSet('anik_tr',all);}
  if(++sinceFlush>=5)flush();
}
function flush(){
  sinceFlush=0;
  var keys=Object.keys(pending);if(!keys.length||!window.AnikSync)return;
  var nums='',m='';
  keys.forEach(function(k){var b=pending[k];
    if(k.indexOf('m|')===0){var tot=Math.min(9,b[1]);m+=b62(fnv(k.slice(2))%3844,2)+Math.min(tot,b[0])+tot;}
    else if(k.indexOf('l_')===0){try{AnikSync.send(k+pad2(Math.min(b[0],99))+pad2(Math.min(b[1],99)));}catch(e){}}
    else{var p=k.split('|');nums+=SUBJ[p[0]].code+pad2(+p[1])+pad2(Math.min(b[0],99))+pad2(Math.min(b[1],99));}});
  if(nums){try{AnikSync.send('n_'+nums);}catch(e){}}
  if(m){try{AnikSync.send('m_'+m);}catch(e){}}
  pending={};
}
document.addEventListener('visibilitychange',function(){if(document.hidden)flush();});
window.addEventListener('pagehide',flush);

/* ── лента: держим запас из трёх задач впереди ── */
function ensure(){
  if(busy)return;
  var cur=current(),ahead=slides.length-1-cur;
  if(ahead>=3)return;
  busy=true;var sid=SID;
  nextTask().then(function(it){busy=false;if(sid!==SID)return;
    if(!it){if(DIAG&&!DIAG.ended){DIAG.ended=true;var e=diagEnd();feed.appendChild(e);slides.push(e);}return;}
    var s=slideFor(it);feed.appendChild(s);slides.push(s);ensure();
  }).catch(function(){busy=false;if(!slides.length)feed.innerHTML='<section class="slide"><div class="empty">Не получилось загрузить задачи. Проверь интернет.</div></section>';});
}
function current(){var h=feed.clientHeight||1;return Math.round(feed.scrollTop/h);}
feed.addEventListener('scroll',function(){ensure();},{passive:true});
function restart(){feed.innerHTML='';slides=[];var i=intro();feed.appendChild(i);slides.push(i);feed.scrollTop=0;busy=false;ensure();}

if(DIAG){document.getElementById('subj').style.display='none';document.getElementById('climb').style.display='none';}
subjBar();streakBar();climbDraw();layout();restart();
window.addEventListener('resize',climbDraw);if(window.AnikSync)AnikSync.onState(function(){climbDraw();});
window.addEventListener('load',layout);setTimeout(layout,300);
</script>
