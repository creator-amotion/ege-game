<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F3EEE2">
<title>Аник — сегодня и марки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Golos+Text:wght@400..700&display=swap">
<link rel="stylesheet" href="anik.css?v=3">
<script src="anik-sync.js?v=2"></script>
<script src="anik-nav.js?v=1" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
main{max-width:520px;margin:0 auto;padding:18px 16px 24px}
.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.date{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:.98;margin:12px 0 6px}
.lead{font-size:15px;line-height:1.5;margin-bottom:6px}
.stl{margin:26px 0 12px;padding-top:8px;border-top:2px solid var(--ink);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big-n{position:relative;overflow:hidden;padding:14px 16px;min-height:110px}
.big-n .n{font-family:var(--display);font-size:58px;font-weight:800;letter-spacing:-3px;line-height:.9}
.big-n .l{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:6px}
.big-n.red{background:var(--red)}.big-n.blue{background:var(--blue);color:#fff}.big-n.yellow{background:var(--yellow)}
.goalbar{height:10px;background:rgba(17,17,17,.25);margin-top:10px}.goalbar i{display:block;height:100%;background:var(--ink)}
.blue .goalbar{background:rgba(255,255,255,.3)}.blue .goalbar i{background:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.cal .h{font-size:10px;font-weight:600;color:var(--muted);text-align:center;letter-spacing:1px}
.cal .d{aspect-ratio:1;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}
.cal .d.on{background:var(--blue);color:#fff}
.cal .d.today{outline:3px solid var(--ink);outline-offset:1px}
.cal .d.future{background:transparent;color:var(--line)}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.plan{display:grid;gap:8px}
.pitem{position:relative;display:block;text-decoration:none;color:var(--ink);padding:14px 16px 14px 20px;background:#fff;border-left:8px solid var(--col,var(--red))}
.pitem:hover{outline:3px solid var(--ink);outline-offset:2px}
.pitem .t{font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.pitem .s{font-size:13px;color:var(--muted);margin-top:4px}
.pitem .arr{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:700}
.badge{display:inline-block;margin-right:6px;padding:1px 6px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:var(--yellow);color:var(--ink)}
.badge.weak{background:var(--red-t)}.badge.repeat{background:var(--blue-t)}
.near{background:#fff;padding:12px 16px;margin-top:8px}
.near .t{font-weight:600}
.near .b{height:8px;background:var(--line2);margin-top:8px}.near .b i{display:block;height:100%;background:var(--blue)}
.near small{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.empty{background:#fff;padding:18px 16px;color:var(--muted);font-size:14px;line-height:1.55}
.empty b{color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;padding:0 20px;margin-top:10px;border:0;background:var(--ink);color:var(--paper);font-size:15px;font-weight:600;text-decoration:none;cursor:pointer}
.btn::after{content:"→";color:var(--yellow);font-weight:700}
/* марки */
.tabs3{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 12px;padding:0 16px;scrollbar-width:none}
.tabs3::-webkit-scrollbar{display:none}
.tabs3 button{flex:none;min-height:42px;padding:0 14px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs3 button.on{background:var(--ink);color:var(--paper)}
.counter{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
.counter small{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:360px){.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stamp{position:relative;overflow:hidden;aspect-ratio:3/4;padding:8px;border:0;background:var(--col,var(--red));color:var(--ink);text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:inset 0 0 0 3px var(--paper),0 0 0 2px var(--ink);outline:2px dashed var(--ink);outline-offset:3px;margin:3px}
.stamp.blue{color:#fff}
.stamp .num{position:absolute;right:-4px;bottom:-14px;font-family:var(--display);font-size:78px;font-weight:800;line-height:.8;letter-spacing:-5px;color:rgba(255,255,255,.6);pointer-events:none}
.stamp.blue .num{color:#93A9EA}
.stamp .nm{position:relative;hyphens:auto;overflow-wrap:break-word;font-family:var(--display);font-size:12px;font-weight:800;line-height:1.1;letter-spacing:-.2px;padding:8px 6px 0}
.stamp .dt{position:relative;font-size:10px;font-weight:600;letter-spacing:.5px;padding:0 6px 6px}
.stamp.locked{background:transparent;color:var(--muted);box-shadow:none;outline:2px dashed var(--line);border:0}
.stamp.locked .num{color:var(--chip)}
.stamp.locked .pb{position:absolute;left:8px;right:8px;bottom:10px;height:6px;background:var(--line2)}
.stamp.locked .pb i{display:block;height:100%;background:var(--blue)}
.stamp .new{position:absolute;right:6px;top:6px;background:var(--ink);color:var(--yellow);font-size:9px;font-weight:700;letter-spacing:1px;padding:2px 5px}
.sheet{position:fixed;inset:0;background:rgba(17,17,17,.5);display:flex;align-items:flex-end;z-index:30}
.sheet>div{width:100%;max-width:520px;margin:0 auto;background:var(--paper);padding:20px 16px 90px;border-top:3px solid var(--ink)}
.sheet h3{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.7px;line-height:1.05}
.sheet p{font-size:14px;line-height:1.55;margin-top:8px}
.sheet .x{float:right;min-width:44px;height:44px;border:2px solid var(--ink);background:transparent;font-size:18px;cursor:pointer}
.banner{background:var(--yellow);padding:14px 16px;margin:12px 0;font-weight:600}
.banner b{display:block;font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.4px}
</style>
</head>
<body class="today">
<main id="app"></main>
<script>
var TG=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor('#F3EEE2');TG.setBackgroundColor('#F3EEE2');}catch(e){}}
var REG=null,app=document.getElementById('app');
var WHY={new:'Новое',weak:'Слабое место',repeat:'Пора повторить'};
var SETS=[['ege.rus','ЕГЭ · Русский'],['ege.math','ЕГЭ · Математика'],['ege.mathb','ЕГЭ · База'],['oge.rus','ОГЭ · Русский'],['oge.math','ОГЭ · Математика']];
var STAMP_RULE='Марка выдаётся, когда знание по теме не ниже 80 % и три последних занятия подряд прошли хорошо: в каждом не меньше 3 ответов и не меньше 70 % верных. Игры и задания считаются.';

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function plural(n,a,b,c){var m=n%10,h=n%100;return h>10&&h<15?c:m===1?a:m>1&&m<5?b:c;}
function snap(){return window.AnikSync&&AnikSync.state()||null;}
function daysSet(){
  var s=snap(),set={};
  ((s&&s.days)||[]).forEach(function(d){set[d]=1;});
  ((window.AnikSync&&AnikSync.localDays&&AnikSync.localDays())||[]).forEach(function(d){set[d]=1;});
  return set;
}
function colorOf(skill){var sec=REG&&REG.sections[skill.section];return sec?sec.color:'#E5332A';}
function isBlue(c){return c==='#2E55C9';}
/* куда вести с навыка: игра по теме (ЕГЭ русский и профильная математика) или тренажёр по номеру */
function linkFor(s){
  if(s.exam==='ege'&&s.subject==='rus')return s.number===4?'rus-ege.html#stress':'rus-ege.html#game='+s.number;
  if(s.exam==='ege'&&s.subject==='math'){var sec=REG.sections[s.section];return sec&&sec.pack?'math.html#pack='+sec.pack:'math.html';}
  return 'trainer.html#'+s.exam+'-'+s.subject+'&n='+s.number;
}
function streakFrom(set,todayIso){
  var d=new Date(todayIso+'T12:00:00'),n=0;
  if(!set[iso(d)])d.setDate(d.getDate()-1);
  while(set[iso(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}

/* ───────── Сегодня ───────── */
function today(){
  var s=snap(),now=new Date(),todayIso=(s&&s.today)||iso(now),set=daysSet();
  var streak=s&&typeof s.streak==='number'?s.streak:streakFrom(set,todayIso);
  var goal=(s&&s.goal)||10,done=(s&&s.done_today)||0;
  var wd=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'][now.getDay()];
  var html='<div class="top"><span class="wm">аник<i>.</i></span><span class="date">'+now.getDate()+' '+['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'][now.getMonth()]+', '+wd+'</span></div>'+
    '<h1>Сегодня</h1>';
  html+='<div class="row"><div class="big-n red"><div class="n">'+streak+'</div><div class="l">'+plural(streak,'день','дня','дней')+' подряд</div></div>'+
    '<div class="big-n blue"><div class="n">'+(s?done:'—')+'<small style="font-size:22px;letter-spacing:-1px">'+(s?'/'+goal:'')+'</small></div><div class="l">ответов сегодня</div>'+(s?'<div class="goalbar"><i style="width:'+Math.min(100,Math.round(100*done/goal))+'%"></i></div>':'')+'</div></div>';
  // календарь: пять недель, неделя с понедельника
  var end=new Date(todayIso+'T12:00:00'),startMon=new Date(end);
  startMon.setDate(end.getDate()-((end.getDay()+6)%7)-28);
  var cells='';
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(function(h){cells+='<div class="h">'+h+'</div>';});
  var cnt=0;
  for(var i=0;i<35;i++){
    var d=new Date(startMon);d.setDate(startMon.getDate()+i);
    var key=iso(d),fut=d>end,on=!!set[key];
    if(on)cnt++;
    cells+='<div class="d'+(on?' on':'')+(key===todayIso?' today':'')+(fut?' future':'')+'">'+d.getDate()+'</div>';
  }
  html+='<div class="stl">Календарь занятий</div><div class="cal">'+cells+'</div><div class="legend">За пять недель занимался '+cnt+' '+plural(cnt,'день','дня','дней')+'. Синий — день с занятием.</div>';

  // план
  html+='<div class="stl">План на сегодня</div>';
  var plan=(s&&s.plan)||[];
  if(plan.length){
    html+='<div class="plan">'+plan.map(function(p){
      var sk=REG&&REG.skills.filter(function(x){return x.id===p.skill;})[0],col=sk?colorOf(sk):'#E5332A';
      var href=p.link||(sk?linkFor(sk):'index.html');
      return '<a class="pitem" style="--col:'+col+'" href="'+esc(href)+'"><div class="t">№'+p.number+' · '+esc(p.name)+'</div><div class="s"><span class="badge '+(p.why==='weak'?'weak':p.why==='repeat'?'repeat':'')+'">'+(WHY[p.why]||'Тема')+'</span>'+p.count+' '+plural(p.count,'вопрос','вопроса','вопросов')+' · ~'+p.minutes+' мин</div><span class="arr">→</span></a>';
    }).join('')+'</div>';
  }else if(s){
    html+='<div class="empty"><b>На сегодня всё.</b> План собран по твоим слабым местам. Если хочешь ещё — открой любое задание ниже.</div>';
  }else{
    html+='<div class="empty"><b>План появится после первого занятия.</b> Открой приложение из Telegram-бота и реши несколько заданий или сыграй в игру. Бот посмотрит, где у тебя слабые места, и каждый день будет предлагать три темы.</div>';
  }
  // ближайшие марки
  var near=nearStamps(s);
  if(near.length){
    html+='<div class="stl">Ближе всего к марке</div>'+near.map(function(x){
      return '<div class="near"><div class="t">'+esc(x.sk.name)+' <small style="display:inline;color:var(--muted)">№'+x.sk.number+'</small></div><div class="b"><i style="width:'+x.pct+'%"></i></div><small>знание '+Math.round(x.p*100)+' % из 80 %</small></div>';
    }).join('');
  }
  html+='<a class="btn" href="index.html">Выбрать задание</a><a class="btn" href="today.html#stamps">Мои марки</a>';
  app.innerHTML=html;
}
function nearStamps(s){
  if(!s||!REG)return [];
  var have={};(s.stamps||[]).forEach(function(x){have[x.id]=1;});
  return REG.skills.filter(function(k){return k.stamp&&!have[k.id]&&s.skills&&s.skills[k.id]&&s.skills[k.id].n>0;})
    .map(function(k){var p=s.skills[k.id].p;return {sk:k,p:p,pct:Math.min(100,Math.round(p/0.8*100))};})
    .sort(function(a,b){return b.p-a.p;}).slice(0,3);
}

/* ───────── Марки ───────── */
var curSet=null;
function stamps(setKey){
  var s=snap(),have={};
  ((s&&s.stamps)||[]).forEach(function(x){have[x.id]=x;});
  var all=REG.skills.filter(function(k){return k.stamp;});
  var groups={};all.forEach(function(k){(groups[k.exam+'.'+k.subject]=groups[k.exam+'.'+k.subject]||[]).push(k);});
  var earnedTotal=all.filter(function(k){return have[k.id];}).length;
  if(!setKey)setKey=curSet||((s&&s.exam==='oge')?'oge.rus':'ege.rus');
  curSet=setKey;
  var list=(groups[setKey]||[]).slice().sort(function(a,b){return a.number-b.number||a.name.localeCompare(b.name,'ru');});
  var gotHere=list.filter(function(k){return have[k.id];}).length;
  var todayIso=(s&&s.today)||iso(new Date()),recent=[];
  list.forEach(function(k){var h=have[k.id];if(h&&h.at){var dd=(new Date(todayIso)-new Date(h.at))/86400000;if(dd<=2)recent.push(k);}});
  var html='<div class="top"><span class="wm">аник<i>.</i></span></div><h1>Марки</h1>'+
    '<p class="lead">Марка — знак того, что тема действительно твоя. Получить её можно только занимаясь несколько дней подряд.</p>'+
    '<div class="counter">'+earnedTotal+' <small>из '+all.length+' марок получено</small></div>';
  if(recent.length)html+=recent.map(function(k){return '<div class="banner"><b>🏅 Новая марка</b>«'+esc(k.name)+'» — поздравляю!</div>';}).join('');
  html+='<div class="tabs3">'+SETS.filter(function(x){return groups[x[0]];}).map(function(x){return '<button data-s="'+x[0]+'" class="'+(x[0]===setKey?'on':'')+'">'+x[1]+'</button>';}).join('')+'</div>'+
    '<div class="counter" style="font-size:16px">'+gotHere+' <small>из '+list.length+' в этом разделе</small></div><div class="sgrid">'+
    list.map(function(k){
      var h=have[k.id],col=colorOf(k),sk=s&&s.skills&&s.skills[k.id],p=sk?sk.p:0;
      if(h){
        var isNew=h.at&&((new Date(todayIso)-new Date(h.at))/86400000<=2);
        return '<button class="stamp'+(isBlue(col)?' blue':'')+'" style="--col:'+col+'" data-id="'+esc(k.id)+'"><span class="num">'+k.number+'</span>'+(isNew?'<span class="new">NEW</span>':'')+'<span class="nm">'+esc(k.name)+'</span><span class="dt">'+esc(fmtDate(h.at))+'</span></button>';
      }
      return '<button class="stamp locked" data-id="'+esc(k.id)+'"><span class="num">'+k.number+'</span><span class="nm">'+esc(k.name)+'</span><span class="pb"><i style="width:'+Math.min(100,Math.round(p/0.8*100))+'%"></i></span></button>';
    }).join('')+'</div>'+
    (s?'':'<div class="empty" style="margin-top:14px"><b>Пока марок нет.</b> Занимайся через бота — здесь появится прогресс по каждой теме.</div>');
  app.innerHTML=html;
  Array.prototype.forEach.call(app.querySelectorAll('.tabs3 button'),function(b){b.onclick=function(){stamps(b.dataset.s);window.scrollTo(0,0);};});
  Array.prototype.forEach.call(app.querySelectorAll('.stamp'),function(b){b.onclick=function(){sheet(b.dataset.id,have[b.dataset.id]);};});
}
function fmtDate(iso_){
  if(!iso_)return '';
  var d=new Date(iso_+'T12:00:00');
  return isNaN(d)?iso_:d.getDate()+' '+['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()]+' '+d.getFullYear();
}
function sheet(id,h){
  var k=REG.skills.filter(function(x){return x.id===id;})[0],s=snap(),sk=s&&s.skills&&s.skills[id];
  var box=document.createElement('div');box.className='sheet';
  box.innerHTML='<div><button class="x" aria-label="Закрыть">×</button><h3>'+esc(k.name)+'</h3><p><b>'+({ege:'ЕГЭ',oge:'ОГЭ'}[k.exam])+' · задание №'+k.number+'</b></p><p>'+
    (h?'🏅 Марка получена '+esc(fmtDate(h.at))+'. Она остаётся навсегда.':(sk?'Знание сейчас '+Math.round(sk.p*100)+' %, ответов '+sk.n+'. ':'Ты ещё не занимался этой темой. ')+STAMP_RULE)+'</p>'+
    '<a class="btn" href="'+esc(linkFor(k))+'">'+(h?'Повторить тему':'Тренироваться')+'</a></div>';
  box.onclick=function(e){if(e.target===box||e.target.className==='x')box.remove();};
  document.body.appendChild(box);
}

function route(){
  if(!REG){app.innerHTML='<div class="empty">Загружаю…</div>';return;}
  var h=location.hash;
  if(/^#stamps/.test(h))stamps(null);else today();
}
fetch('skills_registry.json').then(function(r){return r.json();}).then(function(r){REG=r;route();}).catch(function(){app.innerHTML='<div class="empty">Не получилось загрузить. Проверь интернет и обнови страницу.</div>';});
window.addEventListener('hashchange',function(){var o=document.querySelector('.sheet');if(o)o.remove();route();window.scrollTo(0,0);});
if(window.AnikSync)AnikSync.onState(function(){if(REG&&!document.querySelector('.sheet'))route();});
</script>
</body>
</html>
