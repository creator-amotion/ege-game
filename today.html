<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F3EEE2">
<title>Аник — сегодня и марки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Golos+Text:wght@400..700&display=swap">
<link rel="stylesheet" href="anik.css?v=5">
<script src="anik-look.js?v=1"></script>
<script src="anik-sync.js?v=2"></script>
<script src="anik-nav.js?v=4" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
main{max-width:520px;margin:0 auto;padding:18px 16px 24px}
.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.date{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:.98;margin:12px 0 6px}
.lead{font-size:15px;line-height:1.5;margin-bottom:6px}
.stl{margin:26px 0 12px;padding-top:8px;border-top:2px solid var(--ink);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.stl{display:flex;justify-content:space-between;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* серия и цель дня — огромные цифры, срезанные краем плашки */
.big-n{position:relative;overflow:hidden;padding:10px 12px;min-height:150px}
.big-n .g{position:absolute;right:-8px;bottom:-36px;font-family:var(--display);font-size:190px;font-weight:800;line-height:.8;letter-spacing:-12px;pointer-events:none}
.big-n .l{position:relative;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.big-n .t{position:relative;font-family:var(--display);font-size:19px;font-weight:800;line-height:1.05;margin-top:2px}
.big-n.red{background:var(--red)}.big-n.red .g{color:var(--yellow)}
.big-n.blue{background:var(--blue);color:#fff}.big-n.blue .g{color:#7098F8}
.goalbar{position:absolute;left:0;right:0;bottom:0;height:5px}.goalbar i{display:block;height:100%;background:var(--yellow)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.cal .h{font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.cal .d{height:40px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:14px;font-weight:800;color:var(--ink)}
.cal .d.on{background:var(--blue);color:#fff}
.cal .d.today{background:var(--yellow);color:var(--ink);outline:2px solid var(--ink);outline-offset:-2px}
.cal .d.future{background:transparent;color:var(--line)}
.plan{display:grid;gap:6px}
.pitem{display:block;min-height:80px;padding:11px 110px 11px 14px;text-decoration:none}
.pitem:hover{outline:3px solid var(--ink);outline-offset:2px}
.pitem .nm{max-width:none}
.pitem .s{position:relative;font-size:12px;margin-top:3px}
.pitem .big{font-size:120px;bottom:-26px;right:8px}
.pitem .big.wide{font-size:96px}
.near{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.near .t{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:600}
.near .t small{color:var(--muted);font-weight:400}
.near .t b{font-family:var(--display);font-size:17px;font-weight:800}
.near .b{height:8px;background:var(--line2)}.near .b i{display:block;height:100%}
.empty{background:#fff;padding:18px 16px;color:var(--muted);font-size:14px;line-height:1.55}
.empty b{color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;padding:0 22px;margin-top:10px;border:0;background:var(--ink);color:var(--paper);font-size:16px;font-weight:600;text-decoration:none;cursor:pointer}
.btn::after{content:"→";color:var(--yellow);font-weight:700}
/* марки */
.mhead{display:flex;align-items:flex-end;justify-content:space-between}
.mhead .cnt{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:.9;margin-bottom:6px}
.mhead .cnt small{font-size:16px;letter-spacing:0;color:var(--muted)}
.tabs3{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 0;padding:0 16px;scrollbar-width:none}
.tabs3::-webkit-scrollbar{display:none}
.tabs3 button{flex:none;min-height:40px;padding:0 14px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs3 button.on{background:var(--ink);color:var(--paper)}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
/* марка — плитка в цвете и со знаком своего задания; неполученная — пунктир и контурный знак */
.stamp{display:block;min-height:124px;padding:10px 12px 16px;border:0;text-align:left;cursor:pointer;font:inherit}
.stamp:hover{outline:3px solid var(--ink);outline-offset:2px}
.stamp .tn{position:relative;margin-bottom:2px}
.stamp .nm{position:relative;max-width:90%}
.stamp.locked{background:transparent;color:var(--ink);outline:2px dashed var(--line);outline-offset:-2px}
.stamp.locked .big{color:transparent;-webkit-text-stroke:2px var(--line)}
.stamp.locked .big.mk{border-color:var(--line)}
.stamp .pb{position:absolute;left:0;bottom:0;height:5px}
.stamp .new{position:absolute;right:8px;top:8px;background:var(--ink);color:var(--yellow);font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 6px}
.sheet{position:fixed;inset:0;background:rgba(17,17,17,.45);display:flex;align-items:flex-end;z-index:30}
.sheet>div{width:100%;max-width:520px;margin:0 auto;background:var(--paper);padding:0 0 90px}
.sheet .sh{position:relative;overflow:hidden;min-height:150px;padding:0 20px 16px;display:flex;flex-direction:column;justify-content:flex-end}
.sheet .sh .big{font-size:200px;bottom:-40px;right:-6px}
.sheet .sh .big.low{bottom:26px;font-size:220px}
.sheet .sh .tn{position:relative;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.sheet h3{position:relative;font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.05}
.sheet .x{position:absolute;right:16px;top:16px;z-index:1;width:44px;height:44px;border:0;background:var(--ink);color:var(--paper);font-size:20px;cursor:pointer}
.sheet .bd{padding:16px 20px 0}
.sheet p{font-size:15px;line-height:1.45}
.sheet .rule{margin-top:12px;padding:10px 14px;background:#fff;font-size:14px;line-height:1.4}
.sheet .rule b{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.prof{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 2px;font-size:13px;color:var(--muted)}
.chip{min-height:36px;padding:0 12px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper)}
.chip.link{border:0;background:none;color:var(--muted);text-decoration:underline;font-weight:400;padding:0 4px}
.onb{background:#fff;padding:16px;margin:12px 0}.onb b{display:block;font-family:var(--display);font-size:20px;font-weight:800;margin-bottom:4px}
.onb .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.mix{display:inline-flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-weight:600;font-size:13px;cursor:pointer}
.mix input{width:18px;height:18px;accent-color:var(--ink)}
.lead2{font-size:15px;line-height:1.45;margin:0 0 10px}
.rcard{background:#fff;padding:12px 14px;border-left:6px solid var(--red)}
.rcard .k{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.rcard .v{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.1;margin:2px 0}
.rcard .s{font-size:13px;color:var(--muted);margin-bottom:8px}
.rcard a{display:inline-block;min-height:40px;line-height:40px;padding:0 14px;margin:0 6px 0 0;background:var(--ink);color:var(--paper);font-size:14px;font-weight:600;text-decoration:none}
.rcard a.gh{background:transparent;color:var(--ink);border:2px solid var(--ink);line-height:36px}
.pick{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 16px;margin-top:6px;background:#fff;color:var(--ink);text-decoration:none;font-weight:600}
.pick::after{content:"→";color:var(--red);font-weight:700}
.rep{font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px}
.banner{background:var(--yellow);padding:14px 16px;margin:12px 0;font-weight:600}
.banner b{display:block;font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.4px}
</style>
</head>
<body class="today">
<main id="app"></main>
<script>
var TG=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor('#F3EEE2');TG.setBackgroundColor('#F3EEE2');}catch(e){}}
var REG=null,app=document.getElementById('app');
var WHY={new:'Новое',weak:'Слабое место',repeat:'Пора повторить'};
var SETS=[['ege.rus','ЕГЭ · Русский'],['ege.math','ЕГЭ · Математика'],['ege.mathb','ЕГЭ · База'],['oge.rus','ОГЭ · Русский'],['oge.math','ОГЭ · Математика']];
var STAMP_RULE='Марка выдаётся, когда знание по теме не ниже 80 % и три последних занятия подряд прошли хорошо: в каждом не меньше 3 ответов и не меньше 70 % верных. Игры и задания считаются.';

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function plural(n,a,b,c){var m=n%10,h=n%100;return h>10&&h<15?c:m===1?a:m>1&&m<5?b:c;}
/* Бот открывает приложение со свежим снимком в ссылке (?z=…): так «Сегодня» работает и пока нет облака. Облако, когда есть, свежее. */
function b64json(z){try{var t=z.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';var bin=atob(t),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return JSON.parse(new TextDecoder('utf-8').decode(a));}catch(e){return null;}}
var ZSNAP=(function(){
  var m=/[?&]z=([\w-]+)/.exec(location.search),c=m&&b64json(m[1]);
  if(!c||c.v!==1||!c.t)return null;
  var days=[],t0=new Date(c.t+'T12:00:00');
  String(c.y||'').split('').forEach(function(ch,i){if(ch==='1'){var d=new Date(t0);d.setDate(t0.getDate()-(34-i));days.push(iso(d));}});
  return {v:1,from:'bot',today:c.t,exam:c.e||'ege',streak:c.s,goal:c.g,done_today:c.d,days:days,stamps:[],skills:{},
    plan:(c.p||[]).map(function(p){return {skill:p[0],number:p[1],why:p[2],link:p[3],name:p[4],count:10,minutes:5};}),
    rules:(c.r||[]).map(function(r){return {n:r[0],cat:r[1],name:r[2],tw:r[3],ta:r[4],gw:r[5]};})};
})();
function snap(){
  var st=window.AnikSync&&AnikSync.state()||null;
  if(st&&(!ZSNAP||st.today>=ZSNAP.today))return st;
  return ZSNAP||st;
}
function daysSet(){
  var s=snap(),set={};
  ((s&&s.days)||[]).forEach(function(d){set[d]=1;});
  ((window.AnikSync&&AnikSync.localDays&&AnikSync.localDays())||[]).forEach(function(d){set[d]=1;});
  return set;
}
// цвет и знак навыка: у каждой марки в разделе свой цвет (anik-look.js) и знак своего задания
function groupOf(k){return REG.skills.filter(function(x){return x.stamp&&x.exam===k.exam&&x.subject===k.subject;}).sort(function(a,b){return a.number-b.number||a.name.localeCompare(b.name,'ru');});}
function skinOf(k){var g=groupOf(k),i=g.indexOf(k);return AnikLook.ramp(g.length||1,k.subject!=='rus')[i<0?0:i];}
function signFor(k){return AnikLook.signOf(k.exam+'.'+k.subject,k.number);}
function colorOf(skill){var sec=REG&&REG.sections[skill.section];return sec?sec.color:'#E5332A';}
function isBlue(c){return c==='#2E55C9';}
/* куда вести с навыка: игра по теме (ЕГЭ русский и профильная математика) или тренажёр по номеру */
function linkFor(s){
  if(s.exam==='ege'&&s.subject==='rus')return s.number===4?'rus-ege.html#stress':'rus-ege.html#game='+s.number;
  if(s.exam==='ege'&&s.subject==='math'){var sec=REG.sections[s.section];return sec&&sec.pack?'math.html#pack='+sec.pack:'math.html';}
  return 'trainer.html#'+s.exam+'-'+s.subject+'&n='+s.number;
}
function streakFrom(set,todayIso){
  var d=new Date(todayIso+'T12:00:00'),n=0;
  if(!set[iso(d)])d.setDate(d.getDate()-1);
  while(set[iso(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}

/* ───────── Профиль: что готовит ученик ───────── */
var DEFAULT_URL={'ege.rus':'rus-ege.html','ege.math':'math.html','ege.mathb':'trainer.html#ege-mathb','oge.rus':'trainer.html#oge-rus','oge.math':'trainer.html#oge-math'};
var editingProfile=false,draft=[];
function getProfile(){try{var p=JSON.parse(localStorage.getItem('anik_profile'));return Array.isArray(p)?p.filter(function(k){return DEFAULT_URL[k];}):[];}catch(e){return [];}}
function setProfile(p){try{localStorage.setItem('anik_profile',JSON.stringify(p));}catch(e){}}
function profileSets(){
  var p=getProfile();if(p.length)return p;
  try{var c=JSON.parse(localStorage.getItem('anik_choice')||'null');if(c&&DEFAULT_URL[c.exam+'.'+c.subj])return [c.exam+'.'+c.subj];}catch(e){}
  return [];
}
function skipped(){try{return !!localStorage.getItem('anik_profile_skip');}catch(e){return false;}}
function setName(k){return (SETS.filter(function(x){return x[0]===k;})[0]||['',k])[1];}
function chipsHTML(sel){return SETS.map(function(x){return '<button class="chip'+(sel.indexOf(x[0])>=0?' on':'')+'" data-k="'+x[0]+'">'+x[1]+'</button>';}).join('');}
function profileHTML(prof){
  if(editingProfile||(!prof.length&&!skipped())){
    var sel=editingProfile?draft:[];
    return '<div class="onb"><b>Что готовишь?</b><span style="font-size:14px">Выбери экзамены: на «Сегодня» будут только они.</span><div class="chips" id="pchips">'+chipsHTML(sel)+'</div><button class="btn" id="pok" style="margin-top:0">Готово</button></div>';
  }
  if(!prof.length)return '';
  return '<div class="prof"><span>Готовлюсь:</span>'+prof.map(function(k){return '<span class="chip on" style="cursor:default">'+esc(setName(k))+'</span>';}).join('')+'<button class="chip link" id="pedit">изменить</button></div>';
}
function bindProfile(){
  var box=document.getElementById('pchips');
  if(box){
    if(!editingProfile)draft=[];
    Array.prototype.forEach.call(box.querySelectorAll('.chip'),function(b){b.onclick=function(){var k=b.dataset.k,i=draft.indexOf(k);if(i<0)draft.push(k);else draft.splice(i,1);b.classList.toggle('on');};});
    document.getElementById('pok').onclick=function(){if(!draft.length){try{localStorage.setItem('anik_profile_skip','1');}catch(e){}}else setProfile(draft);editingProfile=false;today();};
  }
  var ed=document.getElementById('pedit');
  if(ed)ed.onclick=function(){editingProfile=true;draft=getProfile().length?getProfile():profileSets();today();};
}

/* ───────── Что тренировать сегодня ───────── */
function setOf(id){var p=String(id||'').split('.');return p[0]+'.'+p[1];}
function mixOn(){try{return localStorage.getItem('anik_mix')==='1';}catch(e){return false;}}
function ordered(items,mix){
  var groups={},keys=[];
  items.forEach(function(it){if(!groups[it.set]){groups[it.set]=[];keys.push(it.set);}groups[it.set].push(it);});
  if(!mix)return keys.reduce(function(a,k){return a.concat(groups[k]);},[]);
  var out=[],i=0,more=true;
  while(more){more=false;keys.forEach(function(k){if(groups[k][i]){out.push(groups[k][i]);more=true;}});i++;}
  return out;
}
function ruleText(r){
  var p=[];
  if(r.tw)p.push('в заданиях '+r.tw+(r.ta?' из '+r.ta:''));
  if(r.gw)p.push('в играх '+r.gw);
  return p.length?'ошибок: '+p.join(', '):'';
}
function trainingHTML(s,prof){
  var items=[];
  ((s&&s.plan)||[]).forEach(function(p){if(!prof.length||prof.indexOf(setOf(p.skill))>=0)items.push({kind:'plan',set:setOf(p.skill),p:p});});
  ((s&&s.rules)||[]).forEach(function(r){if(!prof.length||prof.indexOf('ege.rus')>=0)items.push({kind:'rule',set:'ege.rus',r:r});});
  var mix=mixOn(),list=ordered(items,mix);
  var html='<div class="stl"><span>Сегодня тренируем</span><label class="mix"><input type="checkbox" id="mix"'+(mix?' checked':'')+'>вперемешку</label></div>';
  if(!list.length){
    if(s){html+='<div class="empty"><b>На сегодня всё.</b> План собран по твоим слабым местам. Если хочешь ещё — выбери предмет ниже.</div>';}
    else{html+='<div class="empty"><b>План появится после первого занятия.</b> Открой приложение из Telegram-бота и реши несколько заданий или сыграй в игру: бот поймёт, что подтянуть, и соберёт план.</div>';}
    var base=prof.length?prof:Object.keys(DEFAULT_URL);
    html+=base.map(function(k){return '<a class="pick" href="'+DEFAULT_URL[k]+'">'+esc(setName(k))+'</a>';}).join('');
    return html;
  }
  var names=list.slice(0,3).map(function(it){return it.kind==='plan'?it.p.name:it.r.name;}),mins=list.reduce(function(a,it){return a+(it.kind==='plan'?(it.p.minutes||5):5);},0);
  html+='<p class="lead2">Сегодня: <b>'+esc(names.join(' + '))+'</b> · около '+mins+' мин. '+(mix?'Предметы чередуются.':'Сначала один предмет, потом другой.')+'</p>';
  html+='<div class="plan">'+list.map(function(it,i){
    if(it.kind==='rule'){
      var r=it.r,g='rus-ege.html#game='+r.n+'&cat='+encodeURIComponent(r.cat);
      return '<div class="rcard"><div class="k">'+(i+1)+' · подтяни правило · №'+r.n+'</div><div class="v">'+esc(r.name)+'</div><div class="s">'+esc(ruleText(r))+'</div>'+
        '<a href="'+esc(g)+'">Игра по правилу</a><a class="gh" href="rus-ege.html#theory='+r.n+'">Теория №'+r.n+'</a></div>';
    }
    var p=it.p,sk=REG&&REG.skills.filter(function(x){return x.id===p.skill;})[0],c=sk?skinOf(sk):AnikLook.ramp(1)[0];
    var href=p.link||(sk?linkFor(sk):'index.html');
    return '<a class="pitem sgt" style="'+AnikLook.style(c)+'" href="'+esc(href)+'">'+AnikLook.signHTML(sk?signFor(sk):String(p.number))+'<div class="tn">'+(i+1)+' · № '+pad(p.number)+' · '+(WHY[p.why]||'тема').toLowerCase()+'</div><div class="nm">'+esc(p.name)+'</div><div class="s">'+(p.count||10)+' заданий · '+(p.minutes||5)+' мин</div></a>';
  }).join('')+'</div>';
  var first=list[0],fh=first.kind==='rule'?'rus-ege.html#game='+first.r.n+'&cat='+encodeURIComponent(first.r.cat):(first.p.link||'index.html');
  html+='<a class="btn" href="'+esc(fh)+'">Начать с первого</a>';
  return html;
}
function reportsHTML(){
  var r=(window.anikReports&&anikReports())||[];
  if(!r.length)return '';
  return '<div class="stl"><span>Мои обращения</span><span>'+r.length+'</span></div>'+r.slice(0,5).map(function(x){
    return '<div class="near"><div class="t"><span>Задание '+esc(x.ref||'—')+'</span><small>'+esc(String(x.at||'').replace('T',' '))+'</small></div><div class="rep">Отправлено боту. Ответ методистов придёт в чат с ботом.</div></div>';
  }).join('');
}

/* ───────── Сегодня ───────── */
function today(){
  var s=snap(),now=new Date(),todayIso=(s&&s.today)||iso(now),set=daysSet();
  var streak=s&&typeof s.streak==='number'?s.streak:streakFrom(set,todayIso);
  var goal=(s&&s.goal)||10,done=(s&&s.done_today)||0,prof=profileSets();
  var wd=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'][now.getDay()];
  var html='<div class="top"><span class="wm">аник<i>.</i></span><span class="date">'+now.getDate()+' '+['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'][now.getMonth()]+' · '+wd+'</span></div>'+
    '<h1>Сегодня</h1>'+profileHTML(prof);
  html+='<div class="row"><div class="big-n red"><span class="g" aria-hidden="true">'+streak+'</span><div class="l">серия</div><div class="t">'+plural(streak,'день','дня','дней')+'<br>подряд</div></div>'+
    '<div class="big-n blue"><span class="g" aria-hidden="true">'+(s?done:0)+'</span><div class="l">цель дня · '+goal+'</div><div class="t">'+plural(s?done:0,'ответ','ответа','ответов')+'<br>сегодня</div>'+(s?'<div class="goalbar"><i style="width:'+Math.min(100,Math.round(100*done/goal))+'%"></i></div>':'')+'</div></div>';
  html+=trainingHTML(s,prof);
  // календарь: пять недель, неделя с понедельника
  var end=new Date(todayIso+'T12:00:00'),startMon=new Date(end);
  startMon.setDate(end.getDate()-((end.getDay()+6)%7)-28);
  var cells='';
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(function(h){cells+='<div class="h">'+h+'</div>';});
  var cnt=0;
  for(var i=0;i<35;i++){
    var d=new Date(startMon);d.setDate(startMon.getDate()+i);
    var key=iso(d),fut=d>end,on=!!set[key];
    if(on)cnt++;
    cells+='<div class="d'+(on?' on':'')+(key===todayIso?' today':'')+(fut?' future':'')+'">'+d.getDate()+'</div>';
  }
  html+='<div class="stl"><span>Календарь занятий</span><span>'+cnt+' '+plural(cnt,'день','дня','дней')+' за 5 недель</span></div><div class="cal">'+cells+'</div>';
  // ближайшие марки
  var near=nearStamps(s);
  if(near.length){
    html+='<div class="stl"><span>Ближе всего к марке</span><a href="today.html#stamps" style="color:inherit">все марки →</a></div>'+near.map(function(x){
      return '<div class="near"><div class="t"><span>'+esc(x.sk.name)+' <small>№ '+x.sk.number+'</small></span><b>'+x.pct+'%</b></div><div class="b"><i style="width:'+x.pct+'%;background:'+skinOf(x.sk)[0]+'"></i></div></div>';
    }).join('');
  }
  html+=reportsHTML();
  html+='<a class="btn" href="index.html">Выбрать задание</a><a class="btn" href="today.html#stamps">Мои марки</a>';
  app.innerHTML=html;
  bindProfile();
  var mx=document.getElementById('mix');
  if(mx)mx.onchange=function(){try{localStorage.setItem('anik_mix',mx.checked?'1':'0');}catch(e){}today();};
}
function nearStamps(s){
  if(!s||!REG)return [];
  var have={};(s.stamps||[]).forEach(function(x){have[x.id]=1;});
  return REG.skills.filter(function(k){return k.stamp&&!have[k.id]&&s.skills&&s.skills[k.id]&&s.skills[k.id].n>0;})
    .map(function(k){var p=s.skills[k.id].p;return {sk:k,p:p,pct:Math.min(100,Math.round(p/0.8*100))};})
    .sort(function(a,b){return b.p-a.p;}).slice(0,3);
}

/* ───────── Марки ───────── */
var curSet=null;
function stamps(setKey){
  var s=snap(),have={};
  ((s&&s.stamps)||[]).forEach(function(x){have[x.id]=x;});
  var all=REG.skills.filter(function(k){return k.stamp;});
  var groups={};all.forEach(function(k){(groups[k.exam+'.'+k.subject]=groups[k.exam+'.'+k.subject]||[]).push(k);});
  var earnedTotal=all.filter(function(k){return have[k.id];}).length;
  if(!setKey)setKey=curSet||((s&&s.exam==='oge')?'oge.rus':'ege.rus');
  curSet=setKey;
  var list=(groups[setKey]||[]).slice().sort(function(a,b){return a.number-b.number||a.name.localeCompare(b.name,'ru');});
  var gotHere=list.filter(function(k){return have[k.id];}).length;
  var todayIso=(s&&s.today)||iso(new Date()),recent=[];
  list.forEach(function(k){var h=have[k.id];if(h&&h.at){var dd=(new Date(todayIso)-new Date(h.at))/86400000;if(dd<=2)recent.push(k);}});
  var html='<div class="top"><span class="wm">аник<i>.</i></span></div><div class="mhead"><h1>Марки</h1><div class="cnt">'+earnedTotal+'<small> / '+all.length+'</small></div></div>'+
    '<p class="lead">Тема получается несколько дней подряд — марка твоя навсегда.</p>';
  if(recent.length)html+=recent.map(function(k){return '<div class="banner"><b>Новая марка</b>«'+esc(k.name)+'» — поздравляю!</div>';}).join('');
  html+='<div class="tabs3">'+SETS.filter(function(x){return groups[x[0]];}).map(function(x){return '<button data-s="'+x[0]+'" class="'+(x[0]===setKey?'on':'')+'">'+x[1]+'</button>';}).join('')+'</div>'+
    '<div class="stl"><span>'+esc((SETS.filter(function(x){return x[0]===setKey;})[0]||['',''])[1])+'</span><span>'+gotHere+' из '+list.length+'</span></div><div class="sgrid">'+
    list.map(function(k){
      var h=have[k.id],c=skinOf(k),sk=s&&s.skills&&s.skills[k.id],p=sk?sk.p:0,pct=Math.min(100,Math.round(p/0.8*100));
      var head=AnikLook.signHTML(signFor(k))+'<div class="tn">№ '+pad(k.number)+' · '+(h?esc(fmtDate(h.at)):pct+'%')+'</div><div class="nm">'+esc(k.name)+'</div>';
      if(h){
        var isNew=h.at&&((new Date(todayIso)-new Date(h.at))/86400000<=2);
        return '<button class="stamp sgt" style="'+AnikLook.style(c)+'" data-id="'+esc(k.id)+'">'+head+(isNew?'<span class="new">NEW</span>':'')+'</button>';
      }
      return '<button class="stamp sgt locked" style="--col:transparent;--ink:#111111" data-id="'+esc(k.id)+'">'+head+'<span class="pb" style="width:'+pct+'%;background:'+c[0]+'"></span></button>';
    }).join('')+'</div>'+
    (s&&s.from!=='bot'?'':(s?'<div class="empty" style="margin-top:14px"><b>Марки пока приходят в чат с ботом.</b> Здесь они появятся, когда заработает связь приложения с сервером.</div>':'<div class="empty" style="margin-top:14px"><b>Пока марок нет.</b> Занимайся через бота — здесь появится прогресс по каждой теме.</div>'));
  app.innerHTML=html;
  Array.prototype.forEach.call(app.querySelectorAll('.tabs3 button'),function(b){b.onclick=function(){stamps(b.dataset.s);window.scrollTo(0,0);};});
  Array.prototype.forEach.call(app.querySelectorAll('.stamp'),function(b){b.onclick=function(){sheet(b.dataset.id,have[b.dataset.id]);};});
}
function fmtDate(iso_){
  if(!iso_)return '';
  var d=new Date(iso_+'T12:00:00');
  return isNaN(d)?iso_:d.getDate()+' '+['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()]+' '+d.getFullYear();
}
function sheet(id,h){
  var k=REG.skills.filter(function(x){return x.id===id;})[0],s=snap(),sk=s&&s.skills&&s.skills[id];
  var box=document.createElement('div');box.className='sheet';
  box.innerHTML='<div><div class="sh sgt" style="'+AnikLook.style(skinOf(k))+'">'+AnikLook.signHTML(signFor(k))+'<button class="x" aria-label="Закрыть">×</button>'+
    '<div class="tn">'+({ege:'ЕГЭ',oge:'ОГЭ'}[k.exam])+' · задание '+k.number+'</div><h3>'+esc(k.name)+'</h3></div><div class="bd"><p>'+
    (h?'Марка получена '+esc(fmtDate(h.at))+'. Она остаётся навсегда — даже если сделать перерыв.':(sk?'Знание сейчас '+Math.round(sk.p*100)+' %, ответов '+sk.n+'.':'Ты ещё не занимался этой темой.'))+'</p>'+
    (h?'':'<div class="rule"><b>как получить марку</b>'+STAMP_RULE+'</div>')+
    '<a class="btn" href="'+esc(linkFor(k))+'">'+(h?'Повторить тему':'Тренироваться')+'</a></div></div>';
  box.onclick=function(e){if(e.target===box||e.target.className==='x')box.remove();};
  document.body.appendChild(box);
}

function route(){
  if(!REG){app.innerHTML='<div class="empty">Загружаю…</div>';return;}
  var h=location.hash;
  if(/^#stamps/.test(h))stamps(null);else today();
}
fetch('skills_registry.json').then(function(r){return r.json();}).then(function(r){REG=r;route();}).catch(function(){app.innerHTML='<div class="empty">Не получилось загрузить. Проверь интернет и обнови страницу.</div>';});
window.addEventListener('hashchange',function(){var o=document.querySelector('.sheet');if(o)o.remove();route();window.scrollTo(0,0);});
if(window.AnikSync)AnikSync.onState(function(){if(REG&&!document.querySelector('.sheet'))route();});
</script>
</body>
</html>
