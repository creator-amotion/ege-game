<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Аник — кабинет репетитора</title>
<link rel="icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Golos+Text:wght@400..700&display=swap">
<link rel="stylesheet" href="anik.css?v=7">
<link rel="stylesheet" href="tutor.css?v=5">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/auto-render.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="anik-move.js?v=1"></script>
<script src="tutor-api.js?v=8"></script>
</head>
<body>
<header class="bar"><span class="wm">Аник<i>.</i> кабинет</span><span class="row" style="gap:12px;justify-content:flex-end"><a class="b sm sec" href="today.html" title="Ученическая часть: «Сегодня», задания. Вернуться — кнопкой «Кабинет репетитора» на «Сегодня»">В приложение</a><span class="who" id="who"></span></span></header>
<main class="wrap" id="app"><div class="empty">Загружаю…</div></main>
<script>
(function () {
  var A = window.AnikTutor, esc = A.esc, api = new A.Api('tutor');
  var app = document.getElementById('app'), who = document.getElementById('who');
  var LEVEL = ['не начато', 'познакомился', 'знает теорию', 'решает с опорой', 'решает сам', 'устойчиво'];
  var LVL = { own: 'тренировочная', fipi: 'ФИПИ', hard: 'трудная' };
  var me = null, cur = null, card = null, meta = null, tab = 'students';
  var basket = [], found = { items: [], total: 0 }, filt = { subject: 'ege.rus', n: '', topic: '', level: '', q: '', offset: 0 };

  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3000); }
  function fail(e) { if (e.status === 401) return start(); toast('Не получилось: ' + e.message); }

  function start() {
    if (!api.token()) {
      who.textContent = '';
      return A.loginForm(api, app, 'Кабинет репетитора',
        'Откройте бота «Аник», отправьте <b>/app</b> и введите код. Кабинет доступен репетиторам, которых подключил администратор; ученики появляются после того, как подтвердят доступ.', start);
    }
    api.get('/api/tutor/me').then(function (m) {
      me = m;
      who.innerHTML = esc(m.name) + (api.ownLogin() ? ' · <a href="#" id="out">выйти</a>' : '');
      var out = document.getElementById('out'); if (out) out.onclick = function (e) { e.preventDefault(); api.logout(); start(); };
      render();
    }).catch(function (e) {
      if (e.status === 403) {                      // не репетитор: кабинета нет, ничего о других людях не показываем
        app.innerHTML = '<div class="login"><h1>Кабинет только для репетиторов</h1><p class="lead">Этот вход — не репетитора. Если вы репетитор, попросите администратора Аника подключить вас, затем войдите кодом из бота (/app).</p>' +
          '<p class="row" style="margin-top:14px"><button class="b sec" id="re">Войти кодом репетитора</button><a class="b sec" href="today.html">В приложение</a></p></div>';
        document.getElementById('re').onclick = function () { api.logout(); A.loginForm(api, app, 'Вход репетитора', 'Отправьте боту <b>/app</b> и введите код.', start); };
        return;
      }
      if (e.status === 401) return start();
      app.innerHTML = '<div class="empty">Сервер не ответил. Обновите страницу чуть позже.</div>';
    });
  }

  function callState() {
    var own = me.students.filter(function (s) { return s.call_url; }).length;
    var base = me.call_url ? (/telemost/.test(me.call_url) ? 'общая ссылка на Телемост' : 'общая ссылка на звонок') : '';
    if (!base && !own) return '<span style="color:var(--red)">ссылка не задана</span>';
    return (base || '<span style="color:var(--muted)">общей ссылки нет</span>') + (own ? ' · личных: ' + own : '');
  }
  function studentCall(sid) {                              // ссылка, которую получит ученик: своя, иначе общая
    var s = me.students.filter(function (x) { return x.id === sid; })[0];
    return (s && s.call_url) || me.call_url || '';
  }

  function render() {
    var h = '<div class="row" style="justify-content:space-between;align-items:flex-end"><h1>Ученики и задания</h1>' +
      '<button class="b blue" id="givetop">Задать ДЗ' + (basket.length ? ' · ' + basket.length : '') + '</button></div><p class="lead">Код приглашения: <b>' + esc(me.code) + '</b> — ученик отправляет боту <b>/start t_' + esc(me.code) + '</b> и подтверждает доступ.</p>';
    h += '<details class="card prof"' + (me.call_url ? '' : ' open') + '><summary><b>Звонки на уроке</b> · <span id="pst">' + callState() + '</span></summary>' +
      '<p class="muted" style="margin-top:6px"><b>Общая ссылка</b> — для всех учеников. Если нужна отдельная встреча для каждого ученика, откройте карточку ученика: там можно задать его личную ссылку. Создайте в Яндекс Телемосте постоянную встречу и вставьте ссылку. На уроке у вас и у ученика будет кнопка «Позвонить в Телемост», ученик получит ссылку вместе с приглашением.</p>' +
      '<form class="row" id="pf" style="margin-top:8px"><label class="sr" for="curl">Общая ссылка на Телемост</label><input class="inp" id="curl" style="flex:1;min-width:220px" placeholder="https://telemost.yandex.ru/j/…" value="' + esc(me.call_url) + '" inputmode="url">' +
      '<button class="b">Сохранить</button></form><p class="msg" id="pmsg" role="status"></p></details>';
    h += '<div class="tabs" role="tablist">' + [['students', 'Ученики'], ['builder', 'Конструктор ДЗ']].map(function (t) {
      return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + t[1] + (t[0] === 'builder' && basket.length ? ' · ' + basket.length : '') + '</button>'; }).join('') + '</div>';
    h += '<div id="pane"></div>';
    app.innerHTML = h;
    app.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { tab = b.dataset.tab; render(); }; });
    document.getElementById('givetop').onclick = function () { tab = 'builder'; render(); toBuilder(); };
    document.getElementById('pf').onsubmit = function (e) {
      e.preventDefault();
      var msg = document.getElementById('pmsg');
      api.post('/api/tutor/profile', { call_url: document.getElementById('curl').value }).then(function (r) {
        me.call_url = r.call_url;
        document.getElementById('pst').innerHTML = callState();
        msg.style.color = r.warning ? 'var(--red)' : 'var(--blue)';
        msg.textContent = r.warning ? 'Сохранено. ' + r.warning : (r.call_url ? 'Сохранено: ссылка на Телемост.' : 'Ссылка удалена.');
      }).catch(function (err) { msg.style.color = 'var(--red)'; msg.textContent = err.status === 400 ? 'Нужна ссылка, начинающаяся с https:// — например https://telemost.yandex.ru/j/…' : 'Не сохранилось.'; });
    };
    if (tab === 'students') renderStudents(); else renderBuilder();
  }

  // ───────── ученики ─────────
  function renderStudents() {
    var pane = document.getElementById('pane');
    if (!me.students.length) { pane.innerHTML = '<div class="empty" style="margin-top:14px">Пока нет учеников с подтверждённым доступом.</div>'; return; }
    var h = asksBlock(me.asks, true) + '<div class="layout"><nav class="slist" aria-label="Ученики">' + me.students.map(function (s, i) {
      return '<button class="sbtn" data-i="' + i + '" aria-current="' + (cur === s.id) + '"><b>' + esc(s.name) + '</b>' +
        '<span class="muted">серия ' + s.streak + ' · дней за 2 нед.: ' + s.days14 + (s.hw_open ? ' · ДЗ: ' + s.hw_open : '') + (s.days_left != null ? ' · до ' + s.exam_word + ' ' + s.days_left + ' дн.' : '') + '</span>' + (s.asks ? '<span class="tag red">просит разобрать: ' + s.asks + '</span>' : '') + '</button>'; }).join('') +
      '</nav><section id="card" aria-live="polite"></section></div>';
    pane.innerHTML = h;
    pane.querySelectorAll('.sbtn').forEach(function (b) { b.onclick = function () { cur = me.students[+b.dataset.i].id; renderStudents(); }; });
    bindAsks(pane);
    if (!cur) cur = me.students[0].id;
    loadCard();
  }

  // ───────── «Просит разобрать» ─────────
  function askCard(a, withName) {
    return '<article class="askc"><div class="row" style="justify-content:space-between"><b>' + (withName ? esc(a.student) + ' · ' : '') + esc(a.head) + '</b><span class="tag">' + esc(a.source_label) + '</span></div>' +
      (a.question ? '<p class="askq">' + esc(a.question) + '</p>' : '') + '<div class="askt">' + esc(a.text) + '</div>' + (a.fig ? '<img src="' + esc(a.fig) + '" alt="Рисунок к задаче" loading="lazy">' : '') +
      '<div class="muted">' + (a.answer ? 'ответ ученика: ' + esc(a.answer) + ' · ' : '') + esc(a.when) + '</div>' +
      '<div class="row" style="margin-top:6px"><button class="b sm" data-done="' + a.id + '">Разобрали</button>' + (withName ? '<button class="b sm sec" data-open="' + a.sid + '">К ученику</button>' : '') + '</div></article>';
  }
  function asksBlock(list, withName) {
    if (!list || !list.length) return '';
    return '<div class="stl"><span>Просит разобрать</span><span>' + list.length + '</span></div><div class="asks">' + list.slice(0, withName ? 6 : 30).map(function (a) { return askCard(a, withName); }).join('') + '</div>' +
      (withName && list.length > 6 ? '<p class="muted">Показаны последние 6. Остальные — в карточках учеников.</p>' : '');
  }
  function bindAsks(root) {
    root.querySelectorAll('.askt').forEach(function (e) { A.math(e); });
    root.querySelectorAll('[data-done]').forEach(function (b) {
      b.onclick = function () {
        b.disabled = true;
        api.post('/api/tutor/ask/done', { id: +b.dataset.done }).then(function () {
          var id = +b.dataset.done, was = me.asks.filter(function (a) { return a.id === id; })[0];
          me.asks = me.asks.filter(function (a) { return a.id !== id; });
          if (was) me.students.forEach(function (s) { if (s.id === was.sid) s.asks = Math.max(0, (s.asks || 0) - 1); });
          toast('Отметка снята'); renderStudents();
        }).catch(function (e) { b.disabled = false; fail(e); });
      };
    });
    root.querySelectorAll('[data-open]').forEach(function (b) { b.onclick = function () { cur = +b.dataset.open; renderStudents(); document.getElementById('card').scrollIntoView({ block: 'start' }); }; });
  }

  function loadCard() {
    var el = document.getElementById('card');
    el.innerHTML = '<div class="empty">Загружаю карточку…</div>';
    api.post('/api/tutor/student', { sid: cur }).then(function (c) { card = c; drawCard(); }).catch(fail);
  }

  function daysGrid(days) {
    var set = {}, out = '', d = new Date();
    days.forEach(function (x) { set[x] = 1; });
    for (var k = 29; k >= 0; k--) {
      var t = new Date(d.getFullYear(), d.getMonth(), d.getDate() - k);
      var iso = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
      out += '<i class="' + (set[iso] ? 'on' : '') + (k === 0 ? ' today' : '') + '" title="' + iso + (set[iso] ? ': занимался' : '') + '"></i>';
    }
    return '<div class="days" aria-label="Активность за 30 дней">' + out + '</div>';
  }

  function drawCard() {
    var c = card, el = document.getElementById('card');
    var acc = c.answers14 + c.math14 ? Math.round(100 * (c.correct14 + c.math_ok14) / (c.answers14 + c.math14)) + '%' : '—';
    var openHw = c.homework.filter(function (h) { return h.done < h.total; }).length;
    var h = '<div class="row" style="justify-content:space-between"><h2>' + esc(c.name) + '</h2><div class="row">' +
      '<button class="b blue" id="lesson">Начать урок на доске</button><button class="b sec" id="give">Задать ДЗ</button></div></div>';
    h += '<p class="muted">' + (c.days_left != null ? esc(c.exam_word) + ' ' + new Date(c.exam_date + 'T12:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }) :
      esc(c.exam_word) + ' · дата экзамена не указана: ученик вводит её в боте') + '</p>';
    h += '<div id="roomlink"></div>';
    var mine = me.students.filter(function (x) { return x.id === c.id; })[0] || {};
    h += '<details class="card prof" style="margin-top:10px"' + (mine.call_url ? '' : '') + '><summary><b>Звонок с этим учеником</b> · <span id="spst">' + (mine.call_url ? 'личная ссылка' : (me.call_url ? 'общая ссылка' : '<span style="color:var(--red)">ссылка не задана</span>')) + '</span></summary>' +
      '<p class="muted" style="margin-top:6px">Своя встреча в Яндекс Телемосте для ' + esc(c.name) + '. Её получит ученик в приглашении на урок и на странице урока. Пусто — будет общая ссылка из блока «Звонки на уроке».</p>' +
      '<form class="row" id="spf" style="margin-top:8px"><label class="sr" for="scurl">Ссылка на Телемост для ' + esc(c.name) + '</label><input class="inp" id="scurl" style="flex:1;min-width:220px" placeholder="https://telemost.yandex.ru/j/… (пусто — общая)" value="' + esc(mine.call_url || '') + '" inputmode="url">' +
      '<button class="b">Сохранить</button></form><p class="msg" id="spmsg" role="status"></p></details>';
    h += asksBlock(c.asks, false);
    h += '<div class="kpis" style="margin-top:10px">' + (c.days_left != null ? '<div class="kpi red"><div class="n">' + c.days_left + '</div><div class="l">' + (c.days_left % 10 === 1 && c.days_left % 100 !== 11 ? 'день' : c.days_left % 10 >= 2 && c.days_left % 10 <= 4 && (c.days_left % 100 < 10 || c.days_left % 100 >= 20) ? 'дня' : 'дней') + ' до ' + esc(c.exam_word) + '</div></div>' : '') + '<div class="kpi yel"><div class="n">' + c.streak + '</div><div class="l">серия, дней</div></div>' +
      '<div class="kpi"><div class="n">' + c.days.filter(function (d) { return d >= new Date(Date.now() - 13 * 864e5).toISOString().slice(0, 10); }).length + '</div><div class="l">дней за 2 недели</div></div>' +
      '<div class="kpi"><div class="n">' + (c.answers14 + c.math14) + '</div><div class="l">ответов за 2 нед.</div></div>' +
      '<div class="kpi blue"><div class="n">' + acc + '</div><div class="l">верно</div></div>' +
      '<div class="kpi pink"><div class="n">' + openHw + '</div><div class="l">ДЗ в работе</div></div></div>';
    h += '<div class="stl"><span>Активность по дням</span><span>30 дней</span></div>' + daysGrid(c.days);

    h += '<div class="stl"><span>Путь к цели</span><span>прогноз</span></div>';
    c.paths.forEach(function (p) {
      h += '<div class="path"><div class="row" style="justify-content:space-between"><h3>' + esc(p.name) + '</h3><span class="tag ' + (p.reached ? 'blue' : 'yel') + '">' +
        (p.target ? 'цель ' + esc(p.target_label) : 'цель не задана') + '</span></div>' +
        '<div class="big">' + esc(p.now_label) + '</div><div class="muted">прогноз сейчас: измерено ' + p.measured + ' из ' + p.measured_max + ' перв. баллов' +
        (p.assume ? ' + допущение ' + p.assume + ' за «' + esc(p.extra) + '»' : '') + (p.delta != null ? ' · за неделю ' + (p.delta >= 0 ? '+' : '') + p.delta : '') + '</div>';
      if (p.target) h += '<div class="meter" style="margin-top:8px" role="img" aria-label="Пройдено ' + p.pct + '% пути"><i style="width:' + p.pct + '%;background:var(--blue)"></i></div>' +
        '<div class="muted">пройдено ' + p.pct + '% пути · нужно ' + p.need + ' перв. баллов в том, что проверяет Аник' + (p.reachable ? '' : ' — цель выше, чем даёт проверяемая часть, остальное — в развёрнутых ответах') + '</div>';
      if (p.gains.length) h += '<div style="margin-top:6px"><b style="font-size:13px">Что даст больше всего:</b><br>' + p.gains.map(function (g) {
        return '<span class="gain">№' + g.n + ' — до +' + g.plus + (g.fresh ? ' · ещё не проверен' : '') + '</span>'; }).join('') + '</div>';
      if (p.todo && p.todo.length) h += '<div class="muted" style="margin-top:4px">Ещё не решал: №' + p.todo.slice(0, 14).join(', №') + (p.todo.length > 14 ? '…' : '') + '</div>';
      h += '</div>';
    });

    h += '<div class="two"><div>';
    var km = c.kmap;
    h += '<div class="stl"><span>Карта знаний</span><span>уровни 0–5</span></div>';
    if (!km || !Object.keys(km.subjects).length) h += '<div class="empty">Карта пока пустая.</div>';
    else {
      Object.keys(km.subjects).forEach(function (k) {
        var s = km.subjects[k];
        h += '<div class="card" style="margin-top:6px"><b>' + esc(s.name) + ' · ' + s.pct + '%</b><div class="muted">начато частей ' + s.started + ' из ' + s.total + '</div>' +
          '<div class="meter" style="margin-top:6px"><i style="width:' + s.pct + '%;background:var(--blue)"></i></div></div>';
        h += '<div class="km" style="margin-top:4px">' + s.numbers.filter(function (n) { return n.level > 0; }).map(function (n) {
          return '<div class="kn"><span class="nn">№' + n.n + '</span><span class="nm">' + esc(n.name) + '</span><span class="cells">' + n.parts.map(function (p) {
            return '<i class="l' + p.level + (p.weak ? ' w' : '') + '" title="' + esc(p.title) + ': ' + LEVEL[p.level] + (p.weak ? ', западает' : p.review ? ', пора повторить' : '') + '"></i>'; }).join('') + '</span></div>'; }).join('') + '</div>';
      });
      var lab = function (w) { return '№' + w.n + ' ' + esc(w.title); };
      if (km.weak.length) h += '<div class="stl"><span>Западает</span></div>' + km.weak.map(function (w) { return '<div class="flag weak">' + lab(w) + '</div>'; }).join('');
      if (km.review.length) h += '<div class="stl"><span>Пора повторить</span></div>' + km.review.map(function (w) { return '<div class="flag rev">' + lab(w) + '</div>'; }).join('');
      if (km.next.length) h += '<div class="stl"><span>Что дать дальше</span></div>' + km.next.map(function (w) { return '<div class="flag next">' + lab(w) + ' <span class="muted">· сейчас ' + LEVEL[w.level] + '</span></div>'; }).join('');
    }
    h += '</div><div>';
    h += '<div class="stl"><span>Последние ответы</span><span>' + c.errors.length + ' ошибок</span></div>';
    h += c.recent.length ? c.recent.slice(0, 15).map(function (r) {
      return '<div class="res"><span class="muted">' + esc(r.when) + '</span><span>' + (r.subject.indexOf('rus') > 0 ? 'Рус.' : 'Мат.') + (r.n ? ' №' + r.n : '') + '</span><span>' + esc(r.what) + '</span>' +
        '<span class="ok ' + (r.ok ? 'y' : 'n') + '" aria-label="' + (r.ok ? 'верно' : 'ошибка') + '">' + (r.ok ? 'верно' : 'ошибка') + '</span></div>'; }).join('') : '<div class="empty">Ответов пока нет.</div>';
    if (c.weak_ru.length || c.weak_math.length) h += '<div class="muted" style="margin-top:6px">Слабые места по модели знаний: ' + esc(c.weak_ru.map(function (n) { return 'рус. №' + n; }).concat(c.weak_math).join(', ')) + '</div>';
    h += '<div class="stl"><span>Домашние задания</span><span>' + c.homework.length + '</span></div>';
    h += c.homework.length ? c.homework.map(hwBlock).join('') : '<div class="empty">ДЗ ещё не было. Соберите вариант во вкладке «Конструктор ДЗ».</div>';
    h += '<div class="stl"><span>Конспекты уроков</span></div><div id="notes" class="muted">…</div>';
    h += '</div></div>';
    h += '<div class="stl"><span>Ученик</span></div><div id="unl"><button class="b sec danger" id="unlink">Отказаться от ученика</button></div>';
    el.innerHTML = h;
    bindAsks(el);
    document.getElementById('give').onclick = function () { tab = 'builder'; render(); toBuilder(); };
    document.getElementById('spf').onsubmit = function (e) {
      e.preventDefault();
      var msg = document.getElementById('spmsg');
      api.post('/api/tutor/profile', { sid: c.id, call_url: document.getElementById('scurl').value }).then(function (r) {
        me.students.forEach(function (s) { if (s.id === c.id) s.call_url = r.call_url; });
        document.getElementById('spst').innerHTML = r.call_url ? 'личная ссылка' : (me.call_url ? 'общая ссылка' : '<span style="color:var(--red)">ссылка не задана</span>');
        var pst = document.getElementById('pst'); if (pst) pst.innerHTML = callState();
        msg.style.color = r.warning ? 'var(--red)' : 'var(--blue)';

  // ───────── конструктор ДЗ ─────────
  function renderBuilder() {

    var subj = meta.subjects[filt.subject], num = subj.numbers.filter(function (n) { return String(n.n) === String(filt.n); })[0];

      '<textarea class="inp" id="c-text" placeholder="Условие задания. Формулы можно писать между знаками $: $x^2-5x+6=0$" maxlength="2000" style="width:100%;margin-top:6px;min-height:90px">' + esc(customDraft.text) + '</textarea>' +

      '<div class="row" style="margin-top:6px"><label class="b sec sm" for="c-file">Прикрепить картинку</label><input type="file" id="c-file" accept="image/*" hidden><span id="c-fn" class="muted">' + (customDraft.fig ? 'картинка прикреплена' : '') + '</span>' +
      (customDraft.fig ? '<button class="b sec sm" id="c-nofig" type="button">Убрать</button>' : '') + '</div>' +
      '<div class="row" style="margin-top:8px"><button class="b blue sm" id="c-add" type="button">+ В вариант</button><button class="b sec sm" id="c-lib" type="button">Мои прошлые задания</button></div>' +
      '<p class="msg" id="c-msg" role="status"></p><div id="c-list"></div></div></details>';
    h += '<div class="filters" role="search">' +
      sel('subject', 'Экзамен и предмет', Object.keys(meta.subjects).map(function (k) { return [k, meta.subjects[k].name]; })) +
      sel('n', 'Номер', [['', 'все номера']].concat(subj.numbers.map(function (n) { return [n.n, '№' + n.n + ' (' + n.count + ')']; }))) +
      sel('topic', 'Тема', [['', 'все темы']].concat(num ? num.topics.map(function (t) { return [t.t, t.t + ' (' + t.count + ')']; }) : [])) +
      sel('level', 'Уровень', [['', 'любой уровень']].concat(Object.keys(meta.levels).map(function (k) { return [k, meta.levels[k]]; }))) +
      '<input class="inp" id="q" placeholder="Поиск по тексту" aria-label="Поиск по тексту" value="' + esc(filt.q) + '" style="flex:1;min-width:140px"></div>';
    h += '<p class="muted" style="margin-top:8px" id="cnt"></p><div id="found"></div><div id="more"></div></div>';

      '<div class="stl"><span>Кому</span></div>' + me.students.map(function (s) {

      '<div class="row" style="margin-top:8px"><label class="muted" for="days">Срок, дней</label><select class="inp" id="days">' + [1, 2, 3, 5, 7, 14].map(function (d) { return '<option' + (d === 7 ? ' selected' : '') + '>' + d + '</option>'; }).join('') + '</select></div>' +

      };

  // ───────── свои задания в ДЗ ─────────
  var customDraft = { topic: '', text: '', answer: '', fig: '' }, customSeq = 0;
  function figUrl(f) { return f ? (f.indexOf('/api/') === 0 ? A.API : '') + f : ''; }
  function shrinkImage(file) {                              // картинка: длинная сторона ≤ 1600 px, WebP/JPEG до 1,5 МБ
    return createImageBitmap(file).then(function (bmp) {
      var k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
      var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
      var enc = function (q) { return new Promise(function (ok) { c.toBlob(function (b) { if (b && b.type === 'image/webp') ok(b); else c.toBlob(ok, 'image/jpeg', q); }, 'image/webp', q); }); };
      return enc(0.82).then(function (b) { return b.size <= 1500000 ? b : enc(0.6); }).then(function (b) { return b.size <= 1500000 ? b : enc(0.4); });
    });
  }
  function uploadHwImage(file) {
    return shrinkImage(file).then(function (blob) {
      var h = api.auth() || {}; h['Content-Type'] = blob.type || 'image/jpeg';
      return fetch(A.API + '/api/tutor/hw/file', { method: 'POST', headers: h, body: blob }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) throw new Error({ too_large: 'картинка больше 1,5 МБ даже после сжатия', quota: 'место под картинки закончилось', bad_type: 'нужна картинка PNG, JPEG или WebP', disk_full: 'на сервере кончилось место' }[j.error] || 'не загрузилась');
          return j;
        });
      });
    });
  }
  function bindCustom() {
    var msg = document.getElementById('c-msg');
    var say = function (t, bad) { msg.style.color = bad ? 'var(--red)' : 'var(--blue)'; msg.textContent = t; };
    var keep = function () { customDraft.topic = document.getElementById('c-topic').value; customDraft.text = document.getElementById('c-text').value; customDraft.answer = document.getElementById('c-ans').value; };
    ['c-topic', 'c-text', 'c-ans'].forEach(function (id) { document.getElementById(id).oninput = keep; });
    document.getElementById('c-file').onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      keep(); say('Загружаю картинку…');
      uploadHwImage(f).then(function (j) { customDraft.fig = j.id; renderBuilder(); document.getElementById('cc').open = true; })
        .catch(function (err) { say('Картинка не прикрепилась: ' + err.message, true); });
    };
    var nf = document.getElementById('c-nofig'); if (nf) nf.onclick = function () { keep(); customDraft.fig = ''; renderBuilder(); document.getElementById('cc').open = true; };
    document.getElementById('c-add').onclick = function () {
      keep();
      var text = customDraft.text.trim();
      if (!text) return say('Напишите условие задания.', true);
      if (basket.length >= 60) return say('В варианте уже 60 заданий.', true);
      basket.push({ subject: 'custom', id: 'n' + (++customSeq), n: '', topic: customDraft.topic.trim(), text: text, fig: figUrl(customDraft.fig ? '/api/file/' + customDraft.fig : ''),
        custom: { text: text, answer: customDraft.answer.trim(), topic: customDraft.topic.trim(), fig: customDraft.fig } });
      customDraft = { topic: '', text: '', answer: '', fig: '' };
      renderBuilder(); document.getElementById('cc').open = true;
      document.getElementById('c-msg').style.color = 'var(--blue)'; document.getElementById('c-msg').textContent = 'Задание добавлено в вариант.';
    };
    document.getElementById('c-lib').onclick = function () {
      var box = document.getElementById('c-list');
      if (box.dataset.open) { box.dataset.open = ''; box.innerHTML = ''; return; }
      api.get('/api/tutor/custom/list').then(function (r) {
        box.dataset.open = '1';
        box.innerHTML = r.items.length ? r.items.map(function (c, i) {
          var inb = basket.some(function (b) { return b.custom_id === c.id; });
          return '<article class="task"><div class="row" style="justify-content:space-between"><span><b>' + esc(c.topic || 'Своё задание') + '</b></span>' +
            '<button class="b sm ' + (inb ? 'sec' : '') + '" type="button" data-lib="' + i + '">' + (inb ? 'Убрать' : '+ В вариант') + '</button></div>' +
            '<div class="tx">' + esc(c.text.slice(0, 220)) + (c.text.length > 220 ? '…' : '') + '</div>' + (c.fig ? '<img src="' + esc(figUrl('/api/file/' + c.fig)) + '" alt="Картинка к заданию" loading="lazy" style="max-width:100%">' : '') +
            '<div class="ans">Ответ: <b>' + esc(c.answer || 'проверяете вы') + '</b></div></article>'; }).join('') : '<p class="muted">Своих заданий пока нет.</p>';
        A.math(box);
        box.querySelectorAll('[data-lib]').forEach(function (b) {
          b.onclick = function () {
            var c = r.items[+b.dataset.lib];
            if (basket.some(function (x) { return x.custom_id === c.id; })) basket = basket.filter(function (x) { return x.custom_id !== c.id; });
            else if (basket.length < 60) basket.push({ subject: 'custom', id: 'c' + c.id, n: '', topic: c.topic, text: c.text, custom_id: c.id });
            drawBasket(); document.getElementById('c-lib').onclick(); document.getElementById('c-lib').onclick();
          };
        });
      }).catch(fail);
    };
  }

  function sel(k, label, opts) {
    return '<select class="inp" id="f-' + k + '" aria-label="' + label + '">' + opts.map(function (o) {
      return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(filt[k]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
  }

  function search(more) {
    api.post('/api/tutor/bank', { subject: filt.subject, n: filt.n ? +filt.n : null, topic: filt.topic, level: filt.level, q: filt.q, offset: filt.offset })
      .then(function (r) { found = more ? { items: found.items.concat(r.items), total: r.total } : r; drawFound(); }).catch(fail);
  }

  function inBasket(it) { return basket.some(function (b) { return b.id === it.id && b.subject === it.subject; }); }

  function drawFound() {
    var el = document.getElementById('found'); if (!el) return;
    document.getElementById('cnt').textContent = 'Найдено задач: ' + (found.total || 0);
    el.innerHTML = found.items.map(function (it, i) {
      return '<article class="task' + (inBasket(it) ? ' picked' : '') + '"><div class="row" style="justify-content:space-between"><span><b>№' + it.n + '</b> ' +
        (it.topic ? '<span class="tag">' + esc(it.topic) + '</span> ' : '') + '<span class="tag ' + (it.level === 'hard' ? 'red' : it.level === 'fipi' ? 'yel' : '') + '">' + LVL[it.level] + '</span></span>' +
        '<button class="b sm ' + (inBasket(it) ? 'sec' : '') + '" data-i="' + i + '">' + (inBasket(it) ? 'Убрать' : '+ В вариант') + '</button></div>' +
        '<div class="tx">' + esc(it.text) + '</div>' + (it.fig ? '<img src="' + esc(it.fig) + '" alt="Рисунок к задаче" loading="lazy">' : '') +
        '<div class="ans">Ответ: <b>' + esc(it.answer) + '</b> · ' + esc(it.id) + '</div>' +
        (it.sol && it.sol.length ? '<details class="ans"><summary>Решение по шагам</summary><ol style="margin:4px 0 0 20px">' + it.sol.map(function (st) { return '<li>' + esc(st) + '</li>'; }).join('') + '</ol></details>' : '') + '</article>'; }).join('') || '<div class="empty">Ничего не нашлось — измените фильтры.</div>';
    el.querySelectorAll('[data-i]').forEach(function (b) {
      b.onclick = function () {
        var it = found.items[+b.dataset.i];
        if (inBasket(it)) basket = basket.filter(function (x) { return !(x.id === it.id && x.subject === it.subject); });
        else if (basket.length < 60) basket.push(it);
        drawFound(); drawBasket();
      };
    });
    document.getElementById('more').innerHTML = found.items.length < found.total ? '<button class="b sec" style="margin-top:10px" id="mb">Показать ещё</button>' : '';
    var mb = document.getElementById('mb'); if (mb) mb.onclick = function () { filt.offset = found.items.length; search(true); };
  }

  function drawBasket() {
    document.getElementById('bn').textContent = basket.length;
    var sb = document.getElementById('sbn'); if (sb) sb.textContent = basket.length;
    var gt = document.getElementById('givetop'); if (gt) gt.textContent = 'Задать ДЗ' + (basket.length ? ' · ' + basket.length : '');
    document.getElementById('bl').innerHTML = basket.map(function (b, i) {
      return '<li>' + (b.subject === 'custom' ? 'Своё' + (b.topic ? ' · ' + esc(b.topic) : '') + ': ' : (b.subject.indexOf('oge') === 0 ? 'ОГЭ ' : '') + '№' + b.n + ' ') + esc(b.text.slice(0, 60)) + '… <a href="#" data-x="' + i + '" aria-label="Убрать из варианта">×</a></li>'; }).join('') || '<li class="muted" style="list-style:none;margin-left:-20px">Добавьте задачи из списка слева.</li>';
    document.querySelectorAll('[data-x]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); basket.splice(+a.dataset.x, 1); drawBasket(); drawFound(); }; });
    var tb = document.querySelector('[data-tab=builder]'); if (tb) tb.textContent = 'Конструктор ДЗ' + (basket.length ? ' · ' + basket.length : '');
  }

  function send() {
    var sids = [].map.call(document.querySelectorAll('.basket input[type=checkbox]:checked'), function (c) { return +c.value; });
    if (!basket.length) return toast('Вариант пустой');
    if (!sids.length) return toast('Отметьте ученика');
    var btn = document.getElementById('send'); btn.disabled = true;
    api.post('/api/tutor/hw', { sids: sids, items: basket.map(function (b) { return b.subject === 'custom' ? (b.custom_id ? { custom_id: b.custom_id } : { custom: b.custom }) : { subject: b.subject, id: b.id }; }),
      days: +document.getElementById('days').value, note: document.getElementById('note').value, title: document.getElementById('title').value })
      .then(function (r) {
        toast('Отправлено: ' + r.items + ' зад. × ' + r.homeworks.length + ' учен.');
        basket = []; tab = 'students';
        return api.get('/api/tutor/me').then(function (m) { me = m; render(); });
      }).catch(function (e) { btn.disabled = false; fail(e); });
  }

  start();
})();
</script>
</body>
</html>
