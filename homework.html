<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#F3EEE2">
<title>Аник — задания от репетитора</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="anik-move.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Golos+Text:wght@400..700&display=swap">
<link rel="stylesheet" href="anik.css?v=7">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/auto-render.min.js"></script>
<script src="anik-sync.js?v=8"></script>
<script src="anik-nav.js?v=9" defer></script>
<script src="anik-ask.js?v=1" defer></script>
<script src="anik-call.js?v=2"></script>
<script src="tutor-api.js?v=8"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
main{max-width:520px;margin:0 auto;padding:18px 16px 24px}
.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.back{font-size:14px;font-weight:600;color:var(--ink)}
h1{font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:.98;margin:12px 0 6px}
.lead{font-size:15px;line-height:1.5}
.stl{margin:24px 0 10px;padding-top:8px;border-top:2px solid var(--ink);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px}
.room{background:var(--yellow);padding:12px 14px}
.room b{font-family:var(--display);font-size:20px;font-weight:800;display:block}
.rowb{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.b{min-height:44px;padding:0 16px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none;font-family:inherit}
.b.sec{background:transparent;color:var(--ink)}
.b:disabled{opacity:.4}
.note{background:var(--blue-t);padding:8px 12px;font-size:14px;margin-bottom:6px}
.task{background:#fff;padding:12px 14px;margin-bottom:8px;scroll-margin-top:12px}
.task.cur{outline:3px solid var(--blue)}
.task .h{font-weight:700;font-size:14px}
.task .tx{white-space:pre-wrap;font-size:15px;line-height:1.5;margin:6px 0;overflow-wrap:anywhere}
.task .tx .katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}
.task .fig{display:block;max-width:100%;height:auto;margin:6px 0;background:#fff;border:1px solid var(--line)}
.stl span:first-child{min-width:0;overflow-wrap:anywhere}.stl span:last-child{flex-shrink:0;text-align:right}
.game{display:flex;align-items:center;justify-content:space-between;gap:10px}.game .b{flex-shrink:0}.game .dn{font-weight:600;color:var(--blue)}
.past{margin-top:24px}.past summary{cursor:pointer;font-weight:600;font-size:15px;padding:10px 0;border-top:2px solid var(--ink)}
.past summary span{color:var(--muted);font-weight:500}
.task form{display:flex;gap:8px;margin-top:6px}
.task input{flex:1;min-width:0;min-height:44px;padding:0 12px;border:2px solid var(--ink);font-size:16px;font-family:inherit;background:#fff}
.verdict{font-weight:700;margin-top:6px}
.ok{color:var(--blue)}.bad{color:var(--red)}
.sum{background:var(--blue);color:#fff;padding:12px 14px;font-weight:600}
.mini{background:#fff;padding:10px 12px;margin-bottom:6px;font-size:14px}
.empty{background:#fff;padding:14px;font-size:15px}
.sol{margin:6px 0 0;font-size:14px;line-height:1.5;background:var(--chip);padding:8px 10px 8px 30px}
</style>
</head>
<body>
<main id="app"><div class="empty">Загружаю…</div></main>
<script>
(function () {
  var A = window.AnikTutor, esc = A.esc, api = new A.Api('student'), app = document.getElementById('app');
  var focus = +((/hw=(\d+)/.exec(location.hash) || [])[1] || 0);
  var MON = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  function dayOf(d) { return new Date(String(d) + 'T12:00:00'); }
  function human(d) { var x = dayOf(d); if (isNaN(x)) return String(d || ''); return x.getDate() + ' ' + MON[x.getMonth()] + (x.getFullYear() !== new Date().getFullYear() ? ' ' + x.getFullYear() : ''); }
  function left(d) { var t = new Date(); t.setHours(12, 0, 0, 0); return Math.round((dayOf(d) - t) / 864e5); }
  function dueText(d) { if (!d) return ''; var n = left(d); return n < 0 ? 'срок был ' + human(d) : n === 0 ? 'срок сегодня' : 'до ' + human(d); }
  function isPast(hw) { return hw.due && left(hw.due) < -7; }                 // просрочено больше недели — в «Прошлые»
  function hasWork(hw) { return hw.items.length || (hw.games || []).some(function (g) { return g.status === 'todo'; }); }
  function count(hw) {
    var g = (hw.games || []).length;
    if (hw.total) return hw.done + ' из ' + hw.total;
    return g === 1 ? 'игра' : g + ' ' + (g % 10 >= 2 && g % 10 <= 4 && (g % 100 < 10 || g % 100 >= 20) ? 'игры' : 'игр');
  }
  function head() { return '<div class="top"><span class="wm">аник<i>.</i></span><a class="back" href="today.html">← Сегодня</a></div><h1>Задания от репетитора</h1>'; }

  function start() {
    if (!api.token()) {
      app.innerHTML = head() + '<p class="lead">Свяжи приложение с ботом — и задания репетитора появятся здесь.</p><div id="linkbox" style="margin-top:12px"></div>';
      if (window.AnikSync && AnikSync.linkCard) AnikSync.linkCard(document.getElementById('linkbox'), function () { setTimeout(start, 600); });
      return;
    }
    Promise.all([api.get('/api/me'), api.get('/api/room/notes')]).then(function (r) { draw(r[0], r[1].notes); })
      .catch(function (e) { if (e.status === 401) return start(); app.innerHTML = head() + '<div class="empty">Сервер не ответил. Обнови страницу чуть позже.</div>'; });
  }

  function draw(m, notes) {
    var h = head();
    if (!m.has_tutor) {
      app.innerHTML = h + '<div class="empty">У тебя пока нет подключённого репетитора. Если он есть — попроси у него ссылку-приглашение в бот.</div>';
      return;
    }
    h += '<p class="lead">' + esc(m.tutors.join(', ')) + '</p>';
    (m.rooms || []).forEach(function (r) {
      h += '<div class="stl"><span>Урок</span></div><div class="room" role="status"><b>Урок начался</b>' + esc(r.tutor) + ' ждёт тебя у доски.' +
        '<div class="rowb"><a class="b" href="lesson.html?r=' + encodeURIComponent(r.room) + '&as=s">Открыть доску</a>' +
        (r.call_url ? '<button class="b sec" data-call="' + esc(r.call_url) + '">' + (/telemost/.test(r.call_url) ? 'Позвонить в Телемост' : 'Позвонить') + '</button>' : '') + '</div></div>';
    });
    var list = m.homework.filter(hasWork), now = list.filter(function (hw) { return !isPast(hw); }), past = list.filter(isPast);
    if (!now.length) h += '<div class="stl"><span>Задания</span></div><div class="empty">Сейчас заданий нет.</div>';
    var asks = [];
    var hwHtml = function (hw) {
      var o = '<div class="stl" id="hw' + hw.id + '"><span>' + esc(hw.title) + '</span><span>' + count(hw) + (hw.due ? ' · ' + esc(dueText(hw.due)) : '') + '</span></div>';
      if (hw.note) o += '<div class="note">' + esc(hw.note) + '</div>';
      var first = true;
      hw.items.forEach(function (it) {
        var cur = it.status === 'todo' && first; if (cur) first = false;
        o += '<article class="task' + (cur && hw.id === focus ? ' cur' : '') + '" id="t' + it.id + '"><div class="h">' + it.seq + '. ' + esc(it.topic) + '</div><div class="tx">' + esc(it.full || it.text) + '</div>' +
          (it.figs && it.figs.length ? it.figs : it.fig ? [it.fig] : []).map(function (f) { return '<img class="fig" src="' + esc((f.indexOf('/api/') === 0 ? A.API : '') + f) + '" alt="Рисунок к заданию ' + it.seq + '" loading="lazy">'; }).join('') +   // варианты ответа картинками — все
          (it.status === 'todo' ? '<form data-id="' + it.id + '"><input aria-label="Ответ на задание ' + it.seq + '" placeholder="Ответ" maxlength="200" autocomplete="off"><button class="b">Ответить</button></form><div class="verdict" role="status"></div>'
            : '<div class="verdict ' + (it.status === 'done' && it.ok === null ? '' : it.ok ? 'ok' : 'bad') + '">' + (it.status === 'skipped' ? 'Пропущено' : it.ok === null ? 'Ответ отправлен репетитору, он проверит: ' + esc(it.answer) : (it.ok ? 'Верно' : 'Неверно') + ': ' + esc(it.answer)) + '</div>') + '</article>';
        asks.push(it);
      });
      (hw.games || []).forEach(function (g) {
        o += '<div class="mini game"><span>' + esc(g.title) + '</span>' + (g.status !== 'todo' ? '<span class="dn">Пройдена</span>'
          : g.url ? '<a class="b sec" href="' + esc(g.url) + '">Играть</a>' : '<span class="muted">открой в боте: /homework</span>') + '</div>';
      });
      return o;
    };
    now.forEach(function (hw) { h += hwHtml(hw); });
    if (past.length) {
      var open = past.some(function (hw) { return hw.id === focus; });
      h += '<details class="past"' + (open ? ' open' : '') + '><summary>Прошлые задания <span>· ' + past.length + ' · срок прошёл больше недели назад</span></summary>' + past.map(hwHtml).join('') + '</details>';
    }
    h += '<div class="stl"><span>Конспекты уроков</span><span>' + notes.length + '</span></div><a class="b sec" href="notes.html">Мои конспекты →</a>';
    h += '<p class="lead" style="margin-top:18px;font-size:13px;color:var(--muted)">Эти же задания есть в боте: /homework. Ответ, данный здесь, засчитывается и там.</p>';
    app.innerHTML = h;
    A.math(app);
    var mountAsks = function () { if (window.AnikAsk) asks.forEach(function (it) { var el = document.getElementById('t' + it.id); if (el) AnikAsk.mount(el, { hw_item: it.id, ref: it.ref, answer: it.answer || '' }); }); };
    if (window.AnikAsk) mountAsks(); else document.addEventListener('DOMContentLoaded', mountAsks);
    app.querySelectorAll('[data-call]').forEach(function (b) { b.onclick = function () { A.openCall(b.dataset.call); }; });
    app.querySelectorAll('form[data-id]').forEach(bind);
    var f = focus && (document.querySelector('#hw' + focus + ' ~ .task.cur') || document.getElementById('hw' + focus));
    if (f) f.scrollIntoView({ block: 'start' });
  }

  function bind(f) {
    f.onsubmit = function (e) {
      e.preventDefault();
      var v = f.querySelector('input').value.trim(), out = f.nextElementSibling;
      if (!v) return;
      f.querySelector('button').disabled = true;
      api.post('/api/hw/answer', { item: +f.dataset.id, answer: v }).then(function (r) {
        f.remove();
        out.className = 'verdict ' + (r.correct === null ? '' : r.correct ? 'ok' : 'bad');
        out.textContent = r.correct === null ? 'Ответ отправлен репетитору, он проверит.' : r.correct ? 'Верно' : 'Неверно. Правильный ответ: ' + r.right;
        if (!r.correct && r.sol && r.sol.length) {                  // решение по шагам (база, ОГЭ)
          var so = document.createElement('ol'); so.className = 'sol'; so.setAttribute('aria-label', 'Решение');
          r.sol.forEach(function (st) { var li = document.createElement('li'); li.textContent = st; so.appendChild(li); });
          out.after(so); A.math(so);
        }
        if (r.done >= r.total) {
          var s = document.createElement('div'); s.className = 'sum'; s.setAttribute('role', 'status');
          s.textContent = 'Задание выполнено: ' + r.done + ' из ' + r.total + '. Репетитор увидит результат.';
          out.parentNode.after(s);
        } else {
          var next = out.parentNode.nextElementSibling;
          if (next && next.classList.contains('task')) { var i = next.querySelector('input'); if (i) { next.scrollIntoView({ block: 'center', behavior: 'smooth' }); i.focus({ preventScroll: true }); } }
        }
      }).catch(function (e) { f.querySelector('button').disabled = false; out.textContent = e.message === 'done' ? 'Уже отвечено.' : 'Не отправилось, попробуй ещё раз.'; });
    };
  }
  start();
})();
</script>
</body>
</html>
