<style>

.rvc.ask{border-color:var(--red)}.rvc.wrong{border-color:var(--red)}.rvc.todo{border-color:var(--yellow)}.rvc.on{background:var(--yellow-t)}

.busy{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;font-weight:600;font-size:14px;z-index:6}
.tbox{position:absolute;z-index:5;min-width:220px;min-height:44px;border:2px dashed var(--ink);background:rgba(255,255,255,.9);font-family:'Golos Text',sans-serif;font-weight:600;padding:4px 6px;resize:both}

@media (max-width:600px){.lbar .who{display:none}.tool small{display:none}.tool{min-width:42px}}
.toast{bottom:calc(20px + var(--safe-b))}
/* телефон (iPhone 375–430): шапка в две строки, второстепенное — в «Меню», инструменты в одну строку без прокрутки */
.pop,.lmenu{position:absolute;z-index:15;background:var(--paper);border:2px solid var(--ink);border-top:0}
.pop{left:0;right:0;top:0;border-left:0;border-right:0;padding:8px calc(8px + var(--safe-r)) 10px calc(8px + var(--safe-l));display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 6px 0 rgba(17,17,17,.12)}
.pop .lab{flex-basis:100%;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase}

.pop[hidden],.lmenu[hidden]{display:none}
.lmenu .mh{grid-column:1/-1;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.lmenu .mi{min-height:44px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-family:inherit;font-weight:600;font-size:14px;line-height:1.15;padding:4px 10px;text-align:left;cursor:pointer;text-decoration:none;display:flex;align-items:center}
.lmenu .mi.yel{background:var(--yellow)}.lmenu .mi.red{background:var(--red);color:#111}.lmenu .full{grid-column:1/-1}
.lmenu .zr{grid-column:1/-1;display:flex;gap:6px;align-items:center}.lmenu .zr .mi{flex:1;justify-content:center;font-size:20px}
#callbox{display:inline-flex;gap:6px;align-items:center;flex-wrap:nowrap}
@media (min-width:601px) and (max-width:1000px){
  .lbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px}
  .lbar .grow,.lbar .who{display:none}
  #permbox{grid-column:1/-1;grid-row:2}
  #permbox:empty{display:none}
}
/* телефон боком: всё в одну строку, чтобы доске осталась высота */
@media (max-height:500px) and (max-width:1000px){
  body .lbar{grid-template-columns:auto minmax(0,1fr) auto auto;padding-top:calc(4px + var(--safe-t));padding-bottom:4px}
  body .lbar .wm{grid-area:1/1}body .lbar .peer{grid-area:1/2}body #permbox{grid-area:1/3}body #callbox{grid-area:1/4}
  body .perm{min-width:250px}
  body .tools{padding-top:4px;padding-bottom:4px}

}
.tool .dot{display:block;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--ink)}

  .lbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 8px;min-height:0}
  .lbar .grow{display:none}
  .lbar .wm{font-size:18px;margin:0}
  .peer{font-size:12.5px}
  #callbox{display:flex;gap:6px;justify-self:end}
  .callb{min-height:40px;padding:0 10px;font-size:13.5px}
  #permbox{grid-column:1/-1;grid-row:2;display:flex;gap:6px;min-width:0}
  #permbox:empty{display:none}
  .perm{flex:1 1 auto;min-width:0}
  .perm b{padding:0 6px;font-size:12px}
  .perm button{flex:1 1 0;min-width:0;height:40px;padding:0 4px;font-size:13px}
  .permtb{flex:0 0 auto}
  .tools{flex-wrap:nowrap;gap:4px;overflow:visible}
  .tools .tool{flex:1 1 0;min-width:0;max-width:56px;height:44px;padding:0 2px}
  .permbar{font-size:13px;padding:5px 12px;line-height:1.3}
}

<body class="lesson">
<header class="lbar">
  <span class="wm">Аник<i>.</i></span>
  <span class="peer" id="peer"><i></i><span>…</span></span>
  <span class="grow"></span>
  <span id="permbox"></span>
  <span id="callbox"></span>
  <span class="who muted" id="who"></span>
</header>
<div id="app" style="flex:1;display:flex;flex-direction:column;min-height:0;position:relative"><main class="wrap"><div class="empty">Загружаю урок…</div></main></div>
<script>
(function () {
  var A = window.AnikTutor, esc = A.esc;
  var qs = new URLSearchParams(location.search), ROOM = qs.get('r') || '', NOTE = qs.get('note');
  var tutorApi = new A.Api('tutor'), studentApi = new A.Api('student');
  var api = qs.get('as') === 's' ? studentApi : tutorApi;
  var app = document.getElementById('app'), who = document.getElementById('who'), peerEl = document.getElementById('peer');
  var W = 1600, PAGE_H = 2400, COLORS = [['#111111', 'чёрный'], ['#E5332A', 'красный'], ['#2E55C9', 'синий'], ['#1F8A4C', 'зелёный'], ['#F6CE2E', 'жёлтый']];
  var WIDTHS = [5, 10, 18];
  var role = '', names = {}, ice = [], callUrl = '', ops = [], seq = 0, readOnly = false, perm = 'view', ended = false, noteTitle = '';
  var tool = 'pen', color = '#111111', width = 10, myStack = [], sentIds = {};
  var stage, canvas, ctx, layer, ringEl, view = { x: -20, y: -20, z: 0.5 }, dpr = 1, outbox = [], sending = false, dirty = false;
  var PERM_TEXT = { view: 'Сейчас ты смотришь. Репетитор разрешит рисовать, когда понадобится.', pen: 'Репетитор разрешил рисовать ручкой и маркером.', all: 'Репетитор разрешил рисовать: ручка, фигуры, текст.' };
  var ICON = {
    hand: '<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12m0-1.5v-6a1.5 1.5 0 0 1 3 0V12m0-5.5a1.5 1.5 0 0 1 3 0V13m0-3.5a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-2a6 6 0 0 1-5-2.7L4 16a1.6 1.6 0 0 1 2.6-1.8L8 16"/>',
    pen: '<path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/>',
    hl: '<path d="M9 15l-5 5h6l2-2"/><path d="M8 13l6-9 6 6-9 6z"/>',
    line: '<path d="M4 20L20 4"/><circle cx="4" cy="20" r="1.5"/><circle cx="20" cy="4" r="1.5"/>',
    arrow: '<path d="M4 20L19 5"/><path d="M10 5h9v9"/>',
    rect: '<rect x="4" y="6" width="16" height="12"/>',
    circle: '<circle cx="12" cy="12" r="8"/>',
    text: '<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',
    er: '<path d="M7 20h10"/><path d="M5 15l8-9 6 6-6 7H9z"/>',
    undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  };
  function svg(k) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[k] + '</svg>'; }
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3600); }
  function rid() { var a = new Uint8Array(6); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (b) { return (b % 36).toString(36); }).join('') + Date.now().toString(36).slice(-4); }
  function loadScript(src) { return new Promise(function (ok, bad) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { bad(new Error('Не загрузилась библиотека')); }; document.head.appendChild(s); }); }
  var reviewN = 0, reviewData = null, lastCard = '', atBoard = false, permBefore = 'view', calledAt = 0;
  var localUrls = {};                                  // картинки материалов из копии на устройстве
  function fileUrl(f) { return localUrls[f] || A.API + '/api/file/' + f; }
  var IMG_MAX = 1600, IMG_Q = 0.8, FILE_LIMIT = 1500000;  // материалы ужимаются на устройстве репетитора
  var PHONE = window.matchMedia ? window.matchMedia('(max-width:600px), (max-height:500px) and (max-width:1000px)') : null, SHAPES = ['line', 'arrow', 'rect', 'circle'];
  function compact() { return !!(PHONE && PHONE.matches); }
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.initData) {                              // внутри Telegram: во весь экран, свайп вниз не сворачивает доску
    try { tg.ready(); tg.expand(); if (tg.disableVerticalSwipes && tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
  }

  // ───────── вход ─────────
  function start() {
    if (NOTE) return openNote();
    if (!/^[A-Za-z0-9_-]{10,40}$/.test(ROOM)) { app.innerHTML = '<main class="wrap"><div class="login"><h1>Нет такой комнаты</h1><p class="lead">' + (api === studentApi ? 'Попроси у репетитора ссылку на урок.' : 'Создайте урок заново в кабинете.') + '</p></div></main>'; return; }
    if (!api.token()) {
      app.innerHTML = '<main class="wrap"></main>';
      return A.loginForm(api, app.firstChild, 'Вход на урок', api === studentApi ? 'Отправь боту «Аник» команду <b>/app</b> и введи код — так урок узнает, что это ты.' : 'Отправьте боту «Аник» команду <b>/app</b> и введите код — так урок узнает, что это вы.', function () { location.reload(); });
    }
    api.post('/api/room/join', { room: ROOM }).then(function (j) {
      role = j.role; names = j.names; ice = j.ice || []; callUrl = j.call_url || ''; perm = j.perm || 'view';
      who.textContent = role === 'tutor' ? names.tutor + ' · репетитор' : names.student;
      if (role === 'student') tool = perm === 'view' ? 'hand' : 'pen';
      build();
      ops = []; apply(j.ops, true); seq = j.seq; setPeer(j.peer_online);
      var go = ops.filter(function (o) { return o.t === 'go' && o.x != null; }).pop();
      if (role === 'student' && go) jump(go); else showAll(true);
      if (role === 'tutor') loadReview();
      poll();
    }).catch(function (e) {
      if (e.status === 401) return start();
      if (e.status === 410) return showEnded(e.body && e.body.note);
      app.innerHTML = '<main class="wrap"><div class="login"><h1>Урок недоступен</h1><p class="lead">Урок уже закончился или эта комната — другого репетитора или ученика.</p><p class="row" style="margin-top:12px">' +
        (role === 'tutor' || api === tutorApi ? '<a class="b sec" href="tutor.html">В кабинет</a>' : '<a class="b sec" href="notes.html">Мои конспекты</a><a class="b sec" href="today.html">На «Сегодня»</a>') + '</p></div></main>';
    });
  }

  function openNote() {
    var fromCabinet = /\/tutor\.html/.test(document.referrer) && tutorApi.ownLogin();   // открыл репетитор из кабинета
    var first = !fromCabinet && studentApi.token() ? studentApi : tutorApi, id = +NOTE;   // иначе вход приложения: ученику копия — на устройство
    var show = function (n, banner) {
      readOnly = true; role = 'view'; tool = 'hand'; noteTitle = n.title;
      who.textContent = 'Конспект: ' + n.title;
      peerEl.style.display = 'none';
      var mine = n.viewer !== 'tutor', home = mine ? 'notes.html' : 'tutor.html';   // выход из конспекта: туда, откуда пришли

    if (y + 200 > view.y + r.height / view.z) { view.y = y - 40 / view.z; schedule(); }
    var fig = /^(figs|trainer\/figs)\/[A-Za-z0-9_.-]+$/.test(it.fig) ? it.fig : '';
    var id = rid(), op = { t: 'tk', id: id, x: x, y: y, w: w, head: String(t.head).slice(0, 120), text: it.text.slice(0, 3900), fig: fig };
    if (t.ask) op.ask = t.ask;
    myStack.push(id); lastCard = id;
    send(op);
    if (r.width < 820) { document.getElementById('drawer').hidden = true; resize(); }
    return id;
  }

  // ───────── «К разбору»: что отметил ученик и его домашка ─────────
  var STATE = { wrong: 'ошибка', todo: 'не решено', skipped: 'пропущено' };
  function loadReview() {
    return api.post('/api/room/review', { room: ROOM }).then(function (r) {
      reviewData = r; reviewN = r.asks.length + r.homework.length;
      revUpd();
      return r;
    });
  }
  function reviewItem(key) { var p = key.split(':'), list = reviewData ? (p[0] === 'a' ? reviewData.asks : reviewData.homework) : []; return list[+p[1]] || null; }
  function placeReview(it, at) {
    var id = placeTask({ head: it.head, text: it.text, fig: it.fig, ask: it.id && !it.item ? it.id : 0 }, at);
    it.placed = id; toast('Задача на доске'); var d = document.getElementById('drawer');
    if (d && !d.hidden && d.dataset.what === 'review') drawReview(d);
    return id;
  }
  function reviewUi(d) {
    d.innerHTML = '<h3>К разбору <button class="x" id="dx" aria-label="Закрыть">×</button></h3><p class="muted" style="margin-top:6px">Загружаю…</p>';
    on('dx', function () { d.hidden = true; resize(); });
    loadReview().then(function () { drawReview(d); }).catch(function () { d.querySelector('p').textContent = 'Не получилось загрузить.'; });
  }
  function rvCard(it, key, cls, sub) {
    return '<article class="rvc ' + cls + (it.placed ? ' on' : '') + '" draggable="true" data-rv="' + key + '"><div class="hd">' + esc(it.head) + '</div><div class="muted">' + esc(sub) + '</div>' +
      (it.question ? '<div class="rvq">' + esc(it.question) + '</div>' : '') + '<div class="tx">' + esc(it.text) + '</div>' + (it.fig ? '<img src="' + esc(it.fig) + '" alt="" loading="lazy">' : '') +
      '<div class="row"><button class="b sm" data-put="' + key + '">' + (it.placed ? 'Ещё раз' : 'На доску') + '</button><button class="b sm blue" data-call="' + key + '">К доске</button>' +
      (it.id && !it.item ? '<button class="b sm sec" data-ok="' + it.id + '">Разобрали</button>' : '') + '</div></article>';
  }
  function drawReview(d) {
    var r = reviewData, h = '<h3>К разбору <button class="x" id="dx" aria-label="Закрыть">×</button></h3><p class="muted" style="margin-top:6px">Нажмите «На доску» или перетащите задачу на нужное место. «К доске» — поставить задачу и вывести ученика.</p>';
    h += '<div class="rvh">Просит разобрать · ' + r.asks.length + '</div>' + (r.asks.map(function (a, i) {
      return rvCard(a, 'a:' + i, 'ask', a.source_label + ' · ' + a.when + (a.answer ? ' · ответ: ' + a.answer : '')); }).join('') || '<p class="muted" style="margin-top:6px">Отметок нет.</p>');
    h += '<div class="rvh">Из домашки · ' + r.homework.length + '</div>' + (r.homework.map(function (x, i) {
      return rvCard(x, 'h:' + i, x.state, STATE[x.state] + (x.answer ? ' · ответ: ' + x.answer : '') + (x.correct ? ' · верно: ' + x.correct : '')); }).join('') || '<p class="muted" style="margin-top:6px">Всё решено верно.</p>');
    d.innerHTML = h; A.math(d);
    on('dx', function () { d.hidden = true; resize(); });
    d.querySelectorAll('[data-rv]').forEach(function (c) { c.ondragstart = function (e) { e.dataTransfer.setData('application/x-anik-review', c.dataset.rv); e.dataTransfer.effectAllowed = 'copy'; }; });
    d.querySelectorAll('[data-put]').forEach(function (b) { b.onclick = function () { placeReview(reviewItem(b.dataset.put)); }; });
    d.querySelectorAll('[data-call]').forEach(function (b) { b.onclick = function () { var it = reviewItem(b.dataset.call); callStudent(it.placed && cardById(it.placed) ? it.placed : placeReview(it)); }; });
    d.querySelectorAll('[data-ok]').forEach(function (b) {
      b.onclick = function () {
        b.disabled = true;
        api.post('/api/tutor/ask/done', { id: +b.dataset.ok }).then(function () {
          r.asks = r.asks.filter(function (a) { return a.id !== +b.dataset.ok; }); reviewN = r.asks.length + r.homework.length;
          revUpd(); drawReview(d);
        }).catch(function (e) { b.disabled = false; toast('Не получилось: ' + e.message); });
      };
    });
  }

  // ───────── «Вывести к доске»: право рисовать + экран ученика у задачи ─────────
  function cardById(id) { return model().cards.filter(function (c) { return c.id === id; })[0]; }
  function setStudentPerm(p) { return api.post('/api/room/perm', { room: ROOM, perm: p }).then(function (r) { perm = r.perm; permUi(); }); }
  function boardBtn() {
    var b = document.getElementById('toboard'); if (!b) return;
    b.textContent = compact() ? (atBoard ? 'Вернуть' : 'К доске') : atBoard ? 'Вернуть ученика на место' : 'Вывести к доске';
    b.title = atBoard ? 'Ученик снова только смотрит' : 'Ученик получит право рисовать, и его экран перейдёт к задаче';
  }
  function callStudent(cardId) {
    var c = cardId && cardById(cardId);
    if (!atBoard) permBefore = perm;
    return setStudentPerm('all').then(function () {
      atBoard = true; boardBtn();
      if (c) send({ t: 'go', id: rid(), x: Math.round(c.x - 30), y: Math.round(c.y - 30), z: 1, fw: Math.round(c.w + 60), card: c.id });
      else send({ t: 'go', id: rid(), x: Math.round(view.x), y: Math.round(view.y), z: Math.round(view.z * 1000) / 1000 });
      toast('Ученик у доски: может рисовать' + (c ? ' у этой задачи' : ''));
    }).catch(function (e) { toast('Не получилось: ' + e.message); });
  }
  function toBoard() {
    if (atBoard) return setStudentPerm(permBefore === 'all' ? 'view' : permBefore).then(function () { atBoard = false; boardBtn(); toast('Ученик снова смотрит'); }).catch(function (e) { toast('Не получилось: ' + e.message); });
    var last = cardById(lastCard) ? lastCard : (model().cards.slice(-1)[0] || {}).id;
    callStudent(last);
  }

  // звонок: основной — Телемост (ссылка репетитора); запасной — WebRTC напрямую, экспериментально
  function callUi() {
    var box = document.getElementById('callbox');
    if (readOnly) return;                                   // в конспекте там кнопка «Назад»
    var tm = /telemost/.test(callUrl);
    if (compact()) {                                        // телефон: звонок + «Меню»; остальное — в меню
      box.innerHTML = callUrl ? '<button class="callb" id="tmb">' + (tm ? 'Телемост' : 'Звонок') + '</button>' : '';
      on('tmb', function () { A.openCall(callUrl); });
      return menuBtn();
    }
    box.innerHTML = (callUrl ? '<button class="callb" id="tmb">' + (tm ? 'Позвонить в Телемост' : 'Позвонить') + '</button>'
      : (role === 'tutor' ? '<a class="callb off" href="tutor.html" target="_blank" rel="noopener" title="Ссылка на Телемост задаётся в кабинете">Ссылка на Телемост</a>' : '')) +
      ' <button class="callb off" id="callmore" aria-label="Другие способы звонка">⋯</button>' +
      (role === 'tutor' ? ' <button class="callb red" id="endb">Завершить урок</button>' : '');
    on('tmb', function () { A.openCall(callUrl); });
    on('callmore', function () { drawer('call'); });
    on('endb', endLesson);
  }
  function callPanel(d) {
    d.innerHTML = '<h3>Звонок <button class="x" id="dx" aria-label="Закрыть">×</button></h3>' +
      (callUrl ? '<p style="margin-top:8px">Основной звонок — ' + (/telemost/.test(callUrl) ? 'Яндекс Телемост' : 'по ссылке репетитора') + ': откроется в новом окне, доска остаётся здесь.</p><button class="callb" id="tm2" style="margin-top:8px">Открыть звонок</button>'
        : '<p class="muted" style="margin-top:8px">Репетитор ещё не указал ссылку на Телемост.</p>') +
      '<details class="exp" id="exp"' + (pc ? ' open' : '') + '><summary>Звонок без Телемоста (экспериментально)</summary><p class="muted" style="margin-top:6px">Прямо в браузере, без сторонних сервисов. В некоторых сетях (мобильный интернет, школьный Wi-Fi) может не соединиться.</p>' +
      '<div class="vids"><video id="rv" autoplay playsinline aria-label="Собеседник"></video><video id="lv" class="me" autoplay playsinline muted aria-label="Вы"></video><span class="st" id="cst">' + (pc ? 'на связи' : 'звонок не начат') + '</span></div>' +
      '<div class="row" style="margin-top:8px"><button class="b blue sm" id="cvid">Видео</button><button class="b sm sec" id="caud">Голос</button><button class="b sm red" id="chang" disabled>Завершить</button></div>' +
      '<div class="row" style="margin-top:6px"><button class="b sm sec" id="mm" disabled>Микрофон</button><button class="b sm sec" id="mc" disabled>Камера</button>' +
      '<label class="chk" style="font-size:12px"><input type="checkbox" id="fake"> тестовый сигнал</label></div><div id="ringbox"></div></details>';
    on('dx', function () { d.hidden = true; resize(); });
    on('tm2', function () { A.openCall(callUrl); });
    on('cvid', function () { call(true); }); on('caud', function () { call(false); }); on('chang', function () { hangup(true); });
    on('mm', function () { toggle('audio', 'mm'); }); on('mc', function () { toggle('video', 'mc'); });
    if (pc) { buttons(true); document.getElementById('lv').srcObject = local; if (remote) document.getElementById('rv').srcObject = remote; }
    if (incoming) showRing();
  }

  var pc = null, local = null, remote = null, pendingIce = [], incoming = null;
  function rtc(msg) { return api.post('/api/room/rtc', { room: ROOM, msg: msg }); }
  function cst(t) { var e = document.getElementById('cst'); if (e) e.textContent = t; }
  function buttons(active) {
    ['cvid', 'caud'].forEach(function (id) { var e = document.getElementById(id); if (e) e.disabled = active; });
    ['chang', 'mm', 'mc'].forEach(function (id) { var e = document.getElementById(id); if (e) e.disabled = !active; });
  }
  function toggle(kind, id) {
    if (!local) return;
    var tr = kind === 'audio' ? local.getAudioTracks() : local.getVideoTracks();
    tr.forEach(function (t) { t.enabled = !t.enabled; });
    var b = document.getElementById(id), off = tr.length && !tr[0].enabled; b.textContent = (kind === 'audio' ? 'Микрофон' : 'Камера') + (off ? ' выкл.' : '');
  }
  function fakeStream(video) {
    var out = new MediaStream();
    try { var ac = new (window.AudioContext || window.webkitAudioContext)(), osc = ac.createOscillator(), g = ac.createGain(), d = ac.createMediaStreamDestination(); g.gain.value = 0; osc.connect(g); g.connect(d); osc.start(); d.stream.getAudioTracks().forEach(function (t) { out.addTrack(t); }); } catch (e) {}
    if (video) {
      var c = document.createElement('canvas'); c.width = 320; c.height = 240;
      var g2 = c.getContext('2d'), me = role === 'tutor' ? names.tutor : names.student, vt = c.captureStream(10).getVideoTracks()[0];
      out.addTrack(vt);
      (function tick() { g2.fillStyle = role === 'tutor' ? '#2E55C9' : '#F49AC1'; g2.fillRect(0, 0, 320, 240); g2.fillStyle = '#111'; g2.font = '700 20px sans-serif'; g2.fillText(me || '', 14, 40); g2.fillText(new Date().toLocaleTimeString('ru-RU'), 14, 120); if (vt.readyState === 'live') setTimeout(tick, 100); })();
    }
    return out;
  }
  function media(video) {
    var f = document.getElementById('fake');
    if ((f && f.checked) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve(fakeStream(video));
    return navigator.mediaDevices.getUserMedia({ audio: true, video: video ? { width: 640, height: 480 } : false }).catch(function () { toast('Камера или микрофон недоступны — включаю тестовый сигнал.'); return fakeStream(video); });
  }
  function makePc() {
    pc = new RTCPeerConnection({ iceServers: ice });
    pc.onicecandidate = function (e) { if (e.candidate) rtc({ type: 'ice', c: e.candidate.toJSON() }); };
    pc.ontrack = function (e) { remote = e.streams[0]; var rv = document.getElementById('rv'); if (rv && rv.srcObject !== remote) { rv.srcObject = remote; rv.play().catch(function () {}); } };
    pc.onconnectionstatechange = function () { var s = pc && pc.connectionState; cst({ connecting: 'соединяю…', connected: 'на связи', disconnected: 'связь прервалась…', failed: 'не удалось соединиться — нужен Телемост', closed: 'звонок завершён' }[s] || s); if (s === 'failed') hangup(true); };
    local.getTracks().forEach(function (t) { pc.addTrack(t, local); });
    var lv = document.getElementById('lv'); if (lv) lv.srcObject = local;
  }
  function call(video) {
    if (pc) return; cst('звоню…'); buttons(true);
    media(video).then(function (s) { local = s; makePc(); return pc.createOffer().then(function (o) { return pc.setLocalDescription(o); }).then(function () { return rtc({ type: 'offer', sdp: pc.localDescription.sdp, video: video }); }); })
      .catch(function (e) { toast('Звонок не начался: ' + e.message); hangup(false); });
  }
  function showRing() {
    var box = document.getElementById('ringbox'); if (!box || !incoming) return;
    var other = role === 'tutor' ? names.student : names.tutor;
    box.innerHTML = '<div class="ringcall" role="alert">' + esc(other) + ' звонит' + (incoming.video ? ' по видео' : '') + '<div class="row" style="margin-top:6px"><button class="b sm blue" id="acc">Принять</button><button class="b sm sec" id="dec">Отклонить</button></div></div>';
    on('acc', accept); on('dec', function () { hangup(true); });
  }
  function accept() {
    var o = incoming; incoming = null; var rb = document.getElementById('ringbox'); if (rb) rb.innerHTML = '';
    if (!o) return; buttons(true); cst('соединяю…');
    media(o.video).then(function (s) { local = s; makePc(); return pc.setRemoteDescription({ type: 'offer', sdp: o.sdp }).then(function () { return pc.createAnswer(); }).then(function (a) { return pc.setLocalDescription(a); }).then(function () { drainIce(); return rtc({ type: 'answer', sdp: pc.localDescription.sdp }); }); })
      .catch(function (e) { toast('Не получилось ответить: ' + e.message); hangup(true); });
  }
  function drainIce() { pendingIce.splice(0).forEach(function (c) { pc.addIceCandidate(c).catch(function () {}); }); }
  function hangup(tell) {
    if (tell && (pc || incoming)) rtc({ type: 'bye' });
    if (pc) { pc.close(); pc = null; }
    if (local) { local.getTracks().forEach(function (t) { t.stop(); }); local = null; }
    remote = null; incoming = null; pendingIce = [];
    ['rv', 'lv'].forEach(function (id) { var v = document.getElementById(id); if (v) v.srcObject = null; });
    var rb = document.getElementById('ringbox'); if (rb) rb.innerHTML = '';
    buttons(false); cst('звонок не начат');
  }
  function onSignal(m) {
    if (readOnly) return;
    if (m.type === 'offer') {
      if (pc) { if (role === 'tutor') return; hangup(false); }
      incoming = m; pendingIce = [];
      var d = document.getElementById('drawer');
      if (d.hidden || d.dataset.what !== 'call') drawer('call');
      var ex = document.getElementById('exp'); if (ex) ex.open = true;
      showRing();
    } else if (m.type === 'answer' && pc && pc.signalingState === 'have-local-offer') { pc.setRemoteDescription({ type: 'answer', sdp: m.sdp }).then(drainIce); }
    else if (m.type === 'ice') { if (pc && pc.remoteDescription) pc.addIceCandidate(m.c).catch(function () {}); else pendingIce.push(m.c); }
    else if (m.type === 'bye') { if (pc || incoming) toast('Звонок завершён'); hangup(false); }
  }
  window.addEventListener('pagehide', function () { if (pc) rtc({ type: 'bye' }); });   // не beforeunload: он мешает вернуться к доске из кэша вкладок
  window.__lesson = { wake: function () { hiddenAt = Date.now() - 5000; wake(); }, pollGen: function () { return pollGen; }, state: function () { var m = model(); return { role: role, perm: perm, ended: ended, ops: ops.length, seq: seq, items: m.items.length, cards: m.cards.length, view: view, tools: [].map.call(document.querySelectorAll('[data-tool]'), function (b) { return b.dataset.tool; }) }; } };

  start();
})();
</script>
</body>
</html>
