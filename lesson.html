<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3EEE2">
<title>Аник — урок на доске</title>
<link rel="icon" href="icons/icon-180.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
html,body{height:100%}
body.lesson{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.lbar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:2px solid var(--ink);background:var(--paper);flex-wrap:nowrap;min-height:54px}
.lbar .who,.peer span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbar .who{flex:0 1 auto}.peer{min-width:0;flex:0 1 auto}
@media (max-width:700px){.lbar{flex-wrap:wrap}}
.lbar .wm{font-size:20px;margin-right:4px}
.lbar .grow{flex:1}
.peer{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.peer i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.peer.on i{background:var(--blue)}
.pages{display:inline-flex;align-items:center;border:2px solid var(--ink);background:#fff}
.pages button{min-width:40px;height:38px;border:0;background:transparent;font-weight:700;font-size:16px;cursor:pointer}
.pages button:disabled{opacity:.3;cursor:default}
.pages span{padding:0 8px;font-weight:700;font-size:14px;white-space:nowrap}
.pages .add{border-left:2px solid var(--ink);font-size:14px;padding:0 10px}
.callb{min-height:40px;padding:0 14px;border:2px solid var(--ink);background:var(--blue);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.callb.off{background:transparent;color:var(--ink);font-weight:600}
.tools{display:flex;gap:4px;align-items:center;padding:6px 8px;border-bottom:2px solid var(--ink);background:var(--paper);flex-wrap:wrap;flex-shrink:0}
@media (max-width:600px){.tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}}
.tools .sep{flex:0 0 2px;height:32px;background:var(--ink);margin:0 4px}
.tool{flex:0 0 auto;min-width:44px;height:44px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:700;cursor:pointer;font-size:12px;padding:0 6px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1;font-family:inherit}
.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool small{font-size:9.5px;font-weight:600;letter-spacing:.2px}
.tool[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.tool.wide{padding:0 10px;font-size:13px;flex-direction:row;gap:6px}
.sw{flex:0 0 32px;width:32px;height:32px;border:2px solid var(--ink);cursor:pointer;border-radius:0}
.sw[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:2px}
.wbtn{flex:0 0 40px;height:44px;border:2px solid var(--ink);background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.wbtn i{display:block;background:var(--ink);border-radius:50%}
.wbtn[aria-pressed=true]{background:var(--yellow)}
.zoomv{font-size:12px;font-weight:700;min-width:44px;text-align:center}
.lmain{flex:1;display:flex;min-height:0;position:relative}
.stage{flex:1;position:relative;overflow:hidden;background:var(--chip);touch-action:none;min-width:0}
.stage canvas{position:absolute;left:0;top:0;touch-action:none}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.sheet{position:absolute;left:0;top:0;background:#fff;box-shadow:0 0 0 3px var(--ink)}
.tcard{position:absolute;background:var(--paper);border:3px solid var(--ink);padding:22px 28px 26px;font-size:34px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.tcard .hd{display:block;font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin:0 0 10px;background:var(--yellow);padding:4px 12px;width:max-content;max-width:100%}
.tcard img{display:block;max-width:100%;max-height:900px;margin-top:14px;background:#fff}
.tcard .katex{font-size:1.05em}
.tcard .hdl{position:absolute;right:-3px;bottom:-3px;width:44px;height:44px;background:var(--ink);display:none}
.tcard .del{position:absolute;right:-3px;top:-3px;width:52px;height:52px;background:var(--red);color:#111;font:800 36px/52px var(--display);text-align:center;display:none}
.hand .tcard .hdl,.hand .tcard.mine .del{display:block}
.hand .tcard{cursor:move;box-shadow:8px 8px 0 var(--blue)}
.ring{position:absolute;border:2px dashed var(--red);border-radius:50%;pointer-events:none;display:none;background:rgba(229,51,42,.08)}
.drawer{width:340px;border-left:2px solid var(--ink);background:var(--paper);overflow:auto;padding:10px;flex-shrink:0}
@media (max-width:820px){.drawer{position:absolute;right:0;top:0;bottom:0;width:min(92vw,360px);z-index:10;box-shadow:-6px 0 0 rgba(17,17,17,.15)}}
.drawer h3{font-family:var(--display);font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.drawer .x{border:2px solid var(--ink);background:#fff;width:36px;height:36px;font-weight:800;cursor:pointer}
.mini{background:#fff;padding:10px;margin-top:8px;font-size:14px}
.mini .tx{max-height:150px;overflow:hidden;white-space:pre-wrap;line-height:1.4}
.mini img{max-width:100%;max-height:120px;display:block;margin-top:4px}
.vids{position:relative;background:#111;aspect-ratio:4/3;margin-top:8px}
.vids video{width:100%;height:100%;object-fit:cover;display:block;background:#111}
.vids video.me{position:absolute;right:6px;bottom:6px;width:32%;height:auto;aspect-ratio:4/3;border:2px solid var(--paper)}
.vids .st{position:absolute;left:8px;top:8px;background:var(--paper);font-size:12px;font-weight:600;padding:2px 6px}
.ringcall{background:var(--yellow);padding:10px;margin-top:8px;font-weight:600}
.exp summary{cursor:pointer;font-weight:600;font-size:14px;margin-top:14px}
.hint{position:absolute;left:10px;bottom:10px;background:rgba(243,238,226,.95);border:2px solid var(--ink);padding:6px 10px;font-size:12px;max-width:min(420px,80%);pointer-events:none}
.tbox{position:absolute;z-index:5;min-width:220px;min-height:44px;border:2px dashed var(--ink);background:rgba(255,255,255,.9);font-family:'Golos Text',sans-serif;font-weight:600;padding:4px 6px;resize:both}
@media (max-width:600px){.lbar .who{display:none}.tool small{display:none}.tool{min-width:42px}}
</style>
</head>
<body class="lesson">
<header class="lbar">
  <span class="wm">Аник<i>.</i></span>
  <span class="peer" id="peer"><i></i><span>…</span></span>
  <span class="grow"></span>
  <span id="pagesbox"></span>
  <span id="callbox"></span>
  <span class="who muted" id="who"></span>
</header>
<div id="app" style="flex:1;display:flex;flex-direction:column;min-height:0"><main class="wrap"><div class="empty">Загружаю урок…</div></main></div>
<script>
(function () {
  var A = window.AnikTutor, esc = A.esc;
  var qs = new URLSearchParams(location.search), ROOM = qs.get('r') || '', NOTE = qs.get('note');
  var tutorApi = new A.Api('tutor'), studentApi = new A.Api('student');
  var api = qs.get('as') === 's' ? studentApi : tutorApi;
  var app = document.getElementById('app'), who = document.getElementById('who'), peerEl = document.getElementById('peer');
  var W = 1600, H = 2400, COLORS = [['#111111', 'чёрный'], ['#E5332A', 'красный'], ['#2E55C9', 'синий'], ['#1F8A4C', 'зелёный'], ['#F6CE2E', 'жёлтый']];
  var WIDTHS = [5, 10, 18];
  var role = '', names = {}, ice = [], callUrl = '', ops = [], seq = 0, readOnly = false;
  var tool = 'pen', color = '#111111', width = 10, myStack = [], sentIds = {};
  var page = 0, follow = true;
  var stage, canvas, ctx, layer, sheet, ringEl, view = { x: 0, y: 0, z: 0.5 }, dpr = 1, outbox = [], sending = false, dirty = false;
  var ICON = {
    hand: '<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12m0-1.5v-6a1.5 1.5 0 0 1 3 0V12m0-5.5a1.5 1.5 0 0 1 3 0V13m0-3.5a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-2a6 6 0 0 1-5-2.7L4 16a1.6 1.6 0 0 1 2.6-1.8L8 16"/>',
    pen: '<path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/>',
    hl: '<path d="M9 15l-5 5h6l2-2"/><path d="M8 13l6-9 6 6-9 6z"/>',
    line: '<path d="M4 20L20 4"/><circle cx="4" cy="20" r="1.5"/><circle cx="20" cy="4" r="1.5"/>',
    arrow: '<path d="M4 20L19 5"/><path d="M10 5h9v9"/>',
    rect: '<rect x="4" y="6" width="16" height="12"/>',
    circle: '<circle cx="12" cy="12" r="8"/>',
    text: '<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',
    er: '<path d="M7 20h10"/><path d="M5 15l8-9 6 6-6 7H9z"/>',
    undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  };
  function svg(k) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[k] + '</svg>'; }
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3200); }
  function rid() { var a = new Uint8Array(6); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (b) { return (b % 36).toString(36); }).join('') + Date.now().toString(36).slice(-4); }

  // ───────── вход ─────────
  function start() {
    if (NOTE) return openNote();
    if (!/^[A-Za-z0-9_-]{10,40}$/.test(ROOM)) { app.innerHTML = '<main class="wrap"><div class="login"><h1>Нет такой комнаты</h1><p class="lead">Попросите у репетитора ссылку на урок.</p></div></main>'; return; }
    if (!api.token()) {
      app.innerHTML = '<main class="wrap"></main>';
      return A.loginForm(api, app.firstChild, 'Вход на урок', 'Отправьте боту «Аник» команду <b>/app</b> и введите код — так урок узнает, что это вы.', function () { location.reload(); });
    }
    api.post('/api/room/join', { room: ROOM }).then(function (j) {
      role = j.role; names = j.names; ice = j.ice || []; W = j.w; H = j.h; callUrl = j.call_url || '';
      who.textContent = role === 'tutor' ? names.tutor + ' · репетитор' : names.student;
      build();
      ops = []; apply(j.ops, true); seq = j.seq; setPeer(j.peer_online);
      var lastGo = ops.filter(function (o) { return o.t === 'go'; }).pop();
      if (lastGo) setPage(lastGo.pg, true);
      poll();
    }).catch(function (e) {
      if (e.status === 401) return start();
      app.innerHTML = '<main class="wrap"><div class="login"><h1>Урок недоступен</h1><p class="lead">Эта комната принадлежит другому репетитору или ученику, или урок уже закрыт.</p><p class="row" style="margin-top:12px"><button class="b sec" id="re">Войти другим кодом</button></p></div></main>';
      document.getElementById('re').onclick = function () { api.logout(); app.innerHTML = '<main class="wrap"></main>'; A.loginForm(api, app.firstChild, 'Вход на урок', 'Отправьте боту <b>/app</b> и введите код.', function () { location.reload(); }); };
    });
  }

  function openNote() {
    var first = tutorApi.token() ? tutorApi : studentApi;
    first.post('/api/note', { id: +NOTE }).catch(function (e) { if (first === tutorApi && studentApi.token()) return studentApi.post('/api/note', { id: +NOTE }); throw e; })
      .then(function (n) {
        readOnly = true; role = 'view'; W = n.w; H = n.h; tool = 'hand';
        who.textContent = 'Конспект: ' + n.title;
        peerEl.style.display = 'none';
        build(); ops = []; apply(n.ops, true);
      }).catch(function () { app.innerHTML = '<main class="wrap"><div class="login"><h1>Конспект недоступен</h1><p class="lead">Откройте его из кабинета или из приложения.</p></div></main>'; });
  }

  // ───────── разметка ─────────
  function tbtn(k, label, short) { return '<button class="tool" data-tool="' + k + '" title="' + label + '" aria-label="' + label + '" aria-pressed="' + (tool === k) + '">' + svg(k) + '<small>' + short + '</small></button>'; }
  function build() {
    var tb = tbtn('hand', 'Рука: двигать лист и задачи', 'рука');
    if (!readOnly) {
      tb += tbtn('pen', 'Ручка', 'ручка') + tbtn('hl', 'Маркер — выделить', 'маркер') + tbtn('line', 'Прямая (угол прилипает к 15°)', 'прямая') +
        tbtn('arrow', 'Стрелка', 'стрелка') + tbtn('rect', 'Прямоугольник', 'прямоуг.') + tbtn('circle', 'Окружность: от центра', 'окружн.') +
        tbtn('text', 'Текст', 'текст') + tbtn('er', 'Ластик: касание стирает линию целиком', 'ластик');
      tb += '<span class="sep"></span>' + COLORS.map(function (c) { return '<button class="sw" data-color="' + c[0] + '" style="background:' + c[0] + '" aria-label="Цвет: ' + c[1] + '" aria-pressed="' + (c[0] === color) + '"></button>'; }).join('');
      tb += '<span class="sep"></span>' + WIDTHS.map(function (w, i) { var d = [6, 11, 17][i]; return '<button class="wbtn" data-w="' + w + '" aria-label="Толщина ' + ['тонкая', 'средняя', 'толстая'][i] + '" aria-pressed="' + (w === width) + '"><i style="width:' + d + 'px;height:' + d + 'px"></i></button>'; }).join('');
      tb += '<span class="sep"></span><button class="tool" id="undo" title="Отменить своё последнее" aria-label="Отменить">' + svg('undo') + '<small>отменить</small></button><button class="tool wide" id="clr">Очистить лист</button>';
    }
    tb += '<span class="sep"></span><button class="tool wide" id="zout" aria-label="Уменьшить">−</button><span class="zoomv" id="zv">100%</span><button class="tool wide" id="zin" aria-label="Увеличить">+</button><button class="tool wide" id="zfit">По ширине</button>';
    if (role === 'tutor') tb += '<span class="sep"></span><button class="tool wide" id="bank" style="background:var(--yellow)">Задачи из банка</button>';
    if (!readOnly) tb += '<button class="tool wide" id="save">Сохранить конспект</button>';
    tb += '<button class="tool wide" id="png">PNG</button>';
    app.innerHTML = '<div class="tools" role="toolbar" aria-label="Инструменты доски">' + tb + '</div>' +
      '<div class="lmain"><div class="stage" id="stage"><div class="layer" id="layer"><div class="sheet" id="sheet"></div><div id="cards"></div></div><canvas id="board" aria-label="Общая доска"></canvas><div class="ring" id="ring"></div>' +
      '<div class="hint" id="hint">Колесо — прокрутка, Ctrl + колесо — масштаб. На планшете: одним пальцем или стилусом рисуем, двумя — двигаем и масштабируем.</div><span class="sr" aria-live="polite" id="live"></span></div>' +
      (readOnly ? '' : '<aside class="drawer" id="drawer" hidden></aside>') + '</div>';
    stage = document.getElementById('stage'); layer = document.getElementById('layer'); sheet = document.getElementById('sheet'); ringEl = document.getElementById('ring');
    canvas = document.getElementById('board'); ctx = canvas.getContext('2d');
    sheet.style.width = W + 'px'; sheet.style.height = H + 'px';
    app.querySelectorAll('[data-tool]').forEach(function (b) { b.onclick = function () { setTool(b.dataset.tool); }; });
    app.querySelectorAll('[data-color]').forEach(function (b) { b.onclick = function () { color = b.dataset.color; press('[data-color]', b); if (tool === 'er' || tool === 'hand') setTool('pen'); }; });
    app.querySelectorAll('[data-w]').forEach(function (b) { b.onclick = function () { width = +b.dataset.w; press('[data-w]', b); }; });
    on('undo', undo); on('clr', clearPage); on('save', save); on('png', png); on('bank', function () { drawer('bank'); });
    on('zin', function () { zoomAt(1.25); }); on('zout', function () { zoomAt(0.8); }); on('zfit', fitWidth);
    setTimeout(function () { var h = document.getElementById('hint'); if (h) h.remove(); }, 9000);
    pointer(); wheel();
    window.addEventListener('resize', function () { resize(); });
    resize(); fitWidth();
    if (stage.clientWidth < 600) { view.z = 0.4; view.x = -8 / view.z; clampView(); schedule(); }    // телефон: текст задачи читаемый, остальное — прокруткой и двумя пальцами
    pagesUi(); callUi();
    setTool(tool);
  }
  function on(id, fn) { var e = document.getElementById(id); if (e) e.onclick = fn; }
  function press(sel, b) { app.querySelectorAll(sel).forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); }
  function setTool(t) {
    tool = t; press('[data-tool]', app.querySelector('[data-tool=' + t + ']'));
    stage.classList.toggle('hand', t === 'hand' && !readOnly);
    canvas.style.cursor = t === 'hand' ? 'grab' : t === 'text' ? 'text' : t === 'er' ? 'none' : 'crosshair';
    ringEl.style.display = 'none';
  }

  // ───────── вид: масштаб и прокрутка ─────────
  function resize() {
    var r = stage.getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    canvas.style.width = r.width + 'px'; canvas.style.height = r.height + 'px';
    schedule();
  }
  function fitWidth() { var r = stage.getBoundingClientRect(); view.z = Math.max(0.15, (r.width - 24) / W); view.x = -12 / view.z; view.y = Math.max(-12 / view.z, Math.min(view.y, H)); clampView(); schedule(); }
  function clampView() {
    var r = stage.getBoundingClientRect(), vw = r.width / view.z, vh = r.height / view.z;
    view.z = Math.max(0.15, Math.min(4, view.z));
    var minX = Math.min(-40, W - vw + 40), maxX = Math.max(W - vw + 40, -40);
    if (vw > W + 80) { minX = maxX = (W - vw) / 2; }
    view.x = Math.max(minX, Math.min(maxX, view.x));
    view.y = Math.max(-60, Math.min(H - vh * 0.3, view.y));
  }
  function zoomAt(f, sx, sy) {
    var r = stage.getBoundingClientRect(); sx = sx == null ? r.width / 2 : sx; sy = sy == null ? r.height / 2 : sy;
    var wx = view.x + sx / view.z, wy = view.y + sy / view.z;
    view.z = Math.max(0.15, Math.min(4, view.z * f));
    view.x = wx - sx / view.z; view.y = wy - sy / view.z; clampView(); schedule();
  }
  function toWorld(e) { var r = canvas.getBoundingClientRect(); return [view.x + (e.clientX - r.left) / view.z, view.y + (e.clientY - r.top) / view.z]; }
  function wheel() {
    stage.addEventListener('wheel', function (e) {
      e.preventDefault();
      var r = stage.getBoundingClientRect();
      if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
      else { view.x += (e.shiftKey ? e.deltaY : e.deltaX) / view.z; if (!e.shiftKey) view.y += e.deltaY / view.z; clampView(); schedule(); }
    }, { passive: false });
  }

  // ───────── листы ─────────
  function pageCount() { var hidden = undone(), n = 1; ops.forEach(function (o) { if (o.t === 'np' && !hidden[o.id]) n++; }); return Math.min(n, 30); }
  function pagesUi() {
    var n = pageCount(), box = document.getElementById('pagesbox');
    if (page >= n) page = n - 1;
    box.innerHTML = '<span class="pages" role="group" aria-label="Листы урока"><button id="pprev" aria-label="Предыдущий лист"' + (page ? '' : ' disabled') + '>‹</button><span>Лист ' + (page + 1) + ' из ' + n + '</span>' +
      '<button id="pnext" aria-label="Следующий лист"' + (page < n - 1 ? '' : ' disabled') + '>›</button>' + (readOnly ? '' : '<button class="add" id="padd" aria-label="Новый лист">+ лист</button>') + '</span>';
    on('pprev', function () { setPage(page - 1); }); on('pnext', function () { setPage(page + 1); });
    on('padd', function () { if (pageCount() >= 30) return toast('Не больше 30 листов'); send({ t: 'np', id: rid() }); setPage(pageCount() - 1); });
  }
  function setPage(p, quiet) {
    p = Math.max(0, Math.min(pageCount() - 1, p));
    var changed = p !== page; page = p;
    if (changed) { view.y = -12 / view.z; clampView(); }
    if (changed && !quiet && role === 'tutor') send({ t: 'go', id: rid(), pg: p });     // ученик переходит следом
    if (changed && role === 'student' && !quiet) follow = false;
    pagesUi(); schedule();
  }

  // ───────── модель ─────────
  function undone() { var h = {}; ops.forEach(function (o) { if (o.t === 'undo') h[o.s] = 1; }); return h; }
  function pageItems(pg) {
    var start = 0, hidden = undone();
    ops.forEach(function (o, i) { if (o.t === 'clr' && (o.pg || 0) === pg) start = i + 1; });
    var strokes = {}, order = [], cards = {}, corder = [], moves = {};
    for (var i = 0; i < ops.length; i++) {

  // ───────── панель: задачи из банка (репетитор) и звонок ─────────
  var BANKS = [['ege-rus', 'ЕГЭ · Русский', 1, 26], ['oge-rus', 'ОГЭ · Русский', 2, 12], ['ege-math', 'ЕГЭ · Профиль', 1, 13], ['ege-mathb', 'ЕГЭ · База', 1, 21], ['oge-math', 'ОГЭ · Математика', 1, 19]];
  var bf = { bank: 'ege-rus', n: 0, off: 0, q: '', fig: false }, bankCache = {};
  function drawer(what) {
    var d = document.getElementById('drawer');
    if (!d) return;
    if (!d.hidden && d.dataset.what === what) { d.hidden = true; resize(); return; }
    d.hidden = false; d.dataset.what = what; resize();
    if (what === 'bank') bankUi(d); else callPanel(d);
  }
  function bankUi(d) {
    var b = BANKS.filter(function (x) { return x[0] === bf.bank; })[0], nums = [];
    for (var i = b[2]; i <= b[3]; i++) nums.push(i);
    d.innerHTML = '<h3>Задачи из банка <button class="x" id="dx" aria-label="Закрыть">×</button></h3><div class="row" style="margin-top:8px"><select class="inp" id="bb" aria-label="Экзамен" style="flex:1">' +
      BANKS.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === bf.bank ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select>' +
      '<select class="inp" id="bn" aria-label="Номер задания"><option value="0">№</option>' + nums.map(function (n) { return '<option' + (n === bf.n ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></div>' +
      '<input class="inp" id="bq" placeholder="Поиск: слово, формула, $ — с формулами" aria-label="Поиск задачи по тексту" style="width:100%;margin-top:6px" value="' + esc(bf.q) + '">' +
      '<label class="chk" style="margin-top:4px"><input type="checkbox" id="bfig"' + (bf.fig ? ' checked' : '') + '> только с рисунком</label>' +
      '<p class="muted" style="margin-top:6px">Задача встанет на текущий лист крупно, с формулами и рисунком. Рукой её можно двигать и тянуть за угол.</p><div id="bl"></div>';
    on('dx', function () { d.hidden = true; resize(); });
    document.getElementById('bb').onchange = function (e) { bf.bank = e.target.value; bf.n = 0; bankUi(d); };
    document.getElementById('bn').onchange = function (e) { bf.n = +e.target.value; bf.off = 0; bankUi(d); };
    var tq; document.getElementById('bq').oninput = function (e) { clearTimeout(tq); tq = setTimeout(function () { bf.q = e.target.value; bf.off = 0; bankList(b); }, 250); };
    document.getElementById('bfig').onchange = function (e) { bf.fig = e.target.checked; bf.off = 0; bankList(b); };
    bankList(b);
  }
  function bankList(b) {
    if (!bf.n) return;
    var key = bf.bank + '_' + bf.n;
    (bankCache[key] ? Promise.resolve(bankCache[key]) : fetch('trainer/' + key + '.json').then(function (r) { if (!r.ok) throw 0; return r.json(); }))
      .then(function (j) {
        bankCache[key] = j;
        var list = (Array.isArray(j) ? j : j.tasks || []).map(function (t) {
          var text = t.t || t.text || '', opts = t.options || [];
          if (opts.length) text += '\n\n' + opts.map(function (o, i) { return (i + 1) + ') ' + o; }).join('\n');
          return { id: t.id, text: text, ans: (Array.isArray(t.a) ? t.a[0] : t.a) || t.answer || '', fig: (t.f || [])[0] || '' };
        });
        var q = bf.q.trim().toLowerCase();
        if (q) list = list.filter(function (it) { return it.text.toLowerCase().indexOf(q) >= 0; });
        if (bf.fig) list = list.filter(function (it) { return it.fig; });
        var bl = document.getElementById('bl'), part = list.slice(0, bf.off + 15);
        bl.innerHTML = '<p class="muted" style="margin-top:6px">Задач: ' + list.length + '</p>' + part.map(function (it, i) {
          return '<div class="mini"><div class="tx">' + esc(it.text) + '</div>' + (it.fig ? '<img src="' + esc(it.fig) + '" alt="" loading="lazy">' : '') +
            '<div class="row" style="justify-content:space-between;margin-top:6px"><span class="muted">ответ: ' + esc(it.ans) + '</span><button class="b sm" data-k="' + i + '">На доску</button></div></div>'; }).join('') +
          (part.length < list.length ? '<button class="b sec" id="bmore" style="margin-top:8px;width:100%">Ещё задачи</button>' : '');
        A.math(bl);
        on('bmore', function () { bf.off += 15; bankList(b); });
        bl.querySelectorAll('[data-k]').forEach(function (btn) { btn.onclick = function () { place(part[+btn.dataset.k], b); }; });
      }).catch(function () { document.getElementById('bl').innerHTML = '<p class="muted" style="margin-top:8px">Не получилось загрузить задачи этого номера.</p>'; });
  }
  function place(it, b) {
    var r = stage.getBoundingClientRect(), y = Math.max(20, Math.round(view.y + 30 / view.z)), x = Math.max(20, Math.round(view.x + 20 / view.z));
    document.querySelectorAll('#cards .tcard').forEach(function (el) { if (el.offsetTop < y + 200 && el.offsetTop + el.offsetHeight > y - 40) y = Math.max(y, el.offsetTop + el.offsetHeight + 40); });   // под уже стоящими задачами
    y = Math.min(y, H - 300);
    if (y + 200 > view.y + r.height / view.z) { view.y = y - 40 / view.z; clampView(); }      // прокрутить к новой задаче
    x = Math.min(x, W - 1400); if (x < 20) x = 20;
    var fig = /^(figs|trainer\/figs)\/[A-Za-z0-9_.-]+$/.test(it.fig) ? it.fig : '';
    var id = rid(); myStack.push(id);
    send({ t: 'tk', id: id, pg: page, x: x, y: y, w: Math.min(1400, W - x - 20), head: b[1] + ' · №' + bf.n, text: it.text.slice(0, 3900), fig: fig });
    toast('Задача на листе ' + (page + 1));
    if (r.width < 820) { document.getElementById('drawer').hidden = true; resize(); }
  }

  // звонок: основной — Телемост (ссылка репетитора); запасной — WebRTC напрямую, экспериментально
  function callUi() {
    var box = document.getElementById('callbox');
    if (readOnly) { box.innerHTML = ''; return; }
    var tm = /telemost/.test(callUrl);
    box.innerHTML = (callUrl ? '<button class="callb" id="tmb">📞 ' + (tm ? 'Позвонить в Телемост' : 'Позвонить') + '</button>'
      : (role === 'tutor' ? '<a class="callb off" href="tutor.html" target="_blank" rel="noopener" title="Ссылка на Телемост задаётся в кабинете">Добавить ссылку на Телемост</a>' : '<span class="muted">звонок: ждите ссылку от репетитора</span>')) +
      ' <button class="callb off" id="callmore" aria-label="Другие способы звонка">⋯</button>';
    on('tmb', function () { A.openCall(callUrl); });
    on('callmore', function () { drawer('call'); });
  }
  function callPanel(d) {
    d.innerHTML = '<h3>Звонок <button class="x" id="dx" aria-label="Закрыть">×</button></h3>' +
      (callUrl ? '<p style="margin-top:8px">Основной звонок — ' + (/telemost/.test(callUrl) ? 'Яндекс Телемост' : 'по ссылке репетитора') + ': откроется в новом окне, доска остаётся здесь.</p><button class="callb" id="tm2" style="margin-top:8px">📞 Открыть звонок</button>'
        : '<p class="muted" style="margin-top:8px">Репетитор ещё не указал ссылку на Телемост.</p>') +
      '<details class="exp" id="exp"' + (pc ? ' open' : '') + '><summary>Звонок без Телемоста (экспериментально)</summary><p class="muted" style="margin-top:6px">Прямо в браузере, без сторонних сервисов. В некоторых сетях (мобильный интернет, школьный Wi-Fi) может не соединиться.</p>' +
      '<div class="vids"><video id="rv" autoplay playsinline aria-label="Собеседник"></video><video id="lv" class="me" autoplay playsinline muted aria-label="Вы"></video><span class="st" id="cst">' + (pc ? 'на связи' : 'звонок не начат') + '</span></div>' +
      '<div class="row" style="margin-top:8px"><button class="b blue sm" id="cvid">Видео</button><button class="b sm sec" id="caud">Голос</button><button class="b sm red" id="chang" disabled>Завершить</button></div>' +
      '<div class="row" style="margin-top:6px"><button class="b sm sec" id="mm" disabled>Микрофон</button><button class="b sm sec" id="mc" disabled>Камера</button>' +
      '<label class="chk" style="font-size:12px"><input type="checkbox" id="fake"> тестовый сигнал</label></div><div id="ringbox"></div></details>';
    on('dx', function () { d.hidden = true; resize(); });
    on('tm2', function () { A.openCall(callUrl); });
    on('cvid', function () { call(true); }); on('caud', function () { call(false); }); on('chang', function () { hangup(true); });
    on('mm', function () { toggle('audio', 'mm'); }); on('mc', function () { toggle('video', 'mc'); });
    if (pc) { buttons(true); document.getElementById('lv').srcObject = local; if (remote) document.getElementById('rv').srcObject = remote; }
    if (incoming) showRing();
  }

  var pc = null, local = null, remote = null, pendingIce = [], incoming = null;
  function rtc(msg) { return api.post('/api/room/rtc', { room: ROOM, msg: msg }); }
  function cst(t) { var e = document.getElementById('cst'); if (e) e.textContent = t; }
  function buttons(active) {
    ['cvid', 'caud'].forEach(function (id) { var e = document.getElementById(id); if (e) e.disabled = active; });
    ['chang', 'mm', 'mc'].forEach(function (id) { var e = document.getElementById(id); if (e) e.disabled = !active; });
  }
  function toggle(kind, id) {
    if (!local) return;
    var tr = kind === 'audio' ? local.getAudioTracks() : local.getVideoTracks();
    tr.forEach(function (t) { t.enabled = !t.enabled; });
    var b = document.getElementById(id), off = tr.length && !tr[0].enabled; b.textContent = (kind === 'audio' ? 'Микрофон' : 'Камера') + (off ? ' выкл.' : '');
  }
  function fakeStream(video) {
    var out = new MediaStream();
    try { var ac = new (window.AudioContext || window.webkitAudioContext)(), osc = ac.createOscillator(), g = ac.createGain(), d = ac.createMediaStreamDestination(); g.gain.value = 0; osc.connect(g); g.connect(d); osc.start(); d.stream.getAudioTracks().forEach(function (t) { out.addTrack(t); }); } catch (e) {}
    if (video) {
      var c = document.createElement('canvas'); c.width = 320; c.height = 240;
      var g2 = c.getContext('2d'), me = role === 'tutor' ? names.tutor : names.student, vt = c.captureStream(10).getVideoTracks()[0];
      out.addTrack(vt);
      (function tick() { g2.fillStyle = role === 'tutor' ? '#2E55C9' : '#F49AC1'; g2.fillRect(0, 0, 320, 240); g2.fillStyle = '#111'; g2.font = '700 20px sans-serif'; g2.fillText(me || '', 14, 40); g2.fillText(new Date().toLocaleTimeString('ru-RU'), 14, 120); if (vt.readyState === 'live') setTimeout(tick, 100); })();
    }
    return out;
  }
  function media(video) {
    var f = document.getElementById('fake');
    if ((f && f.checked) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve(fakeStream(video));
    return navigator.mediaDevices.getUserMedia({ audio: true, video: video ? { width: 640, height: 480 } : false }).catch(function () { toast('Камера или микрофон недоступны — включаю тестовый сигнал.'); return fakeStream(video); });
  }
  function makePc() {
    pc = new RTCPeerConnection({ iceServers: ice });
    pc.onicecandidate = function (e) { if (e.candidate) rtc({ type: 'ice', c: e.candidate.toJSON() }); };
    pc.ontrack = function (e) { remote = e.streams[0]; var rv = document.getElementById('rv'); if (rv && rv.srcObject !== remote) { rv.srcObject = remote; rv.play().catch(function () {}); } };
    pc.onconnectionstatechange = function () { var s = pc && pc.connectionState; cst({ connecting: 'соединяю…', connected: 'на связи', disconnected: 'связь прервалась…', failed: 'не удалось соединиться — используйте Телемост', closed: 'звонок завершён' }[s] || s); if (s === 'failed') hangup(true); };
    local.getTracks().forEach(function (t) { pc.addTrack(t, local); });
    var lv = document.getElementById('lv'); if (lv) lv.srcObject = local;
  }
  function call(video) {
    if (pc) return; cst('звоню…'); buttons(true);
    media(video).then(function (s) { local = s; makePc(); return pc.createOffer().then(function (o) { return pc.setLocalDescription(o); }).then(function () { return rtc({ type: 'offer', sdp: pc.localDescription.sdp, video: video }); }); })
      .catch(function (e) { toast('Звонок не начался: ' + e.message); hangup(false); });
  }
  function showRing() {
    var box = document.getElementById('ringbox'); if (!box || !incoming) return;
    var other = role === 'tutor' ? names.student : names.tutor;
    box.innerHTML = '<div class="ringcall" role="alert">' + esc(other) + ' звонит' + (incoming.video ? ' по видео' : '') + '<div class="row" style="margin-top:6px"><button class="b sm blue" id="acc">Принять</button><button class="b sm sec" id="dec">Отклонить</button></div></div>';
    on('acc', accept); on('dec', function () { hangup(true); });
  }
  function accept() {
    var o = incoming; incoming = null; var rb = document.getElementById('ringbox'); if (rb) rb.innerHTML = '';
    if (!o) return; buttons(true); cst('соединяю…');
    media(o.video).then(function (s) { local = s; makePc(); return pc.setRemoteDescription({ type: 'offer', sdp: o.sdp }).then(function () { return pc.createAnswer(); }).then(function (a) { return pc.setLocalDescription(a); }).then(function () { drainIce(); return rtc({ type: 'answer', sdp: pc.localDescription.sdp }); }); })
      .catch(function (e) { toast('Не получилось ответить: ' + e.message); hangup(true); });
  }
  function drainIce() { pendingIce.splice(0).forEach(function (c) { pc.addIceCandidate(c).catch(function () {}); }); }
  function hangup(tell) {
    if (tell && (pc || incoming)) rtc({ type: 'bye' });
    if (pc) { pc.close(); pc = null; }
    if (local) { local.getTracks().forEach(function (t) { t.stop(); }); local = null; }
    remote = null; incoming = null; pendingIce = [];
    ['rv', 'lv'].forEach(function (id) { var v = document.getElementById(id); if (v) v.srcObject = null; });
    var rb = document.getElementById('ringbox'); if (rb) rb.innerHTML = '';
    buttons(false); cst('звонок не начат');
  }
  function onSignal(m) {
    if (readOnly) return;
    if (m.type === 'offer') {
      if (pc) { if (role === 'tutor') return; hangup(false); }
      incoming = m; pendingIce = [];
      var d = document.getElementById('drawer');
      if (d.hidden || d.dataset.what !== 'call') drawer('call');
      var ex = document.getElementById('exp'); if (ex) ex.open = true;
      showRing();
    } else if (m.type === 'answer' && pc && pc.signalingState === 'have-local-offer') { pc.setRemoteDescription({ type: 'answer', sdp: m.sdp }).then(drainIce); }
    else if (m.type === 'ice') { if (pc && pc.remoteDescription) pc.addIceCandidate(m.c).catch(function () {}); else pendingIce.push(m.c); }
    else if (m.type === 'bye') { if (pc || incoming) toast('Звонок завершён'); hangup(false); }
  }
  window.addEventListener('beforeunload', function () { if (pc) rtc({ type: 'bye' }); });
  window.__lesson = { state: function () { return { role: role, page: page, pages: pageCount(), ops: ops.length, seq: seq, cards: document.querySelectorAll('#cards .tcard').length, zoom: view.z, call: pc ? pc.connectionState : 'none', incoming: !!incoming }; } };

  start();
})();
</script>
</body>
