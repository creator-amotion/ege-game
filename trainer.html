<html lang="ru">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;margin-bottom:10px}
.back{min-width:44px;height:44px;padding:0 14px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.back:hover{background:var(--ink);color:var(--paper)}
h1{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:-1.6px;line-height:.96;margin:14px 0 8px}
.lead{font-size:16px;line-height:1.5;margin-bottom:6px}
.stl{margin:24px 0 12px;padding-top:8px;border-top:2px solid var(--ink)}
.cards{display:grid;gap:10px}
.setcard{display:block;width:100%;text-align:left;position:relative;overflow:hidden;border:0;min-height:150px;padding:12px 130px 12px 14px;color:var(--ink);cursor:pointer;text-decoration:none;background:var(--col)}
.setcard:hover{outline:3px solid var(--ink);outline-offset:2px}
.setcard .tn{position:relative;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.setcard .nm{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1.05;position:relative;margin-top:3px}
.setcard .ds{font-size:13px;line-height:1.35;margin-top:4px;position:relative}
.setcard .big{position:absolute;right:-10px;bottom:-40px;font-family:var(--display);font-weight:800;font-size:210px;line-height:.8;letter-spacing:-12px;color:var(--bigc);pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{text-align:left;border:0;padding:10px 12px 16px;min-height:124px;cursor:pointer;font:inherit}
.tile:hover{outline:3px solid var(--ink);outline-offset:2px}
.tile .tn{position:relative;margin-bottom:2px}
.tile .nm{position:relative;font-family:var(--display);font-size:17px;font-weight:800;letter-spacing:-.4px;line-height:1.1;max-width:85%}
.tile .pb{position:absolute;left:0;right:0;bottom:0;height:5px}
.tile .pf{display:block;height:100%;background:var(--ink)}
.tile .st{position:absolute;right:8px;top:8px;background:var(--ink);color:var(--yellow);font-size:10px;font-weight:700;padding:2px 6px;letter-spacing:1px}
.plan{background:#fff;padding:14px 16px}
.plan a{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.plan a:last-child{border-bottom:0}
.plan a small{font-weight:400;color:var(--muted)}
/* шапка номера — цвет и знак плитки */
.hero-n{position:relative;overflow:hidden;margin:-16px -16px 16px;padding:24px 20px 18px;min-height:168px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--col);color:var(--ink)}
.hero-n .big{right:-6px;bottom:-40px;font-size:230px}
.hero-n .big.wide{font-size:170px}
.hero-n .big.low{bottom:26px;font-size:240px}
.hero-n .tn{position:relative;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.hero-n h2{position:relative;font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.05;max-width:80%}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 16px}
.fact{background:#fff;padding:10px 12px}
.fact b{display:block;font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1}
.fact span{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:0 22px;margin-top:10px;border:0;background:var(--ink);color:var(--paper);font-size:16px;font-weight:600;text-align:left;cursor:pointer}
.btn::after{content:"→";color:var(--yellow);font-weight:700}
.btn.sec{border:2px solid var(--ink);background:transparent;color:var(--ink)}
.btn.sec::after{content:none}
.btn:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:3px;margin:4px 0 14px}
.dot{flex:1;height:6px;background:var(--line2)}
.dot.cur{background:var(--ink)}.dot.ok{background:var(--blue)}.dot.bad{background:var(--red)}
.ph{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.ph b{color:var(--ink)}
.card{background:#fff;padding:16px;margin-bottom:10px}
.card summary{cursor:pointer;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.txt{font-size:16px;line-height:1.65;white-space:pre-line;overflow-wrap:anywhere}
.txt p+p{margin-top:8px}
.passage{font-size:15px;line-height:1.7;max-height:260px;overflow:auto;white-space:pre-line}
table.t{border-collapse:collapse;margin:10px 0;width:100%;font-size:14px}
table.t td,table.t th{border:2px solid var(--ink);padding:6px 8px;text-align:left;vertical-align:top}
table.t tr:first-child td{background:var(--chip);font-weight:600}
.fig{display:block;max-width:100%;height:auto;margin:10px auto;background:#fff}
.src{font-size:12px;color:var(--muted);margin-top:10px}
.inp{width:100%;min-height:54px;padding:0 14px;border:2px solid var(--ink);border-radius:0;background:#fff;color:var(--ink);font-size:20px;font-family:var(--body);font-weight:600;letter-spacing:0}
.inp::placeholder{font-size:14px;font-weight:400;color:var(--muted)}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-t)}
.inp.ok{border-color:var(--blue);background:var(--blue-t)}
.inp.err{border-color:var(--red);background:var(--red-t)}
.fb{padding:14px 16px;margin-top:10px;font-size:15px;line-height:1.55;font-weight:600}
.fb.good{background:var(--blue);color:#fff}
.fb.bad{background:var(--red);color:var(--ink)}
.fb small{display:block;font-weight:400;margin-top:2px}
.tcard{background:#fff;border-top:6px solid var(--col,var(--red));padding:16px;margin-bottom:10px}
.tcard h3{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.4px;margin-bottom:8px}
.tcard p{font-size:14px;line-height:1.6;color:var(--muted)}
.rbox{background:var(--chip);padding:10px 12px;margin-top:8px;font-size:14px}
.rbox b{display:block;background:linear-gradient(transparent 58%,var(--yellow) 58%);width:max-content;max-width:100%}
.rbox small{display:block;margin-top:4px;font-size:13px;line-height:1.5;color:var(--muted)}
.exs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ex{background:#fff;padding:4px 10px;font-size:13px}
.gcard{display:block;width:100%;text-align:left;margin-top:10px;padding:14px 16px;border:0;border-left:8px solid var(--col,var(--red));background:#fff;color:var(--ink);cursor:pointer;font-size:15px}
.gcard b{display:block;font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.gcard span{font-size:13px;color:var(--muted)}
.gcard:hover{outline:3px solid var(--ink);outline-offset:2px}
.gq{font-size:17px;line-height:1.6;overflow-wrap:anywhere}
.gq i{color:var(--muted)}
.opts{display:grid;gap:8px;margin-top:4px}
.optb{min-height:54px;padding:10px 14px;border:2px solid var(--ink);border-radius:0;background:#fff;color:var(--ink);font-size:16px;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.optb:hover:not([disabled]){background:var(--chip)}
.optb.right{background:var(--blue);border-color:var(--blue);color:#fff}
.optb.wrong{background:var(--red);border-color:var(--red);color:var(--ink);text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{min-height:44px;padding:6px 12px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-size:14px;cursor:pointer;text-align:left}
.chip:hover{background:var(--ink);color:var(--paper)}
.chip.mix{background:var(--yellow)}
.chip small{opacity:.6}
.fb small{display:block;font-weight:400;margin-top:4px}
.tabs2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0 -16px 16px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.tabs2 .tab{min-height:50px;border:0;background:transparent;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer}
.tabs2 .tab.on{background:var(--ink);color:var(--paper)}
.facts .fact{background:none;padding:0}
/* ответ «цифры подряд» — кнопками-номерами */
.nbs{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:6px;margin:10px 0 0}
.nbs button{min-height:56px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-family:var(--display);font-size:22px;font-weight:800;cursor:pointer}
.nbs button.on{background:var(--ink);color:var(--paper)}
.nbs button:disabled{cursor:default}
/* итог подхода */
.res-hero{position:relative;overflow:hidden;margin:-16px -16px 16px;min-height:300px;padding:54px 20px 20px;background:var(--col);color:var(--ink)}
.res-hero .ra,.res-hero .rb{position:absolute;font-family:var(--display);font-weight:800;line-height:.8;pointer-events:none}
.res-hero .ra{left:-16px;top:110px;font-size:280px;letter-spacing:-14px;color:var(--bigc)}
.res-hero .rb{right:-30px;top:160px;font-size:220px;letter-spacing:-14px;color:transparent;-webkit-text-stroke:3px var(--ink)}
.res-hero .tn{position:relative;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.res-hero h2{position:relative;font-family:var(--display);font-size:44px;font-weight:800;letter-spacing:-1.8px;line-height:.94;margin-top:8px}
.marks{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:8px}
.marks span{height:30px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:14px;font-weight:800}
.marks .ok{background:var(--blue);color:#fff}.marks .bad{background:var(--red);color:var(--ink)}
[hidden]{display:none!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .btn{padding:0 16px}
.fin .fs{font-family:var(--display);font-size:96px;font-weight:800;letter-spacing:-5px;line-height:.9}
.fin .fs.g{color:var(--blue)}.fin .fs.r{color:var(--red)}
.fin .fs.y{display:inline-block;background:linear-gradient(transparent 60%,var(--yellow) 60%)}
.hint{margin-top:12px;padding:10px 14px;background:var(--yellow);font-size:14px}
.list{margin-top:14px}
.list div{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.list div b{min-width:24px}
.empty{padding:30px 0;color:var(--muted)}
.tools{display:flex;gap:8px;margin:10px 0 14px}
.tool{flex:1;min-height:52px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:14px;font-weight:600;cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:none}
.tool.on{background:var(--yellow)}
.ln1,.ln2{display:block;width:40px;border-bottom:3px solid var(--ink)}
.ln2{border-bottom:7px double var(--ink)}
.bw{font-size:18px;line-height:2.4}
.wd{border:0;background:transparent;color:var(--ink);font:inherit;padding:0 3px;cursor:pointer;border-bottom:3px solid transparent}
.wd:hover:not([disabled]){background:var(--chip)}
.wd.s{border-bottom:3px solid var(--ink)}
.wd.p{border-bottom:7px double var(--ink)}
.wd.on{background:var(--yellow)}
.wd.right{background:var(--blue);color:#fff}
.wd.wrong,.wd.xw{background:var(--red)}
.wd.miss{background:var(--yellow)}
.ghost{position:fixed;width:48px;height:14px;pointer-events:none;z-index:50;border-bottom:3px solid var(--ink)}
.ghost.p{border-bottom:7px double var(--ink)}
.fb.hintq{background:var(--yellow);color:var(--ink)}
b.mark{background:var(--yellow);padding:0 3px}
.tabs2.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs2.t4 .tab{font-size:14px}
.lstep{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:8px;padding:12px 14px;border:2px solid var(--line2);background:#fff;color:var(--ink);cursor:pointer;font:inherit}
.lstep i{flex:none;width:28px;height:28px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800}
.lstep.done i{background:var(--blue);border-color:var(--blue);color:#fff}
.lstep.cur{border-color:var(--ink);box-shadow:4px 4px 0 var(--yellow)}
.lstep b{display:block;font-size:16px}
.lstep small{display:block;font-size:13px;color:var(--muted)}
</style>

<body class="trainer">
<main id="app"></main>

<script>
var BOT_USERNAME='examzadrotbot';
var SESSION=10;                                    // сколько заданий в одном подходе
var SETS={
  'oge-rus':{skill:'oge.rus',exam:'ОГЭ',sign:'Аа',skin:['#E5332A','#111111','#F6CE2E'],desc:'Задания 2–12: текст, орфография, пунктуация, нормы'},
  'oge-math':{skill:'oge.math',exam:'ОГЭ',sign:'%',skin:['#2E55C9','#FFFFFF','#7098F8'],desc:'Часть 1: расчёты, алгебра, геометрия'},
  'ege-mathb':{skill:'ege.mathb',exam:'ЕГЭ',sign:'÷',skin:['#F6CE2E','#111111','#E5332A'],desc:'Базовый уровень: задания 1–21'}
};
var TG=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor('#F3EEE2');TG.setBackgroundColor('#F3EEE2');}catch(e){}}

var INDEX=null,REG=null,cache={},run=null;
var app=document.getElementById('app');

/* ───────── служебное ───────── */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function lsGet(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function pad2(n){return (n<10?'0':'')+n;}
function plural(n,a,b,c){var m=n%10,h=n%100;return h>10&&h<15?c:m===1?a:m>1&&m<5?b:c;}
function getJSON(url){return fetch(url).then(function(r){if(!r.ok)throw new Error(url);return r.json();});}

/* ───────── проверка ответа (те же правила, что у бота) ───────── */
function normWord(s){return String(s).toUpperCase().replace(/Ё/g,'Е').replace(/[^0-9A-ZА-Я]/g,'');}
function digitsOf(s){return String(s).replace(/\D/g,'');}
function toNum(s){
  s=String(s).trim().replace(/\s+/g,'').replace(',','.').replace(/[−–]/g,'-');
  var m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(m){var d=parseFloat(m[2]);return d?parseFloat(m[1])/d:NaN;}
  return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN;
}
function isAnswerShaped(task,v){
  v=String(v).trim();
  if(!v)return false;
  if(task.k==='num')return !isNaN(toNum(v));
  if(task.k==='word')return normWord(v).length>0;
  return digitsOf(v).length>0;
}
function checkAnswer(task,user){
  return task.a.some(function(a){
    if(task.k==='num'){var u=toNum(user),c=toNum(a);return !isNaN(u)&&!isNaN(c)&&Math.abs(u-c)<1e-9*Math.max(1,Math.abs(c));}
    if(task.k==='set')return digitsOf(user).split('').sort().join('')===digitsOf(a).split('').sort().join('');
    if(task.k==='seq')return digitsOf(user)===digitsOf(a);
    return normWord(user)===normWord(a);
  });
}

/* ───────── текст задания: таблицы «ячейка | ячейка» → таблица ───────── */
function renderText(t){
  var lines=String(t).split('\n'),out='',i=0;
  while(i<lines.length){
    if(lines[i].indexOf(' | ')>=0){
      var rows=[];
      while(i<lines.length&&lines[i].indexOf(' | ')>=0){rows.push(lines[i].split(' | '));i++;}
      out+='<table class="t">'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</table>';
    }else{
      var chunk=[];
      while(i<lines.length&&lines[i].indexOf(' | ')<0){chunk.push(lines[i]);i++;}
      var txt=chunk.join('\n').replace(/^\n+|\n+$/g,'');
      if(txt)out+='<p>'+esc(txt)+'</p>';
    }
  }
  return out;
}

/* ───────── данные ───────── */
function loadIndex(){
  if(INDEX)return Promise.resolve();
  return Promise.all([getJSON('trainer/index.json'),getJSON('skills_registry.json').catch(function(){return null;})]).then(function(r){INDEX=r[0];REG=r[1];});
}
function loadPack(set,n){
  var key=set+'_'+n;
  if(cache[key])return Promise.resolve(cache[key]);
  return getJSON('trainer/'+key+'.json').then(function(p){cache[key]=p;return p;});
}
// цвет и знак номера: у каждого номера в разделе свой цвет (anik-look.js), у математики — от синего к жёлтому
function numSkin(set,n){var list=INDEX.sets[set].numbers,i=list.map(function(x){return x.n;}).indexOf(n);return AnikLook.ramp(list.length,set!=='oge-rus')[i<0?0:i];}
function numSign(set,n){return AnikLook.signOf(SETS[set].skill,n);}
function sectionColor(sec){return REG&&REG.sections&&REG.sections[sec]?REG.sections[sec].color:'#E5332A';}
function isBlue(color){return color==='#2E55C9';}
function numStats(set,n){return lsGet('anik_tr',{})[set+'_'+n]||{ok:0,tot:0};}
function addStats(set,n,ok,tot,key){key=key||'anik_tr';var all=lsGet(key,{}),k=set+'_'+n,s=all[k]||{ok:0,tot:0};s.ok+=ok;s.tot+=tot;s.d=Date.now();s.last=Math.round(100*ok/Math.max(1,tot));all[k]=s;lsSet(key,all);}
function gStats(set,n){return lsGet('anik_trg',{})[set+'_'+n]||{ok:0,tot:0};}
function theoryRead(set,n){return !!lsGet('anik_trt',{})[set+'_'+n];}
function markTheory(set,n){var t=lsGet('anik_trt',{});t[set+'_'+n]=Date.now();lsSet('anik_trt',t);}
// состояние темы: изучение = теория → игры → настоящие задания
function numState(set,n){
  var st=snap(),x=INDEX.sets[set].numbers.filter(function(y){return y.n===n;})[0],sk=st&&st.skills&&x&&st.skills[x.skill];
  var pr=numStats(set,n),gm=gStats(set,n),th=theoryRead(set,n);
  var pp=pr.tot?pr.ok/pr.tot:null,gp=gm.tot?gm.ok/gm.tot:null;
  var know=sk?sk.p:pp!==null?pp:gp!==null?gp*0.6:0;
  var weak=(pr.tot>=3&&pp<0.6)||(gm.tot>=5&&gp<0.6)||(sk&&sk.n>=3&&sk.p<0.5);
  var step=!th&&!gm.tot&&!pr.tot?'new':!th?'theory':!gm.tot?'games':!pr.tot?'practice':weak?'weak':'done';
  return {n:n,th:th,pr:pr,gm:gm,know:know,weak:!!weak,step:step,last:Math.max(pr.d||0,gm.d||0)};
}
// план на сегодня без бота: что западает → следующая новая тема → давно не повторяли
function localPlan(set){
  var all=INDEX.sets[set].numbers.map(function(x){var s=numState(set,x.n);s.name=x.name;return s;}),out=[],used={};
  var add=function(s,why){if(out.length<3&&!used[s.n]){used[s.n]=1;out.push({n:s.n,name:s.name,why:why,step:s.step});}};
  all.filter(function(s){return s.weak;}).sort(function(a,b){return a.know-b.know;}).forEach(function(s){add(s,'weak');});
  all.filter(function(s){return s.step!=='new'&&s.step!=='done'&&s.step!=='weak';}).forEach(function(s){add(s,'cont');});
  all.filter(function(s){return s.step==='new';}).slice(0,1).forEach(function(s){add(s,'new');});
  var week=Date.now()-5*864e5;
  all.filter(function(s){return s.step==='done'&&s.last<week;}).sort(function(a,b){return a.last-b.last;}).forEach(function(s){add(s,'repeat');});
  return out;
}
var STEP_TXT={new:'не начато',theory:'прочитай теорию',games:'сыграй в игры',practice:'реши настоящие задания',weak:'западает',done:'изучено'};

/* ───────── экраны ───────── */

function learnHtml(set,n){
  var s=numState(set,n),S=INDEX.sets[set],i=S.numbers.map(function(x){return x.n;}).indexOf(n),nx=S.numbers[i+1];
  var row=function(k,title,sub,done,cur){return '<button class="lstep'+(done?' done':'')+(cur?' cur':'')+'" data-go="'+k+'"><i>'+(done?'✓':'')+'</i><span><b>'+title+'</b><small>'+sub+'</small></span></button>';};

      }).join('')+(c.tip?'<div class="tip" style="margin-top:10px">'+esc(c.tip)+'</div>':'')+(c.warn?'<div class="warn" style="margin-top:10px">'+esc(c.warn)+'</div>':'')+'</div>';
  }).join('');
}
function loadTheory(set,n,col){
  markTheory(set,n);
  var box=document.getElementById('theory'),key=set+'_'+n;
  if(box.dataset.done)return;
  var put=function(html){box.outerHTML='<div id="theory" data-done="1">'+html+'</div>';};
  var soon='<div class="card"><div class="txt"><p><b>Теория скоро появится.</b></p><p>Конспект по заданию №'+n+' будет здесь, рядом с практикой.</p></div></div>';

/* ───────── игры к заданию: вопросы с вариантами ответа ───────── */
var GAME_KIND={'oge-rus':'q','oge-math':'p'};            // буква в строке результата n_… (игра, не настоящее задание)
var G=null;
function gbox(){return document.getElementById('pan-g');}
function loadGames(set,n,col){
  var box=gbox();
  if(box.dataset.ready)return;
  var soon='<div class="card"><div class="txt"><p><b>Игры и упражнения готовим.</b></p><p>Здесь появятся игры, которые подводят к этому заданию. Пока тренируйся в «Практике».</p></div></div>';
  if(!GAME_KIND[set]){box.innerHTML=soon;box.dataset.ready='1';return;}
  getJSON('trainer/games_'+set+'_'+n+'.json').then(function(d){
    box.dataset.ready='1';
    G={set:set,n:n,col:col,games:d.games};
    gamesList();
  }).catch(function(){box.innerHTML=soon;box.dataset.ready='1';});
}
function gamesList(){
  var box=gbox();
  box.innerHTML='<p class="lead">Короткие игры по 10 вопросов — они тренируют навык, который нужен в этом задании. После ответа видно правило из теории.</p>'+
    G.games.map(function(g,i){
      var cnt=g.items.length;
      return '<button class="gcard" data-g="'+i+'" style="--col:'+G.col+'"><b>'+esc(g.title)+'</b><span>'+esc(g.instruction)+' · '+cnt+' '+plural(cnt,'вопрос','вопроса','вопросов')+'</span></button>';
    }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('[data-g]'),function(b){b.onclick=function(){openGame(+b.dataset.g);};});
  G.round=null;
}
function openGame(i){
  var g=G.games[i];G.gi=i;G.mode=G.mode||lsGet('anik_gmode','why');
  if(g.cats.length<2&&!g.why)return startRound(null);
  var box=gbox();
  box.innerHTML='<div class="ph"><span><b>'+esc(g.title)+'</b></span></div>'+
    (g.why?'<p class="lead">Режим</p><div class="chips" id="gmode"><button class="chip'+(G.mode==='letter'?' mix':'')+'" data-m="letter">Только ответ</button><button class="chip'+(G.mode==='why'?' mix':'')+'" data-m="why">Ответ и почему</button></div>':'')+
    (g.cats.length>1?'<p class="lead">Выбери тему или играй вперемешку.</p><div class="chips">'+
    '<button class="chip mix" data-c="">Вперемешку</button>'+
    g.cats.map(function(c){var k=g.items.filter(function(x){return x.c===c.id;}).length;return '<button class="chip" data-c="'+esc(c.id)+'">'+esc(c.name)+' <small>'+k+'</small></button>';}).join('')+'</div>':
    '<button class="btn" data-c="">Начать</button>')+
    '<button class="btn sec" id="gback">← К играм</button>';
  Array.prototype.forEach.call(box.querySelectorAll('[data-m]'),function(b){b.onclick=function(){G.mode=b.dataset.m;lsSet('anik_gmode',G.mode);openGame(i);};});
  Array.prototype.forEach.call(box.querySelectorAll('[data-c]'),function(b){b.onclick=function(){startRound(b.dataset.c||null);};});
  document.getElementById('gback').onclick=gamesList;
}
function startRound(cat){
  var g=G.games[G.gi],pool=g.items.filter(function(x){return !cat||x.c===cat;});
  pool=pool.slice().sort(function(){return Math.random()-.5;}).slice(0,10);
  G.round={cat:cat,items:pool,i:0,ok:0,res:[],answered:false};
  gameQ();
}
function gHead(R,g){
  return '<div class="ph"><span>'+esc(g.title)+' · <b>'+(R.i+1)+'</b> из '+R.items.length+'</span><button class="back" id="gquit" style="min-height:32px;height:32px;font-size:13px">Закончить</button></div>'+
    '<div class="dots">'+R.items.map(function(_,k){var r=R.res[k];return '<span class="dot '+(r===undefined?(k===R.i?'cur':''):r?'ok':'bad')+'"></span>';}).join('')+'</div>';
}
function gWire(R,g,x){
  document.getElementById('greport').onclick=function(){window.anikReport&&anikReport('gm-'+(G.set==='oge-rus'?'r':'o')+pad2(G.n)+'-'+(G.gi+1)+'-'+g.items.indexOf(x));};
  document.getElementById('gquit').onclick=function(){if(R.res.length)gameEnd();else gamesList();};
}
function gPassage(g,x){
  if(x.p===undefined||!g.passages)return '';
  return '<details class="card"><summary>Текст (открой и найди нужное место)</summary><div class="passage">'+esc(g.passages[x.p])+'</div></details>';
}
var REPORT_BTN='<button class="fblink" id="greport">⚠️ Ошибка в вопросе?</button>';
function gameQ(){
  var R=G.round,g=G.games[G.gi];
  if(R.i>=R.items.length)return gameEnd();
  var x=R.items[R.i];
  R.cur=x;R.answered=false;R.tries=0;
  if(x.k==='basis')return basisQ(R,g,x);
  if(x.k==='tap')return tapQ(R,g,x);
  var o=x.o.slice();
  if(o.length>=4)o.sort(function(){return Math.random()-.5;});
  gbox().innerHTML=gHead(R,g)+gPassage(g,x)+
    '<div class="card"><div class="gq">'+x.w+'</div></div>'+
    '<div class="opts">'+o.map(function(t,k){return '<button class="optb" data-k="'+k+'">'+esc(t)+'</button>';}).join('')+'</div><div id="gfb"></div>'+REPORT_BTN;
  gWire(R,g,x);
  Array.prototype.forEach.call(gbox().querySelectorAll('.optb'),function(b){b.onclick=function(){gameAnswer(b,x);};});
}
function gFeedback(ok,x,extra,label){
  var R=G.round,last=R.i+1>=R.items.length;
  document.getElementById('gfb').innerHTML='<div class="fb '+(label?'hintq':ok?'good':'bad')+'">'+(label||(ok?'Верно':'Неверно'))+(extra||'')+
    (x.h?'<small>'+esc(x.h)+'</small>':'')+'</div><button class="btn sec" id="gtheory">Открыть теорию</button><button class="btn" id="gnext">'+(last?'Итог':'Дальше')+'</button>';
  document.getElementById('gnext').onclick=function(){R.i++;gameQ();};
  document.getElementById('gtheory').onclick=function(){var t=document.querySelector('.tabs2 [data-t=t]');if(t){t.click();window.scrollTo(0,0);}};
}
function gameAnswer(btn,x){
  var R=G.round;
  if(R.answered)return;
  var ok=btn.textContent===x.a,btns=gbox().querySelectorAll('.optb');
  // наводящий вопрос: после первой ошибки — подсказка и ещё одна попытка (в зачёт идёт первая)
  if(!ok&&x.q&&!R.tries){
    R.tries=1;
    btn.classList.add('wrong');btn.disabled=true;
    document.getElementById('gfb').innerHTML='<div class="fb hintq">Не совсем. Подумай:<small>'+esc(x.q)+'</small></div><button class="btn sec" id="gshow">Показать ответ</button>';
    document.getElementById('gshow').onclick=function(){R.tries=2;var r=[].filter.call(btns,function(b){return b.textContent===x.a;})[0];gameAnswer(r,x);};
    return;
  }
  R.answered=true;
  var second=R.tries===1&&ok;
  if(R.tries)ok=false;
  [].forEach.call(btns,function(b){
    b.disabled=true;
    if(b.textContent===x.a)b.classList.add('right');else if(b===btn)b.classList.add('wrong');
  });
  // второй шаг «почему?»
  if(x.r&&G.mode==='why'&&G.games[G.gi].why){
    R.res[R.i]=false;
    var ro=x.ro.slice().sort(function(){return Math.random()-.5;});
    var gfb=document.getElementById('gfb');
    gfb.innerHTML='<div class="fb '+(ok||second?'good':'bad')+'">'+(ok?'Верно!':second?'Со второй попытки.':'Ответ: '+esc(x.a)+'.')+' А теперь — почему так?</div>'+
      '<div class="opts" id="why">'+ro.map(function(t){return '<button class="optb">'+esc(t)+'</button>';}).join('')+'</div><div id="gfb2"></div>';
    [].forEach.call(document.querySelectorAll('#why .optb'),function(b){b.onclick=function(){
      var ok2=b.textContent===x.r;
      [].forEach.call(document.querySelectorAll('#why .optb'),function(c){c.disabled=true;if(c.textContent===x.r)c.classList.add('right');else if(c===b)c.classList.add('wrong');});
      R.res[R.i]=ok&&ok2;if(ok&&ok2)R.ok++;
      gfb.id='gfb0';document.getElementById('gfb2').id='gfb';
      gFeedback(ok&&ok2,x,ok2?(ok?'':' — правило выбрано верно'):'. Правило: '+esc(x.r));
    };});
    return;
  }
  R.res[R.i]=ok;if(ok)R.ok++;
  if(second)gFeedback(false,x,'','Со второй попытки — получилось! Запомни, как рассуждать:');
  else gFeedback(ok,x,ok?'':'. Правильный ответ: '+esc(x.a));
}
/* грамматическая основа: одна черта — подлежащее, две — сказуемое */
function basisWords(t){return t.split(' ').map(function(w){var m=w.match(/\/([SP])(\d)([.,!?:;»]*)$/);return m?{w:w.slice(0,m.index)+m[3],k:m[1]}:{w:w,k:null};});}
function basisQ(R,g,x){
  var ws=basisWords(x.t);R.marks=ws.map(function(){return null;});R.tool=R.tool||'S';
  gbox().innerHTML=gHead(R,g)+
    '<div class="card"><p class="lead" style="font-size:14px">Перетащи черту на слово или выбери черту и коснись слова. Коснись ещё раз — снять. В сложном предложении отметь все основы.</p>'+
    '<div class="tools"><button class="tool'+(R.tool==='S'?' on':'')+'" data-tool="S"><span class="ln1"></span>подлежащее</button><button class="tool'+(R.tool==='P'?' on':'')+'" data-tool="P"><span class="ln2"></span>сказуемое</button></div>'+
    '<div class="bw">'+ws.map(function(w,k){return '<button class="wd" data-wi="'+k+'">'+esc(w.w)+'</button>';}).join(' ')+'</div></div>'+
    '<div id="gfb"><button class="btn" id="bchk">Проверить</button></div>'+REPORT_BTN;
  gWire(R,g,x);
  var apply=function(k,tool){if(R.answered)return;R.marks[k]=R.marks[k]===tool?null:tool;var b=gbox().querySelector('[data-wi="'+k+'"]');b.classList.toggle('s',R.marks[k]==='S');b.classList.toggle('p',R.marks[k]==='P');};
  [].forEach.call(gbox().querySelectorAll('.wd'),function(b){b.onclick=function(){apply(+b.dataset.wi,R.tool);};});
  [].forEach.call(gbox().querySelectorAll('.tool'),function(b){
    var pick=function(){R.tool=b.dataset.tool;[].forEach.call(gbox().querySelectorAll('.tool'),function(c){c.classList.toggle('on',c===b);});};
    b.onclick=pick;
    b.onpointerdown=function(e){
      pick();
      var tool=b.dataset.tool,ghost=null,x0=e.clientX,y0=e.clientY;
      var mv=function(ev){
        if(!ghost&&Math.abs(ev.clientX-x0)+Math.abs(ev.clientY-y0)<8)return;
        if(!ghost){ghost=document.createElement('div');ghost.className='ghost '+(tool==='S'?'s':'p');document.body.appendChild(ghost);}
        ghost.style.left=(ev.clientX-24)+'px';ghost.style.top=(ev.clientY-14)+'px';};
      var up=function(ev){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
        if(!ghost)return;ghost.remove();
        var el=document.elementFromPoint(ev.clientX,ev.clientY);el=el&&el.closest&&el.closest('[data-wi]');if(el)apply(+el.dataset.wi,tool);};
      document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
    };
  });
  document.getElementById('bchk').onclick=function(){
    if(R.answered)return;
    if(!R.marks.some(Boolean))return;
    R.answered=true;
    var ok=ws.every(function(w,k){return (R.marks[k]||null)===w.k;});
    R.res[R.i]=ok;if(ok)R.ok++;
    [].forEach.call(gbox().querySelectorAll('.wd'),function(b){var k=+b.dataset.wi,w=ws[k];b.disabled=true;
      b.classList.remove('s','p');if(w.k)b.classList.add(w.k==='S'?'s':'p');
      if((R.marks[k]||null)!==w.k)b.classList.add(R.marks[k]&&!w.k?'xw':'miss');});
    var clean=function(w){return w.w.replace(/[.,!?:;»]+$/,'');};
    var subj=ws.filter(function(w){return w.k==='S';}).map(clean).join(' '),pred=ws.filter(function(w){return w.k==='P';}).map(clean).join(' ');
    gFeedback(ok,x,ok?'':'. Подлежащее: '+esc(subj||'нет (односоставное)')+'; сказуемое: '+esc(pred||'нет')+'. Жёлтым — что пропущено, красным — лишнее.');
  };
}
/* коснись слова в тексте */
function tapQ(R,g,x){
  var ws=x.t.split(' ');R.sel={};
  gbox().innerHTML=gHead(R,g)+'<div class="card"><div class="gq" style="margin-bottom:10px">'+x.w+'</div><div class="bw">'+
    ws.map(function(w,k){return '<button class="wd" data-wi="'+k+'">'+esc(w)+'</button>';}).join(' ')+'</div></div>'+
    '<div id="gfb"><button class="btn" id="tchk">Проверить</button></div>'+REPORT_BTN;
  gWire(R,g,x);
  [].forEach.call(gbox().querySelectorAll('.wd'),function(b){b.onclick=function(){if(R.answered)return;var k=+b.dataset.wi;R.sel[k]=!R.sel[k];b.classList.toggle('on',R.sel[k]);};});
  document.getElementById('tchk').onclick=function(){
    if(R.answered)return;
    var picked=Object.keys(R.sel).filter(function(k){return R.sel[k];}).map(Number).sort(function(a,b){return a-b;});
    if(!picked.length)return;
    R.answered=true;
    var want=x.ta.slice().sort(function(a,b){return a-b;}),ok=picked.join()===want.join();
    R.res[R.i]=ok;if(ok)R.ok++;
    [].forEach.call(gbox().querySelectorAll('.wd'),function(b){var k=+b.dataset.wi;b.disabled=true;b.classList.remove('on');
      if(want.indexOf(k)>=0)b.classList.add('right');else if(R.sel[k])b.classList.add('wrong');});
    gFeedback(ok,x,ok?'':'. Верно: '+esc(want.map(function(k){return ws[k];}).join(' ').replace(/[.,!?]$/,'')));
  };
}
function gameEnd(){
  var R=G.round,tot=R.res.length;
  if(!tot)return gamesList();
  setTimeout(function(){window.anikPlanDone&&anikPlanDone();},700);
  var ok=R.ok,ratio=ok/tot,cls=ratio>=.8?'g':ratio>=.5?'y':'r';
  addStats(G.set,G.n,ok,tot,'anik_trg');
  var payload='n_'+GAME_KIND[G.set]+pad2(G.n)+pad2(ok)+pad2(tot);
  var sent=window.AnikSync&&AnikSync.send(payload),link='https://t.me/'+BOT_USERNAME+'?start='+payload;
  gbox().innerHTML='<div class="fin"><div class="fs '+cls+'">'+ok+'/'+tot+'</div><p class="lead" style="margin-top:8px">'+
    (ratio>=.8?'Отлично! Навык закрепляется.':ratio>=.5?'Неплохо. Загляни в теорию и сыграй ещё раз.':'Пока трудно — прочитай теорию и попробуй снова.')+'</p></div>'+
    (sent?'<div class="hint">Результат записан в твой прогресс — бот и репетитор его увидят.</div>':'<div class="hint">Чтобы бот учёл игру в твоём прогрессе, отправь результат.</div><button class="btn" id="gsend">Отправить результат боту</button>')+
    (ratio>=.7?'<button class="btn" id="gprac">Теперь — настоящие задания №'+G.n+'</button>':'')+
    '<button class="btn'+(ratio>=.7?' sec':'')+'" id="gagain">Ещё раз</button><button class="btn sec" id="gtheory2">Теория</button><button class="btn sec" id="glist">К играм</button>';
  var sb=document.getElementById('gsend');
  if(sb)sb.onclick=function(){if(TG&&TG.initData&&TG.openTelegramLink)TG.openTelegramLink(link);else window.open(link,'_blank');};
  document.getElementById('gagain').onclick=function(){startRound(R.cat);};
  document.getElementById('gtheory2').onclick=function(){var t=document.querySelector('.tabs2 [data-t=t]');if(t){t.click();window.scrollTo(0,0);}};
  document.getElementById('glist').onclick=gamesList;
  var gp=document.getElementById('gprac');if(gp)gp.onclick=function(){openTab('p');};
  G.round=null;
}

/* ───────── подход ───────── */
function start(set,n){
  document.getElementById('start').disabled=true;
  loadPack(set,n).then(function(pack){
    var seenKey='anik_seen_'+set+'_'+n,seen=lsGet(seenKey,[]);
    var fresh=pack.tasks.filter(function(t){return seen.indexOf(t.id)<0;});
    if(fresh.length<Math.min(SESSION,pack.tasks.length)){seen=[];fresh=pack.tasks.slice();}
    fresh.sort(function(){return Math.random()-.5;});
    var items=fresh.slice(0,SESSION);
    seen=seen.concat(items.map(function(t){return t.id;})).slice(-400);
    lsSet(seenKey,seen);
    run={set:set,n:n,pack:pack,items:items,i:0,res:[],answered:false};
    show();
  }).catch(function(){app.innerHTML='<div class="empty">Не получилось загрузить задания. Проверь интернет и вернись назад.</div>';});
}

function dotsHtml(){
  return '<div class="dots">'+run.items.map(function(_,k){var r=run.res[k];return '<span class="dot '+(r===undefined?(k===run.i?'cur':''):r?'ok':'bad')+'"></span>';}).join('')+'</div>';
}

function show(){
  if(run.i>=run.items.length)return finish();
  var t=run.items[run.i],S=INDEX.sets[run.set];
  var passage=t.p!==undefined?run.pack.passages[t.p]:null;
  var ph={num:'Ответ числом (можно дробью 3/7 или с запятой 0,35)',seq:'Цифры подряд, например 134',set:'Цифры подряд, например 134',word:'Одно слово'}[t.k]||'Ответ';
  var figs=(t.f||[]).map(function(f){return '<img class="fig" src="'+esc(f)+'" alt="Чертёж к заданию" loading="lazy">';}).join('');
  app.innerHTML='<div class="bar-top"><span class="wm">аник<i>.</i></span><button class="back" id="quit">Закончить</button></div>'+
    '<div class="ph"><span>Задание <b>'+(run.i+1)+'</b> из '+run.items.length+' · №'+run.n+'</span><span>'+esc(S.title)+'</span></div>'+dotsHtml()+
    (passage?'<details class="card" open><summary>Текст для чтения</summary><div class="passage">'+esc(passage)+'</div></details>':'')+
    '<div class="card"><div class="txt">'+renderText(t.t)+'</div>'+figs+(t.s?'<div class="src">Источник: '+esc(t.s)+'</div>':'')+'</div>'+
    '<input class="inp" id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="'+(t.k==='word'?'text':'text')+'" placeholder="'+esc(ph)+'">'+
    nbsHtml(t)+'<div id="fb"></div>'+
    '<div id="acts"><button class="btn" id="chk">Проверить</button><button class="btn sec" id="skip">Не знаю</button></div>'+
    '<button class="fblink" id="report">⚠️ Ошибка в задании или в ответе?</button>';
  document.getElementById('report').onclick=function(){window.anikReport&&anikReport(t.id);};
  var inp=document.getElementById('ans');
  wireNbs(t,inp);
  document.getElementById('chk').onclick=check;
  document.getElementById('skip').onclick=function(){reveal(null);};
  document.getElementById('quit').onclick=function(){if(run.res.length)finish();else go(run.set+'&n='+run.n);};
  inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();check();}};
  inp.focus({preventScroll:true});
}

// ответ «цифры подряд»: столько кнопок, сколько вариантов в условии («1)», «2)»…) или мест для знаков «(1)»…«(9)»;
// не меньше старшей цифры ответа, чтобы ответ всегда можно было набрать. Нажатие дописывает или убирает цифру
function nbsCount(t){
  var txt=String(t.t),opts=txt.match(/(^|\n)\s*\d\)/g),marks=(txt.match(/\((\d)\)/g)||[]).map(function(x){return +x.charAt(1);});
  var n=opts?opts.length:marks.length?Math.max.apply(null,marks):5;
  (t.a||[]).forEach(function(a){digitsOf(a).split('').forEach(function(d){n=Math.max(n,+d);});});
  return Math.min(9,Math.max(5,n));
}
function nbsHtml(t){
  if(t.k!=='seq'&&t.k!=='set')return '';
  var n=nbsCount(t),h='';
  for(var i=1;i<=n;i++)h+='<button type="button" data-d="'+i+'" aria-pressed="false">'+i+'</button>';
  return '<div class="nbs" style="--cols:'+Math.min(n,5)+'">'+h+'</div>';
}
function wireNbs(t,inp){
  var box=app.querySelector('.nbs');if(!box)return;
  var sync=function(){Array.prototype.forEach.call(box.children,function(b){var on=inp.value.indexOf(b.dataset.d)>=0;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false');});};
  Array.prototype.forEach.call(box.children,function(b){b.onclick=function(){
    if(run.answered)return;
    var d=b.dataset.d,v=digitsOf(inp.value);
    v=v.indexOf(d)>=0?v.replace(d,''):v+d;
    if(t.k==='set')v=v.split('').sort().join('');
    inp.value=v;sync();
  };});
  inp.addEventListener('input',sync);
}
function check(){
  if(run.answered)return;
  var t=run.items[run.i],inp=document.getElementById('ans'),v=inp.value;
  if(!isAnswerShaped(t,v)){
    document.getElementById('fb').innerHTML='<div class="fb bad">'+(t.k==='num'?'Напиши ответ числом (например 0,35 или 3/7).':t.k==='word'?'Напиши ответ словом.':'Напиши цифры ответа (например 134).')+'</div>';
    return;
  }
  reveal(v);
}

function reveal(v){
  if(run.answered)return;
  run.answered=true;
  var t=run.items[run.i],ok=v!==null&&checkAnswer(t,v);
  run.res[run.i]=ok;
  var inp=document.getElementById('ans');
  inp.disabled=true;inp.classList.add(ok?'ok':'err');
  Array.prototype.forEach.call(app.querySelectorAll('.nbs button'),function(b){b.disabled=true;});
  var last=run.i+1>=run.items.length;
  document.getElementById('fb').innerHTML=ok?'<div class="fb good">Верно</div>':'<div class="fb bad">'+(v===null?'Пропущено':'Неверно')+'. Правильный ответ: '+esc(t.a[0])+(t.a.length>1&&t.k!=='word'?'<small>Подходят также: '+esc(t.a.slice(1,4).join(', '))+'</small>':'')+'</div>';
  document.getElementById('acts').innerHTML='<button class="btn" id="nx">'+(last?'Итог':'Дальше')+'</button>';
  document.getElementById('nx').onclick=function(){run.i++;run.answered=false;show();};
  var dots=document.querySelector('.dots');if(dots)dots.outerHTML=dotsHtml();
}

function payloadOf(){
  var ok=run.res.filter(Boolean).length,tot=run.res.length;
  return 'n_'+INDEX.sets[run.set].kind+pad2(run.n)+pad2(ok)+pad2(tot);
}

function finish(){
  setTimeout(function(){window.anikPlanDone&&anikPlanDone();},700);
  var tot=run.res.length;
  if(!tot){go(run.set+'&n='+run.n);return;}
  var ok=run.res.filter(Boolean).length,ratio=ok/tot,cls=ratio>=.8?'g':ratio>=.5?'y':'r';
  addStats(run.set,run.n,ok,tot);
  var payload=payloadOf(),sent=window.AnikSync&&AnikSync.send(payload);
  var link='https://t.me/'+BOT_USERNAME+'?start='+payload;
  var S=INDEX.sets[run.set];
  var marks=run.res.map(function(r,k){return '<span class="'+(r?'ok':'bad')+'">'+(k+1)+'</span>';}).join('');
  var list=run.items.slice(0,tot).map(function(t,k){return run.res[k]?'':'<div><b>'+(k+1)+'</b><span>ответ: '+esc(t.a[0])+'</span></div>';}).join('');
  var x=S.numbers.filter(function(y){return y.n===run.n;})[0];
  app.innerHTML='<div class="res-hero" style="'+AnikLook.style(numSkin(run.set,run.n))+'"><span class="ra" aria-hidden="true">'+ok+'</span><span class="rb" aria-hidden="true">'+tot+'</span>'+
    '<div class="tn">'+esc(S.title)+' · № '+pad2(run.n)+(x?' · '+esc(x.name):'')+'</div><h2>'+ok+' из '+tot+'.</h2></div>'+
    '<p class="lead">'+(ratio>=.8?'Отлично! Тема получается.':ratio>=.5?'Неплохо. Разбери ошибки и закрепи ещё одним подходом.':'Эта тема пока трудная — ничего, повтори ещё раз.')+'</p>'+
    '<div class="stl">Ответы по порядку</div><div class="marks">'+marks+'</div>'+
    (sent?'<div class="hint">Результат записан в твой прогресс — бот и репетитор его увидят.</div>':
      '<div class="hint">Чтобы бот учёл подход в твоём прогрессе, отправь результат.</div><button class="btn" id="sendbtn">Отправить результат боту</button>')+
    '<div class="list">'+list+'</div>'+
    (function(){var i=S.numbers.map(function(y){return y.n;}).indexOf(run.n),nx=S.numbers[i+1];
      return ratio>=.8&&nx?'<button class="btn" id="nexttopic">Дальше: №'+nx.n+' '+esc(nx.name)+'</button>':ratio<.6?'<button class="btn" id="relearn">Повторить теорию и игры</button>':'';})()+
    '<button class="btn'+(ratio>=.8||ratio<.6?' sec':'')+'" id="again">Ещё подход</button><button class="btn sec" id="back">К номерам</button>';
  var sb=document.getElementById('sendbtn');
  if(sb)sb.onclick=function(){if(TG&&TG.initData&&TG.openTelegramLink)TG.openTelegramLink(link);else window.open(link,'_blank');};
  var set=run.set,n=run.n;
  document.getElementById('again').onclick=function(){go(set+'&n='+n);setTimeout(function(){var b=document.getElementById('start');if(b)b.click();},0);};
  document.getElementById('back').onclick=function(){go(set);};
  var nt=document.getElementById('nexttopic');if(nt){var i2=S.numbers.map(function(y){return y.n;}).indexOf(n);nt.onclick=function(){go(set+'&n='+S.numbers[i2+1].n+'&learn');};}
  var rl=document.getElementById('relearn');if(rl)rl.onclick=function(){go(set+'&n='+n+'&learn');};
  run=null;resultShown=true;
}

window.addEventListener('hashchange',route);
if(window.AnikSync)AnikSync.onState(function(){if(INDEX&&!run&&!resultShown){var h=location.hash.replace(/^#/,'');if(SETS[h.split('&')[0]])route();}});
route();
</script>
