<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аник — подготовка к ЕГЭ и ОГЭ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
// Старые ссылки из бота и закладок (#stress, #game=17, #skill=…) — ведём на нужную страницу
(function(){
  var h=location.hash;
  if(/^#(stress|paronyms|game=\d+)$/.test(h)){location.replace('rus-ege.html'+h);}
  else if(/^#(skill=\w+|n=\d+)$/.test(h)){location.replace('math.html'+h);}
})();
</script>
<style>
:root{--bg:#0a0a14;--card:#13132a;--card2:#1a1a35;--acc:#e94560;--g:#4ecca3;--y:#ffd700;--b:#74c0fc;--txt:#eaeaea;--m:#8a90a0;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:Segoe UI,system-ui,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:28px;font-weight:800;text-align:center;background:linear-gradient(135deg,var(--acc),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--m);text-align:center;font-size:15px;margin:6px 0 22px;line-height:1.5}
.step{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--m);margin:22px 0 10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{background:var(--card);border:2px solid #2a2a4e;border-radius:var(--r);padding:20px 12px;text-align:center;cursor:pointer;transition:all .15s;color:var(--txt);font-size:18px;font-weight:800}
.pick small{display:block;margin-top:6px;font-size:13px;font-weight:500;color:var(--m)}
.pick .ic{font-size:36px;display:block;margin-bottom:6px}
.pick:hover{border-color:var(--b)}
.pick.on{border-color:var(--acc);background:#1d1226}
.subj{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;margin-top:10px;width:100%}
.subj .ic{font-size:34px;margin:0}
.subj .t{flex:1}
.badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.badge.ready{background:#10281f;color:var(--g);border:1px solid #1f5a43}
.badge.pilot{background:#2a2410;color:var(--y);border:1px solid #5a4a1f}
.badge.soon{background:#1e1e30;color:var(--m);border:1px solid #33334d}
.subj.soon{opacity:.6;cursor:default}
.go{display:block;width:100%;margin-top:22px;padding:15px;border:none;border-radius:var(--r);background:var(--acc);color:#fff;font-size:17px;font-weight:800;cursor:pointer}
.go:disabled{opacity:.35;cursor:default}
.hint{color:var(--m);font-size:13px;text-align:center;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<main>
  <h1>Аник</h1>
  <p class="sub">Тренируйся по шагам: игры, разбор заданий и прогресс. Выбери экзамен и предмет.</p>

  <div class="step">1. Экзамен</div>
  <div class="row">
    <button class="pick" data-exam="ege"><span class="ic">🎓</span>ЕГЭ<small>11 класс</small></button>
    <button class="pick" data-exam="oge"><span class="ic">📘</span>ОГЭ<small>9 класс</small></button>
  </div>

  <div class="step" id="step2" style="display:none">2. Предмет</div>
  <div id="subjects"></div>

  <button class="go" id="go" disabled>Выбери экзамен и предмет</button>
  <p class="hint">Прогресс сохраняется на этом устройстве. Чтобы результаты видел бот-помощник, открывай приложение кнопкой в чате с ботом.</p>
</main>

<script>
// Каталог: что уже готово. Новые экзамены и предметы добавляются сюда.
var CATALOG={
  ege:{
    rus:{name:'Русский язык',icon:'📖',status:'ready',desc:'Все 26 заданий: теория, практика, игры',url:'rus-ege.html'},
    math:{name:'Математика (профиль)',icon:'📐',status:'pilot',desc:'Пилот: вероятность (№4–5), разбор по шагам',url:'math.html'}
  },
  oge:{
    rus:{name:'Русский язык',icon:'📖',status:'soon',desc:'Готовим материалы'},
    math:{name:'Математика',icon:'📐',status:'soon',desc:'Готовим материалы'}
  }
};
var BADGE={ready:'<span class="badge ready">готово</span>',pilot:'<span class="badge pilot">пилот</span>',soon:'<span class="badge soon">скоро</span>'};
var exam=null,subj=null;
var TG=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();}catch(e){}}
function save(){try{localStorage.setItem('anik_choice',JSON.stringify({exam:exam,subj:subj}))}catch(e){}}
function load(){try{var c=JSON.parse(localStorage.getItem('anik_choice')||'null');if(c&&CATALOG[c.exam]){exam=c.exam;subj=c.subj}}catch(e){}}

function render(){
  document.querySelectorAll('[data-exam]').forEach(function(b){b.classList.toggle('on',b.dataset.exam===exam)});
  var box=document.getElementById('subjects'),st=document.getElementById('step2');
  if(!exam){st.style.display='none';box.innerHTML='';}
  else{
    st.style.display='block';
    box.innerHTML=Object.keys(CATALOG[exam]).map(function(k){
      var s=CATALOG[exam][k];
      return '<button class="pick subj '+(s.status==='soon'?'soon':'')+(subj===k?' on':'')+'" data-subj="'+k+'"><span class="ic">'+s.icon+'</span><span class="t">'+s.name+' '+BADGE[s.status]+'<small>'+s.desc+'</small></span></button>';
    }).join('');
    box.querySelectorAll('[data-subj]').forEach(function(b){b.onclick=function(){
      var s=CATALOG[exam][b.dataset.subj];if(s.status==='soon')return;
      subj=b.dataset.subj;save();render();};});
  }
  var go=document.getElementById('go');
  var s=exam&&subj&&CATALOG[exam][subj];
  if(s&&s.status!=='soon'){go.disabled=false;go.textContent='Играть: '+(exam==='ege'?'ЕГЭ':'ОГЭ')+' · '+s.name+' →';}
  else{go.disabled=true;go.textContent=exam?'Выбери предмет':'Выбери экзамен и предмет';}
}
document.querySelectorAll('[data-exam]').forEach(function(b){b.onclick=function(){exam=b.dataset.exam;if(!CATALOG[exam][subj]||CATALOG[exam][subj].status==='soon')subj=null;save();render();}});
document.getElementById('go').onclick=function(){var s=CATALOG[exam][subj];if(s&&s.url)location.href=s.url;};
load();render();
</script>
</body>
</html>
