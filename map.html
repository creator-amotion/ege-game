<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F3EEE2">
<title>Аник — карта знаний</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Golos+Text:wght@400..700&display=swap">
<link rel="stylesheet" href="anik.css?v=5">
<script src="anik-look.js?v=1"></script>
<script src="anik-sync.js?v=3"></script>
<script src="anik-nav.js?v=6" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
main{max-width:560px;margin:0 auto;padding:18px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.back{min-height:40px;padding:0 12px;border:2px solid var(--ink);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center}
h1{font-family:var(--display);font-size:36px;font-weight:800;letter-spacing:-1.4px;line-height:1;margin:14px 0 6px}
.lead{font-size:15px;line-height:1.5}
.stl{margin:24px 0 10px;padding-top:8px;border-top:2px solid var(--ink);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;display:inline-block;border:1px solid var(--ink)}
.l0{background:#fff}.l1{background:#E8E2D2}.l2{background:#F6CE2E}.l3{background:#F49AC1}.l4{background:#7098F8}.l5{background:#2E55C9}
.subj{background:#fff;padding:12px 14px;margin-top:8px}
.subj b{font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:-.3px}
.subj small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.meter{display:flex;height:10px;margin-top:8px;background:#F3EEE2}
.meter i{display:block;height:100%}
.flag{display:block;padding:10px 12px;margin-top:6px;background:#fff;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.4;border-left:6px solid var(--line2)}
.flag.weak{border-color:#E5332A}.flag.rev{border-color:#F6CE2E}.flag.next{border-color:#2E55C9}
.flag small{display:block;font-size:12px;color:var(--muted)}
.num{background:#fff;margin-top:6px}
.num summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center}
.num summary::-webkit-details-marker{display:none}
.num .nn{font-family:var(--display);font-weight:800;font-size:18px}
.num .nm{font-size:14px;font-weight:600;line-height:1.25}
.cells{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;max-width:120px}
.cells i{width:12px;height:12px;border:1px solid rgba(17,17,17,.35)}
.cells i.w{outline:2px solid #E5332A;outline-offset:-2px}
.part{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.part .pt{font-size:13.5px;line-height:1.35}
.part .lv{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.part .lv b{color:var(--ink)}
.part a{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;border:2px solid var(--ink);padding:5px 8px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;margin-left:4px;vertical-align:1px}
.tag.weak{background:#E5332A;color:#111}.tag.rev{background:#F6CE2E}
.advice{font-size:12.5px;color:var(--ink);margin-top:3px;line-height:1.4}
.empty{padding:18px 14px;background:#fff;margin-top:12px;font-size:15px;line-height:1.5}
.how{font-size:13px;line-height:1.55;background:#fff;padding:12px 14px}
.how li{margin:4px 0 0 18px}
</style>
</head>
<body>
<main id="app"><div class="empty">Загружаю карту…</div></main>
<script>
/* Карта знаний: предмет → номер → часть темы, уровень 0–5 (считает бот: knowledge_map.py).
   Код карты приходит в ссылке (?k=1.<символ на часть>) или в снимке облака (kmap); каталог частей — knowledge_catalog.json.
   Символ: 0–5 — уровень; A–F — уровень 0–5 и «западает»; a–f — уровень 0–5 и «пора повторить».
   ?t=1 — вид для репетитора: те же данные плюс подсказки, как помочь. */
var TG=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor('#F3EEE2');TG.setBackgroundColor('#F3EEE2');}catch(e){}}
var app=document.getElementById('app');
var Q=new URLSearchParams(location.search),TUTOR=Q.get('t')==='1';
var LEVEL=['не начато','познакомился','знает теорию','решает с опорой','решает сам','устойчиво'];
var SHORT={'ege.rus':'Русский','ege.math':'Математика','ege.mathb':'Математика (база)','oge.rus':'Русский (ОГЭ)','oge.math':'Математика (ОГЭ)'};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function decodeCode(c){
  return String(c||'').split('').map(function(ch){
    var i='ABCDEF'.indexOf(ch);if(i>=0)return {l:i,weak:true,rev:false};
    i='abcdef'.indexOf(ch);if(i>=0)return {l:i,weak:false,rev:true};
    var n=+ch;return {l:isNaN(n)?0:Math.max(0,Math.min(5,n)),weak:false,rev:false};
  });
}
function codeFromState(){
  var k=Q.get('k');
  if(k&&/^1\./.test(k))return k.slice(2);
  var st=window.AnikSync&&AnikSync.state&&AnikSync.state();
  return st&&st.kmap?String(st.kmap).replace(/^1\./,''):'';
}
// куда вести из части: в изучение этой части (как в плане дня)
function learnLink(subj,n,id){
  if(subj==='ege.rus')return /^r\d+$/.test(id)?'rus-ege.html#learn='+n:'rus-ege.html#learn='+n+'&t='+id;
  if(subj==='ege.math')return 'math.html#n='+n;
  if(subj==='ege.mathb')return 'trainer.html#ege-mathb&n='+n;
  return 'trainer.html#'+subj.replace('.','-')+'&n='+n+'&learn';
}
// входная диагностика номера (есть у русского ЕГЭ и профильной математики)
function diagLink(subj,n){return subj==='ege.rus'?'rus-ege.html#diag='+n:subj==='ege.math'?'math.html#diag='+n:'';}
// подсказка репетитору по уровню части
function advice(p){
  if(p.weak)return 'Западает: разберите с учеником ошибки по этой части, перечитайте правило и дайте тест по теории, потом игру.';
  if(p.rev)return 'Давно не повторял: дайте 5–10 настоящих заданий — проверка памяти без подсказок.';
  return ['Не начато: начните с теории и теста по теории («Изучить»).','Теория открыта, но тест не пройден: пусть пройдёт тест по теории.',
    'Теорию знает: нужна игра или разбор по шагам по этой части.','Решает с опорой: давайте настоящие задания из экзамена, в разные дни.',
    'Решает сам: нужна проверка через неделю — повторение без предупреждения.','Устойчиво: достаточно редких повторений.'][p.l];
}
function render(cat,code){
  var cells=decodeCode(code),k=0,subs=[];
  cat.order.forEach(function(key){
    var S=cat.subjects[key],nums=S.numbers.map(function(n){
      var parts=n.parts.map(function(pp){var c=cells[k++]||{l:0,weak:false,rev:false};return {id:pp[0],title:pp[1],l:c.l,weak:c.weak,rev:c.rev};});
      return {n:n.n,name:n.name,parts:parts};
    });
    var all=[].concat.apply([],nums.map(function(n){return n.parts;}));
    var started=all.filter(function(p){return p.l>0;}).length;
    subs.push({key:key,name:S.name,nums:nums,all:all,started:started,pct:all.length?Math.round(100*all.reduce(function(a,p){return a+p.l;},0)/(5*all.length)):0});
  });
  var active=subs.filter(function(s){return s.started;}),h='';
  h+='<div class="top"><a class="back" href="today.html">← Сегодня</a><span class="date">'+(TUTOR?'для репетитора':'')+'</span></div>';
  h+='<h1>'+(TUTOR?'Карта знаний ученика':'Моя карта знаний')+'</h1>';
  h+='<p class="lead">Каждое задание экзамена разбито на части. У каждой части — уровень: от «не начато» до «устойчиво». Уровень растёт только после нескольких проверок в разные дни, а ошибки при повторении его снижают.</p>';
  h+='<div class="legend">'+LEVEL.map(function(t,i){return '<span><i class="sw l'+i+'"></i>'+i+' '+t+'</span>';}).join('')+'</div>';
  if(!active.length){
    h+='<div class="empty"><b>Карта пока пустая.</b><br>Она заполнится после первых занятий: открой тему в «Изучить», пройди тест по теории, сыграй и реши задания. '+(code?'':'Открой карту из бота — так в ней будут твои данные.')+'</div>';
    app.innerHTML=h;return;
  }
  h+='<div class="stl"><span>Предметы</span><span>освоено</span></div>';
  active.forEach(function(s){
    var by=[0,0,0,0,0,0];s.all.forEach(function(p){by[p.l]++;});
    h+='<div class="subj"><b>'+esc(SHORT[s.key]||s.name)+' · '+s.pct+'%</b><small>начато частей '+s.started+' из '+s.all.length+' · решает сам или устойчиво: '+(by[4]+by[5])+'</small><div class="meter">'+
      [5,4,3,2,1].map(function(l){return by[l]?'<i class="l'+l+'" style="width:'+(100*by[l]/s.all.length)+'%"></i>':'';}).join('')+'</div></div>';
  });
  var weak=[],rev=[],next=[];
  active.forEach(function(s){
    s.nums.forEach(function(n){n.parts.forEach(function(p){var w={s:s.key,n:n.n,p:p};if(p.weak)weak.push(w);else if(p.rev)rev.push(w);});});
    var c=[];s.nums.forEach(function(n){n.parts.forEach(function(p){if(p.l<4&&!p.weak)c.push({s:s.key,n:n.n,p:p});});});
    c.sort(function(a,b){return ((a.p.l===0)-(b.p.l===0))||(a.p.l-b.p.l)||(a.n-b.n);});
    next=next.concat(c.slice(0,2));
  });
  var multi=active.length>1,lab=function(w){return (multi?esc(SHORT[w.s])+' · ':'')+'№'+w.n+' · '+esc(w.p.title);};
  if(weak.length){h+='<div class="stl"><span>Западает</span><span>'+weak.length+'</span></div>'+weak.slice(0,8).map(function(w){return '<a class="flag weak" href="'+learnLink(w.s,w.n,w.p.id)+'">'+lab(w)+'<small>'+(TUTOR?esc(advice(w.p)):'Свежие ошибки. Перечитай правило, пройди тест по теории и игру — потом снова задания.')+'</small></a>';}).join('');}
  if(rev.length){h+='<div class="stl"><span>Пора повторить</span><span>'+rev.length+'</span></div>'+rev.slice(0,6).map(function(w){return '<a class="flag rev" href="'+learnLink(w.s,w.n,w.p.id)+'">'+lab(w)+'<small>'+(TUTOR?esc(advice(w.p)):'Давно не было занятий — реши несколько заданий, чтобы знание не ушло.')+'</small></a>';}).join('');}
  if(next.length){h+='<div class="stl"><span>'+(TUTOR?'Что дать дальше':'Что изучать дальше')+'</span></div>'+next.map(function(w){return '<a class="flag next" href="'+learnLink(w.s,w.n,w.p.id)+'">'+lab(w)+'<small>Сейчас: '+w.p.l+' — '+LEVEL[w.p.l]+'. '+esc(advice(w.p))+'</small></a>';}).join('');}
  active.forEach(function(s){
    h+='<div class="stl"><span>'+esc(s.name)+'</span><span>по номерам</span></div>';
    s.nums.forEach(function(n){
      var avg=n.parts.reduce(function(a,p){return a+p.l;},0)/n.parts.length,hasW=n.parts.some(function(p){return p.weak;});
      h+='<details class="num"'+(hasW?' open':'')+'><summary><span class="nn">№'+n.n+'</span><span class="nm">'+esc(n.name)+'</span><span class="cells">'+n.parts.map(function(p){return '<i class="l'+p.l+(p.weak?' w':'')+'" title="'+esc(p.title)+'"></i>';}).join('')+'</span></summary>'+
        n.parts.map(function(p){
          return '<div class="part"><div class="pt">'+esc(p.title)+(p.weak?'<span class="tag weak">западает</span>':p.rev?'<span class="tag rev">повторить</span>':'')+
            '<span class="lv">уровень <b>'+p.l+'</b> — '+LEVEL[p.l]+'</span>'+(TUTOR?'<div class="advice">'+esc(advice(p))+'</div>':'')+'</div>'+
            '<a href="'+learnLink(s.key,n.n,p.id)+'">'+(p.l>=4?'Повторить':'Изучить')+'</a></div>';
        }).join('')+(avg===0&&diagLink(s.key,n.n)?'<div class="part"><div class="pt"><b>Не знаешь, с чего начать?</b><span class="lv">Несколько вопросов покажут, какие части уже получаются.</span></div><a href="'+diagLink(s.key,n.n)+'">Проверить</a></div>':'')+'</details>';
    });
  });
  h+='<div class="stl"><span>Как считается уровень</span></div><div class="how"><ol>'+
    '<li><b>1</b> — открыл тему или решил хотя бы одно задание.</li><li><b>2</b> — тест по теории в «Изучить» не ниже 2 из 3.</li>'+
    '<li><b>3</b> — игра или разбор по части от 70%, либо задания номера от 60%.</li><li><b>4</b> — настоящие задания от 75% (не меньше 8 ответов) в два разных дня.</li>'+
    '<li><b>5</b> — от 90% (не меньше 15 ответов), и занятия растянуты хотя бы на неделю.</li></ol>'+
    '<p style="margin-top:6px">Свежие ошибки по части ставят метку «западает» и ограничивают уровень тройкой. Если долго не заниматься — «пора повторить».</p></div>';
  app.innerHTML=h;
}
fetch('knowledge_catalog.json').then(function(r){return r.json();}).then(function(cat){
  var draw=function(){render(cat,codeFromState());};
  draw();
  if(window.AnikSync&&AnikSync.onState&&!Q.get('k'))AnikSync.onState(draw);
}).catch(function(){app.innerHTML='<div class="empty">Не получилось загрузить карту. Проверь интернет и обнови страницу.</div>';});
</script>
</body>
</html>
